name: Build Android APK v63 - 완후율

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build web
        run: |
          npm install
          npm run build

      - name: Add Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Apply 완후율 name, icon and back behavior
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import re, shutil, subprocess

          for fn in ["capacitor.config.ts","capacitor.config.js","capacitor.config.json"]:
              p=Path(fn)
              if p.exists():
                  s=p.read_text()
                  s=re.sub(r"appName\s*:\s*['\"][^'\"]*['\"]", "appName: '완후율'", s)
                  s=re.sub(r'"appName"\s*:\s*"[^"]*"', '"appName": "완후율"', s)
                  p.write_text(s)

          p=Path("www/index.html")
          if p.exists():
              s=p.read_text()
              s=re.sub(r"<title>.*?</title>","<title>완후율</title>",s,count=1,flags=re.I|re.S)
              if "wanhuyul-v63-back-handler" not in s:
                  patch="""<script id="wanhuyul-v63-back-handler">
          (function(){
            if(window.__wanhuyulV63Back)return;
            window.__wanhuyulV63Back=true;
            document.addEventListener('backbutton',function(e){
              try{
                e.preventDefault();
                if(typeof goHome==='function'){goHome();return;}
                if(typeof goToPage==='function'){goToPage('home');return;}
              }catch(_){}
            },true);
          })();
          </script>"""
                  s=s.replace("</body>",patch+"\n</body>",1)
              p.write_text(s)

          manifest=Path("android/app/src/main/AndroidManifest.xml")
          if manifest.exists():
              s=manifest.read_text()
              s=re.sub(r'android:label="[^"]*"','android:label="완후율"',s,count=1)
              manifest.write_text(s)

          values=Path("android/app/src/main/res/values/strings.xml")
          if values.exists():
              s=values.read_text()
              if 'name="app_name"' in s:
                  s=re.sub(r'<string name="app_name">.*?</string>',
                           '<string name="app_name">완후율</string>',s,count=1,flags=re.S)
              else:
                  s=s.replace("</resources>",'<string name="app_name">완후율</string></resources>')
              values.write_text(s)

          src=Path("/mnt/data/wanhuyul-icon.png")
          if not src.exists():
              src=Path("wanhuyul-icon.png")
          if src.exists():
              res=Path("android/app/src/main/res")
              for d,size in [("mipmap-mdpi",48),("mipmap-hdpi",72),
                             ("mipmap-xhdpi",96),("mipmap-xxhdpi",144),
                             ("mipmap-xxxhdpi",192)]:
                  out=res/d
                  out.mkdir(parents=True,exist_ok=True)
                  target=out/"ic_launcher.png"
                  try:
                      subprocess.run(["convert",str(src),"-resize",f"{size}x{size}",str(target)],check=True)
                  except Exception:
                      shutil.copy2(src,target)
                  shutil.copy2(target,out/"ic_launcher_round.png")
              s=manifest.read_text()
              if 'android:icon=' in s:
                  s=re.sub(r'android:icon="[^"]*"','android:icon="@mipmap/ic_launcher"',s,count=1)
              else:
                  s=s.replace("<application",'<application android:icon="@mipmap/ic_launcher"',1)
              if 'android:roundIcon=' in s:
                  s=re.sub(r'android:roundIcon="[^"]*"','android:roundIcon="@mipmap/ic_launcher_round"',s,count=1)
              else:
                  s=s.replace("<application",'<application android:roundIcon="@mipmap/ic_launcher_round"',1)
              manifest.write_text(s)
          PY

      - name: Native Android back button
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android/app/src/main/java/com/woorijip/family/MainActivity.java")
          if p.exists():
              s=p.read_text()
              if "wanhuyulV63OnBack" not in s:
                  add="""
            private boolean wanhuyulV63OnBack(){
              try{
                android.webkit.WebView v=getBridge().getWebView();
                if(v!=null){
                  v.evaluateJavascript("(function(){try{if(typeof goHome==='function'){goHome();return;}if(typeof goToPage==='function'){goToPage('home');}}catch(e){}})()",null);
                  return true;
                }
              }catch(Exception ignored){}
              return false;
            }

            @Override public void onBackPressed(){
              if(wanhuyulV63OnBack()) return;
              super.onBackPressed();
            }
          """
                  pos=s.rfind("}")
                  p.write_text(s[:pos]+add+s[pos:])
          PY

      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wanhuyul-apk-v63
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
