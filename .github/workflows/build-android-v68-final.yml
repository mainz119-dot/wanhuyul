                const popups=['personOverlay','locationDetailOverlay','placeLongPressOverlay','placeDetailOverlay','memberModal'];
                const home=document.getElementById('home');
                const onHome=!!(home&&home.classList.contains('active'));
                if(!onHome){goToPage('home');return 'handled';}
                if(popups.some(vis)){closeOverlaysForNavigation();return 'handled';}
