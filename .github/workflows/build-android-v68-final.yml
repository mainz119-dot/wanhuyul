name: Build 완후율 Android APK v68 - compile-fix

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
      - name: Accept Android SDK licenses and install packages
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"
      - name: Create Capacitor project
        shell: bash
        run: |
          set -e
          cat > package.json <<'JSON'
          {"private":true,"scripts":{"build":"node scripts/prepare-web.mjs && node scripts/bundle-native.mjs"},"dependencies":{"@capacitor/android":"8.5.1","@capacitor/cli":"8.5.1","@capacitor/core":"8.5.1","esbuild":"0.25.9","typescript":"5.9.2"}}
          JSON
          cat > capacitor.config.ts <<'EOF2'
          import type { CapacitorConfig } from '@capacitor/cli';
          const config: CapacitorConfig={appId:'com.woorijip.family',appName:'완후율',webDir:'www',android:{useLegacyBridge:false,adjustMarginsForEdgeToEdge:'disable'},server:{androidScheme:'https'}};
          export default config;
          EOF2
          mkdir -p scripts native
          cat > native/native-bridge.js <<'EOF2'
          (()=>{
            let tokenLast='';
            const native=()=>window.WoorijipNative&&typeof window.WoorijipNative.startNativeLocation==='function';
            const me=()=>{try{return(typeof currentUser!=='undefined'&&currentUser)||localStorage.getItem('woorijipMyName')||''}catch(e){return''}};
            const locOn=()=>{try{return localStorage.getItem('woorijipLocationSharing')==='1'||localStorage.getItem('woorijipLocationSharingEnabled')==='1'}catch(e){return false}};
            async function ensureAuth(){
              try{
                if(typeof sb==='undefined'||!sb.auth)return false;
                const s=await sb.auth.getSession();
                if(s.data?.session)return true;
                const r=await sb.auth.signInAnonymously();
                if(r.error){console.warn('[v25] anonymous auth:',r.error.message);return false;}
                return !!r.data?.session;
              }catch(e){console.warn('[v25] auth:',e);return false}
            }
            async function syncToken(){
              try{
                const user=me(), token=window.WoorijipNative?.getFcmToken?.()||'';
                if(!user||!token||typeof sb==='undefined')return;
                if(token===tokenLast)return;
                if(!(await ensureAuth()))return;
                const {error}=await sb.from('family_fcm_tokens').upsert({user_name:user,token,updated_at:new Date().toISOString()},{onConflict:'user_name'});
                if(error)console.warn('[v25] FCM token sync:',error.message);
                else{tokenLast=token;console.log('[v25] FCM token synced:',user);tokenLast=token}
              }catch(e){console.warn('[v25] token sync exception:',e)}
            }
            function keep(){
              if(!native())return;
              const u=me();if(!u)return;
              try{
                WoorijipNative.setLocationUser(u);
                if(locOn()) WoorijipNative.startNativeLocation();
                else WoorijipNative.stopNativeLocation();
              }catch(e){console.warn('[v25] GPS bridge',e)}
            }
            function pendingPush(){
              try{
                const raw=window.WoorijipNative?.getPendingPush?.();if(!raw)return;
                const d=JSON.parse(raw);window.WoorijipNative?.clearPendingPush?.();
                const age=d.sentTime?(Date.now()-Number(d.sentTime)):0;
                if(d.type==='video'&&d.from&&d.sentTime&&age>45000){
                  try{window.WoorijipNative?.cancelVideoCallNotification?.();}catch(e){}
                  console.log('[v62] stale video push ignored, age(ms)=',age);
                  return;
                }
                const go=()=>{
                  if(d.type==='video'&&d.from&&typeof window.verifyAndShowIncomingVideo==='function'){
                    /* v62: 앱이 꺼진 사이 발신자가 취소했을 수 있으므로, 발신자에게 아직 통화 중인지 확인한 뒤에만 받기/거절 창을 연다. */
                    window.verifyAndShowIncomingVideo(d);console.log('[v62] verify incoming video from',d.from);
                    return true;
                  }
                  if((d.type==='dm'||d.type==='group'||d.type==='chat')&&typeof window.goToPage==='function'){window.goToPage('chat');return true}
                  return false;
                };
                if(!go())setTimeout(()=>{if(!go())setTimeout(go,1500)},800);
              }catch(e){console.warn('[v25] pending push',e)}
            }
            /* v30: 영상통화 수신은 인증/FCM 토큰 동기화를 기다리지 않는다. */
            function fastPending(){try{pendingPush();}catch(e){console.warn('[v30] pending push:',e)}}
            fastPending();
            document.addEventListener('DOMContentLoaded',fastPending,{once:true});
            window.addEventListener('load',fastPending,{once:true});
            const fastTimer=setInterval(fastPending,500);
            setTimeout(()=>clearInterval(fastTimer),20000);
            async function boot(){fastPending();await ensureAuth();await syncToken();keep();fastPending();}
            setTimeout(boot,300);
            setInterval(()=>{syncToken();keep();fastPending();},3000);
          })();
          EOF2
          cat > scripts/prepare-web.mjs <<'EOF2'
          import fs from 'node:fs';
          import path from 'node:path';
          const root=process.cwd();
          const out=path.join(root,'www');
          const excluded=new Set(['.git','.github','android','www','node_modules','native','scripts','package.json','package-lock.json','capacitor.config.ts']);
          fs.rmSync(out,{recursive:true,force:true});
          fs.mkdirSync(out,{recursive:true});
          for(const name of fs.readdirSync(root)){
            if(excluded.has(name)) continue;
            fs.cpSync(path.join(root,name),path.join(out,name),{recursive:true});
          }
          const htmlPath=path.join(out,'index.html');
          let html=fs.readFileSync(htmlPath,'utf8');
          /* v55: patch the ORIGINAL app functions in the generated HTML.
             Global window wrappers were not reliably replacing the original global function bindings. */
          const v55PhotoPatch=`async function changeProfilePhoto(i,file){
            if(currentUser!==ADMIN_NAME){alert('관리자(아빠)만 프로필 사진을 변경할 수 있어요.');return;}
            if(!file)return;
            if(!file.type.startsWith('image/')){alert('이미지 파일만 선택할 수 있어요.');return;}
            try{
              const reader=new FileReader();
              const dataUrl=await new Promise((resolve,reject)=>{reader.onerror=()=>reject(reader.error||new Error('파일 읽기 실패'));reader.onload=()=>resolve(reader.result);reader.readAsDataURL(file);});
              profilePhotos[i]=dataUrl;
              localStorage.setItem('woorijipProfilePhotos',JSON.stringify(profilePhotos));
              renderFamily();renderBackgroundFamily();renderBackgroundDashboard();checkAdminPermissions();
              showToast(family[i]+'님의 프로필 사진을 공용 DB에 저장하고 있어요...');
              const row={member_name:family[i],photo_data:dataUrl,updated_by:currentUser,updated_at:new Date().toISOString()};
              const saved=await sb.from('family_profile_photos').upsert(row,{onConflict:'member_name'});
              if(saved.error)throw saved.error;
              const verify=await sb.from('family_profile_photos').select('member_name,photo_data,updated_at').eq('member_name',family[i]).maybeSingle();
              if(verify.error)throw verify.error;
              if(!verify.data?.photo_data)throw new Error('공용 프로필 사진 저장값을 확인하지 못했습니다.');
              profilePhotos[i]=verify.data.photo_data;
              localStorage.setItem('woorijipProfilePhotos',JSON.stringify(profilePhotos));
              renderFamily();renderBackgroundFamily();renderBackgroundDashboard();
              showToast(family[i]+'님의 프로필 사진을 가족 전체에 공유했어요.');
            }catch(e){console.error('[v55] profile photo save failed',e);alert('프로필 사진 공용 저장 실패: '+(e?.message||e));}
          }
          `;
          html=html.replace(/function changeProfilePhoto\(i,file\)\{[\s\S]*?\n\}\n\nfunction deleteFamilyMember/,v55PhotoPatch+'\nfunction deleteFamilyMember');

          /* v55: direct patch of original caller. No sendVideoSignal wrapper/delay. */
          html=html.replace(
            "sendVideoSignal({type:'invite',from:currentUser,to:name});",
            "try{ const started=Date.now(); const result=await sb.functions.invoke('send-push',{body:{record:{sender_name:currentUser,receiver_name:name,content:'영상통화'},type:'video'}}); console.log('[v59] VIDEO PUSH RESULT',JSON.stringify(result.data||null),result.error||null,'ms=',Date.now()-started); }catch(e){ console.warn('[v59] video push invoke',e); }\n    sendVideoSignal({type:'invite',from:currentUser,to:name});\n    clearTimeout(window.__vvCallerTimer); window.__vvCallerTimer=setTimeout(()=>{ try{ if(videoCallRole==='caller' && !window.__vvAccepted && videoTargetUser===name){ endVideoCall(); showToast('상대방이 응답하지 않아 통화를 종료했어요.'); } }catch(e){ console.warn('[v65] caller timeout',e); } },45000);"
          );
          /* v44: 현재 원본 initVideoCalling은 SUBSCRIBED 상태를 videoChannel.__ready에 기록하지 않아
             v30 accept 래퍼가 영원히 대기하는 문제를 수정한다. */
          html=html.replace(
            "if(status!=='SUBSCRIBED') console.warn('영상통화 채널 연결 상태:',status);",
            "if(status==='SUBSCRIBED'){videoChannel.__ready=true;console.log('[v44] video channel SUBSCRIBED');}else{videoChannel.__ready=false;console.warn('영상통화 채널 연결 상태:',status);}"
          );
                    /* v26: Perplexity Web Push(VAPID) app.js는 Android FCM과 중복/충돌하므로 APK에서는 제외 */
          html=html.replace(/\s*<script[^>]+src=[\"'](?:\.\/)?app\.js[\"'][^>]*><\/script>\s*/gi,'\n');
          try{ fs.rmSync(path.join(out,'app.js'),{force:true}); }catch{}
          /* v62: 발신자 취소 인식.
             (1) 발신자가 통화 시작 전에 끊으면 푸시로도 취소를 알린다(send-push 가 'video_cancel' 을 지원해야 즉시 벨이 꺼진다).
             (2) 수신자가 앱을 켰을 때, 푸시로 받은 통화는 발신자에게 'poll' 로 아직 통화 중인지 물어보고 'ringing' 응답이 있을 때만 받기/거절 창을 연다. */
          html=html.replace("function endVideoCall(){\n","function endVideoCall(){\n  if(videoCallRole==='caller' && !window.__vvAccepted && videoTargetUser){ try{ const __to=videoTargetUser; sb.functions.invoke('send-push',{body:{record:{sender_name:currentUser,receiver_name:__to,content:'영상통화 취소'},type:'video_cancel'}}).then(r=>console.log('[v62] cancel push',JSON.stringify(r.data||null),r.error||null)).catch(e=>console.warn('[v62] cancel push',e)); }catch(e){console.warn('[v62] cancel push',e);} }\n");
          html=html.replace("function cleanupVideoCall(message){\n","function cleanupVideoCall(message){\n  clearTimeout(window.__vvCallerTimer); window.__vvAccepted=false;\n");
          html=html.replace("    if(payload.type==='accept'){\n      if(videoTargetUser!==payload.from) return;\n","    if(payload.type==='accept'){\n      if(videoTargetUser!==payload.from) return;\n      window.__vvAccepted=true;\n");
          html=html.replace("    if(payload.type==='invite'){\n","    if(payload.type==='poll'){\n      if(videoCallRole==='caller' && videoPeer && !window.__vvAccepted && videoTargetUser===payload.from){ sendVideoSignal({type:'ringing',from:currentUser,to:payload.from}); }\n      return;\n    }\n    if(payload.type==='ringing'){ try{window.__vvRinging&&window.__vvRinging(payload.from);}catch(e){} return; }\n    if(payload.type==='invite'){\n");
          html=html.replace("setTimeout(()=>{ showIncomingVideoCall && showIncomingVideoCall(data.from); }, 800);","setTimeout(()=>{ if(window.verifyAndShowIncomingVideo) window.verifyAndShowIncomingVideo(data); else if(typeof showIncomingVideoCall==='function') showIncomingVideoCall(data.from); }, 800);");
          const css=`
          <style id="woorijip-v25-fixes">
          /* v25-systembar-fix: Android 상태표시줄과 앱 콘텐츠 겹침 방지 */
          html,body{padding-top:0!important;margin-top:0!important;box-sizing:border-box}
          /* v60: 채팅창 높이/입력창 위치는 index.html의 chat-fit-v60 스크립트가 실측으로 맞춘다. */
          /* v20: 뭐할까 페이지가 하단 네비에 가려지지 않도록 충분한 하단 여백 */
          #schedule{padding-bottom:calc(190px + var(--sab))!important;min-height:calc(100dvh - 100px);box-sizing:border-box}
          #schedule .card:last-child{margin-bottom:70px!important}
          @media(max-width:720px){#schedule{padding-bottom:calc(210px + var(--sab))!important}}
          #schedule .card:last-child{margin-bottom:40px}
          </style>`;
          const js=`
          <script id="woorijip-v25-fixes-js">
          (function(){
            const log=(...a)=>console.log('[v25]',...a);
            const warn=(...a)=>console.warn('[v25]',...a);
            const me=()=>{try{return(typeof currentUser!=='undefined'&&currentUser)||localStorage.getItem('woorijipMyName')||''}catch(e){return''}};
            async function ensureAuth(){
              try{
                if(typeof sb==='undefined'||!sb.auth)return false;
                const s=await sb.auth.getSession();
                if(s.data?.session)return true;
                const r=await sb.auth.signInAnonymously();
                if(r.error){warn('anonymous auth:',r.error.message);return false;}
                return !!r.data?.session;
              }catch(e){warn('auth:',e);return false}
            }
            async function push(record,type){
              try{
                if(typeof sb==='undefined'){warn('push: sb unavailable',type);return false}
                if(!(await ensureAuth())){warn('push: auth unavailable',type);return false}
                log('send-push start',type,record);
                const r=await sb.functions.invoke('send-push',{body:{record,type}});
                if(r.error){warn('send-push error',type,r.error.message||r.error);return false}
                log('send-push result',type,r.data);
                if(r.data && typeof r.data.sent==='number') return r.data.sent>0;
                return true;
              }catch(e){warn('send-push exception',type,e);return false}
            }
            function getDmTarget(){return (typeof family!=='undefined'&&typeof activePersonIndex!=='undefined'&&activePersonIndex!==null)?family[activePersonIndex]:''}

            async function confirmSaved(table, record, started){
              for(let attempt=0;attempt<4;attempt++){
                try{
                  const cutoff=new Date(started-15000).toISOString();
                  let q=sb.from(table).select('id,created_at').eq('sender_name',record.sender_name).eq('content',record.content).gte('created_at',cutoff).order('created_at',{ascending:false}).limit(1);
                  if(table==='direct_messages') q=q.eq('receiver_name',record.receiver_name);
                  const {data,error}=await q;
                  if(!error&&data?.length)return true;
                }catch(e){warn('confirmSaved',e)}
                await new Promise(r=>setTimeout(r,500));
              }
              return false;
            }
            async function pushAfterSave(table,record,type,started){
              if(!await ensureAuth())return;
              const ok=await confirmSaved(table,record,started);
              if(!ok){warn('DB save not confirmed; push skipped',type,record);return;}
              await push(record,type);
            }
            /* v27: 텍스트 채팅 푸시는 Supabase DB trigger가 담당한다.
               클라이언트 wrapper는 중복 발송/실패 원인이 될 수 있어 제거한다. */
            function wrapDm(){}
            function wrapGroup(){}
            /* 사진 push */
            function wrapPhoto(){
              if(typeof window.uploadChatPhoto!=='function')return;
              if(window.uploadChatPhoto.__v25Push)return;
              const original=window.uploadChatPhoto;
              window.uploadChatPhoto=async function(file,type){
                const target=type==='dm'?getDmTarget():'';
                const result=await original.apply(this,arguments);
                if(file&&me()){
                  const rec=type==='dm'?{sender_name:me(),receiver_name:target,content:'📷 사진을 보냈습니다.'}:{sender_name:me(),content:'📷 사진을 보냈습니다.'};
                  await push(rec,type==='dm'?'dm':'group');
                }
                return result;
              };
              window.uploadChatPhoto.__v25Push=true;
              log('photo wrapper installed');
            }

            function wrapIncomingVideo(){
              if(typeof window.showIncomingVideoCall!=='function'||window.showIncomingVideoCall.__v26State)return;
              const original=window.showIncomingVideoCall;
              window.showIncomingVideoCall=function(name){
                try{
                  if(typeof videoIncomingFrom!=='undefined')videoIncomingFrom=name;
                  if(typeof videoTargetUser!=='undefined')videoTargetUser=name;
                  if(typeof videoCallRole!=='undefined')videoCallRole='callee';
                }catch(e){warn('incoming video state',e)}
                return original.apply(this,arguments);
              };
              window.showIncomingVideoCall.__v26State=true;
              log('showIncomingVideoCall v26 state wrapper installed');
            }
            /* v30: 기존에 검증된 영상통화 signaling은 그대로 사용한다.
               v27~v29의 sendVideoSignal 교체가 연결을 깨뜨릴 수 있어 원본을 보존한다.
               단, accept 직전에 원본 Realtime 채널이 SUBSCRIBED인지 기다린다. */
            async function ensureOriginalVideoChannel(){
              try{
                for(let attempt=0;attempt<3;attempt++){
                  try{if(typeof videoChannel!=='undefined'&&videoChannel?.__ready)return true;}catch(e){}
                  /* 첫 구독이 실패/멈춘 경우 기존 채널을 제거하고 다시 연결 */
                  try{
                    if(typeof videoChannel!=='undefined'&&videoChannel&&typeof sb!=='undefined'&&sb?.removeChannel){
                      await sb.removeChannel(videoChannel);
                    }
                  }catch(e){warn('video channel remove',e)}
                  try{videoChannel=null;}catch(e){}
                  try{if(typeof initVideoCalling==='function')initVideoCalling();}catch(e){warn('video init retry',e)}
                  const end=Date.now()+5000;
                  while(Date.now()<end){
                    if(typeof videoChannel!=='undefined'&&videoChannel?.__ready)return true;
                    await new Promise(r=>setTimeout(r,100));
                  }
                  warn('video channel retry '+(attempt+1));
                }
              }catch(e){warn('original video channel wait',e)}
              return !!(typeof videoChannel!=='undefined'&&videoChannel?.__ready);
            }
            function wrapVideoSignal(){ return; }
            function installVideoDiagnostics(){
              if(window.__v28VideoDiag)return;window.__v28VideoDiag=true;
              const wrap=(name)=>{
                if(typeof window[name]!=='function'||window[name]['__v28Diag'])return;
                const original=window[name];
                window[name]=function(){
                  try{log('VIDEO STEP',name,JSON.stringify(arguments[0]||{}))}catch(e){}
                  const r=original.apply(this,arguments);
                  try{if(name==='createVideoPeer'&&typeof videoPeer!=='undefined'&&videoPeer){
                    videoPeer.addEventListener('icecandidate',e=>{if(e.candidate)log('VIDEO ICE LOCAL',e.candidate.candidate||'candidate');else log('VIDEO ICE LOCAL END');});
                    videoPeer.addEventListener('iceconnectionstatechange',()=>log('VIDEO ICE STATE',videoPeer.iceConnectionState));
                    videoPeer.addEventListener('connectionstatechange',()=>log('VIDEO PEER STATE',videoPeer.connectionState));
                    videoPeer.addEventListener('signalingstatechange',()=>log('VIDEO SIGNAL STATE',videoPeer.signalingState));
                    videoPeer.addEventListener('icegatheringstatechange',()=>log('VIDEO ICE GATHER',videoPeer.iceGatheringState));
                  }}catch(e){warn('VIDEO peer diagnostics',e)}
                  return r;
                };
                window[name]['__v28Diag']=true;
              };
              ['createVideoPeer','createVideoOffer','handleVideoOffer','handleVideoAnswer'].forEach(wrap);
              log('v29 video diagnostics installed');
            }
            function wrapIncomingVideo(){
              if(typeof window.showIncomingVideoCall!=='function'||window.showIncomingVideoCall.__v26State)return;
              const original=window.showIncomingVideoCall;
              window.showIncomingVideoCall=function(name){
                try{
                  if(typeof videoIncomingFrom!=='undefined')videoIncomingFrom=name;
                  if(typeof videoTargetUser!=='undefined')videoTargetUser=name;
                  if(typeof videoCallRole!=='undefined')videoCallRole='callee';
                }catch(e){warn('incoming video state',e)}
                return original.apply(this,arguments);
              };
              window.showIncomingVideoCall.__v26State=true;
              log('showIncomingVideoCall v26 state wrapper installed');
            }
            function wrapVideoStart(){
              /* v54: 원본 startVideoCall은 수정하지 않고 그대로 사용한다. */
              return;
            }
            function wrapVideoAccept(){
              if(typeof window.acceptVideoCall!=='function'||window.acceptVideoCall.__v30Ready)return;
              const original=window.acceptVideoCall;
              window.acceptVideoCall=async function(){
                try{
                  const name=(typeof videoIncomingFrom!=='undefined'&&videoIncomingFrom)||document.getElementById('videoIncomingName')?.textContent?.trim()||'';
                  if(name){videoIncomingFrom=name;videoTargetUser=name;videoCallRole='callee';}
                  const ok=await ensureOriginalVideoChannel();
                  if(!ok){setVideoStatus?.('영상통화 서버 연결 실패');return false;}
                  log('acceptVideoCall start',name);
                  const result=await original.apply(this,arguments);
                  log('acceptVideoCall done',name);
                  return result;
                }catch(e){warn('acceptVideoCall exception',e);try{setVideoStatus?.('영상통화 연결 오류: '+(e?.message||e));}catch{}return false;}
              };
              window.acceptVideoCall.__v30Ready=true;
              log('acceptVideoCall v30 wrapper installed');
            }

            /* v48: 가족 프로필 사진은 전용 테이블에 한 가족 구성원당 한 행으로 저장 */
            const PROFILE_PHOTO_TABLE='family_profile_photos';
            let profileRealtimeChannel=null;
            const v48FallbackByName={
              '아빠':'./avatar-dad.jpg','엄마':'./avatar-mom.jpg',
              '후야':'./avatar-huya.jpg','니보':'./avatar-nibo.jpg',
              '와니':'./avatar-wani.jpg'
            };
            function v48ValidPhoto(src){
              return typeof src==='string' && (src.startsWith('data:image/') || src.indexOf('http://')===0 || src.indexOf('https://')===0 || src.startsWith('./') || src.startsWith('../'));
            }
            function v48ApplyPhotoRows(rows){
              if(typeof family==='undefined')return;
              const map={};
              (rows||[]).forEach(r=>{if(r?.member_name&&v48ValidPhoto(r.photo_data))map[r.member_name]=r.photo_data;});
              profilePhotos=family.map(name=>map[name]||'');
              localStorage.setItem('woorijipProfilePhotos',JSON.stringify(profilePhotos));
              try{renderFamily();renderBackgroundFamily();renderBackgroundDashboard();}catch(e){}
              repairAvatarImages();
            }
            async function v48LoadProfilePhotos(){
              try{
                const {data,error}=await sb.from(PROFILE_PHOTO_TABLE).select('member_name,photo_data,updated_at');
                if(error)throw error;
                v48ApplyPhotoRows(data||[]);
              }catch(e){warn('v48 profile load',e);repairAvatarImages();}
            }
            async function v48SaveProfilePhoto(name,dataUrl){
              if(currentUser!==ADMIN_NAME){alert('관리자(아빠)만 프로필 사진을 변경할 수 있어요.');return false;}
              try{
                const photoRow={member_name:name,photo_data:dataUrl,updated_by:currentUser,updated_at:new Date().toISOString()};
                const {error}=await sb.from(PROFILE_PHOTO_TABLE).upsert(photoRow,{onConflict:'member_name'});
                if(error)throw error;
                const verify=await sb.from(PROFILE_PHOTO_TABLE).select('member_name,photo_data,updated_at').eq('member_name',name).maybeSingle();
                if(verify.error)throw verify.error;
                if(!verify.data?.photo_data)throw new Error('공용 프로필 사진 DB 저장값이 비어 있습니다.');
                profilePhotos[family.indexOf(name)]=verify.data.photo_data;
                localStorage.setItem('woorijipProfilePhotos',JSON.stringify(profilePhotos));
                renderFamily();renderBackgroundFamily();renderBackgroundDashboard();
                return true;
              }catch(e){
                console.error('[v48] profile photo save failed',e);
                alert('프로필 사진 공용 저장 실패: '+(e?.message||e));
                return false;
              }
            }
            function v48ResizeImage(file){
              return new Promise((resolve,reject)=>{
                const reader=new FileReader();
                reader.onerror=()=>reject(reader.error||new Error('파일 읽기 실패'));
                reader.onload=()=>{
                  const src=reader.result;const img=new Image();
                  img.onerror=()=>resolve(src);
                  img.onload=()=>{
                    try{
                      const max=640;
                      const scale=Math.min(1,max/Math.max(img.naturalWidth||img.width||1,img.naturalHeight||img.height||1));
                      const w=Math.max(1,Math.round((img.naturalWidth||img.width)*scale));
                      const h=Math.max(1,Math.round((img.naturalHeight||img.height)*scale));
                      const c=document.createElement('canvas');c.width=w;c.height=h;
                      c.getContext('2d').drawImage(img,0,0,w,h);
                      resolve(c.toDataURL('image/jpeg',0.82));
                    }catch(e){resolve(src);}
                  };
                  img.src=src;
                };
                reader.readAsDataURL(file);
              });
            }
            async function v48ChangeProfilePhoto(i,file){
              if(currentUser!==ADMIN_NAME){alert('관리자(아빠)만 프로필 사진을 변경할 수 있어요.');return;}
              if(!file)return;
              if(!file.type.startsWith('image/')){alert('이미지 파일만 선택할 수 있어요.');return;}
              try{
                const name=family[i];
                const dataUrl=await v48ResizeImage(file);
                profilePhotos[i]=dataUrl;
                localStorage.setItem('woorijipProfilePhotos',JSON.stringify(profilePhotos));
                renderFamily();renderBackgroundFamily();renderBackgroundDashboard();checkAdminPermissions();
                showToast(name+'님의 프로필 사진을 저장하고 있어요...');
                const ok=await v48SaveProfilePhoto(name,dataUrl);
                if(ok)showToast(name+'님의 프로필 사진을 가족 전체에 공유했어요.');
              }catch(e){
                console.error('[v48] change profile photo',e);
                alert('프로필 사진 변경 실패: '+(e?.message||e));
              }
            }
            window.changeProfilePhoto=v48ChangeProfilePhoto;
            function initProfilePhotoRealtime(){
              if(profileRealtimeChannel)return;
              profileRealtimeChannel=sb.channel('public:family_profile_photos_v48')
                .on('postgres_changes',{event:'*',schema:'public',table:PROFILE_PHOTO_TABLE},payload=>{
                  if(payload.eventType==='DELETE'&&payload.old?.member_name){
                    v48LoadProfilePhotos();
                  }else if(payload.new?.member_name){
                    const idx=family?.indexOf(payload.new.member_name);
                    if(idx>=0){profilePhotos[idx]=payload.new.photo_data||'';localStorage.setItem('woorijipProfilePhotos',JSON.stringify(profilePhotos));}
                    try{renderFamily();renderBackgroundFamily();renderBackgroundDashboard();}catch(e){}
                    repairAvatarImages();
                  }
                }).subscribe(status=>log('profile realtime',status));
            }

            function repairAvatarImages(){
              try{
                document.querySelectorAll('img.avatar-img,img.member-avatar-img,img.avatar-img-marker').forEach(img=>{
                  const alt=(img.getAttribute('alt')||'').trim();
                  const name=alt.replace(/\s*\(.*?\)\s*$/,'').trim();
                  const fallback=v44FallbackByName[name];
                  const showFallback=()=>{
                    if(img.dataset.v44Fallback==='1')return;
                    img.dataset.v44Fallback='1';
                    img.style.display='block';
                    if(fallback)img.src=fallback;
                    else{
                      const holder=img.parentElement;
                      if(holder && !holder.querySelector('.v44-avatar-fallback')){
                        const span=document.createElement('span');
                        span.className='v44-avatar-fallback';
                        span.textContent='👤';
                        span.style.cssText='display:grid;place-items:center;width:100%;height:100%;font-size:24px;';
                        img.style.display='none';holder.appendChild(span);
                      }
                    }
                  };
                  img.onerror=showFallback;
                  const src=img.getAttribute('src')||'';
                  if(!src || src.startsWith('file:') || src.startsWith('/'))showFallback();
                  else if(img.complete && img.naturalWidth===0)showFallback();
                });
              }catch(e){warn('avatar repair',e)}
            }

            function v44RepairInvalidStoredPhotos(){
              try{
                if(!Array.isArray(profilePhotos)||!Array.isArray(family))return;
                let changed=false;
                profilePhotos=family.map((name,i)=>{
                  const v=profilePhotos[i];
                  if(v && !v44ValidPhoto(v)){changed=true;return '';}
                  return v||'';
                });
                if(changed)localStorage.setItem('woorijipProfilePhotos',JSON.stringify(profilePhotos));
              }catch(e){}
            }

            /* v48: 가족 상태도 Realtime으로 즉시 반영 (Supabase publication에 등록) */
            let familyStatusRealtimeChannel=null;
            function initFamilyStatusRealtime(){
              if(familyStatusRealtimeChannel)return;
              familyStatusRealtimeChannel=sb.channel('public:family_status')
                .on('postgres_changes',{event:'*',schema:'public',table:'family_status'},payload=>{
