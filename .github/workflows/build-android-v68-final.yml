          import java.awt.*;import java.awt.geom.*;import java.awt.image.*;import java.io.*;import javax.imageio.*;
          public class IconGen{
            static BufferedImage master;
            static BufferedImage scaled(int d){
              BufferedImage cur=master;
              while(cur.getWidth()/2>=d){
                BufferedImage n=new BufferedImage(cur.getWidth()/2,cur.getHeight()/2,BufferedImage.TYPE_INT_ARGB);
                Graphics2D g=n.createGraphics();g.setRenderingHint(RenderingHints.KEY_INTERPOLATION,RenderingHints.VALUE_INTERPOLATION_BILINEAR);
                g.drawImage(cur,0,0,n.getWidth(),n.getHeight(),null);g.dispose();cur=n;
              }
              BufferedImage out=new BufferedImage(d,d,BufferedImage.TYPE_INT_ARGB);
              Graphics2D g=out.createGraphics();g.setRenderingHint(RenderingHints.KEY_INTERPOLATION,RenderingHints.VALUE_INTERPOLATION_BICUBIC);
              g.drawImage(cur,0,0,d,d,null);g.dispose();return out;
            }
            // shape 0: 배경 없음(투명), 1: 둥근 사각형 배경, 2: 원형 배경
            static BufferedImage make(int size,double diaRatio,int shape){
              BufferedImage out=new BufferedImage(size,size,BufferedImage.TYPE_INT_ARGB);
              Graphics2D g=out.createGraphics();
              g.setRenderingHint(RenderingHints.KEY_ANTIALIASING,RenderingHints.VALUE_ANTIALIAS_ON);
              g.setColor(Color.WHITE);
              if(shape==1)g.fill(new RoundRectangle2D.Double(0,0,size,size,size*0.44,size*0.44));
