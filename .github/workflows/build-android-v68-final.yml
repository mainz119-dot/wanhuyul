            async function v44BootSync(){
              try{
                /* v54: Realtime은 보조 경로로 유지하고, 실제 화면 동기화는 주기 조회를 보장한다.
                   Realtime 채널 상태가 기기별로 달라도 가족사진/상태가 결국 동일하게 맞춰진다. */
                await v48LoadProfilePhotos();
                initProfilePhotoRealtime();
                initFamilyStatusRealtime();
                if(typeof loadFamilyStatuses==='function')await loadFamilyStatuses();
                const syncAll=async()=>{
                  try{await v48LoadProfilePhotos();}catch(e){}
                  try{
                    if(typeof loadFamilyStatuses==='function'){
                      const before=JSON.stringify(familyStatusData||{});
                      await loadFamilyStatuses();
                      const after=JSON.stringify(familyStatusData||{});
                      if(before!==after){
                        try{renderFamilyStatusHome();}catch(e){}
                        try{if(typeof renderSheetStatusPicker==='function' && activePersonIndex!==null)renderSheetStatusPicker();}catch(e){}
                        log('v54 status screen refreshed');
                      }
                    }
                  }catch(e){}
                  try{repairAvatarImages();}catch(e){}
                };
                setInterval(syncAll,2000);
                document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncAll();});
                window.addEventListener('focus',syncAll);
                repairAvatarImages();
              }catch(e){warn('v54 boot sync',e)}
            }

            /* v62: 푸시로 받은 영상통화가 아직 유효한지 발신자에게 확인한 뒤 받기/거절 창을 연다. */
            const vvSleep=ms=>new Promise(r=>setTimeout(r,ms));
            window.__vvRinging=function(from){
              const w=window.__vvWait;
              if(!w||w.from!==from)return;
              if(videoPeer||videoIncomingFrom)return;
              window.__vvWait=null;
              videoIncomingFrom=from;videoTargetUser=from;videoCallRole='callee';
              showIncomingVideoCall(from);
              log('v62 call still ringing, shown',from);
              if(w.accept)setTimeout(()=>{try{acceptVideoCall();}catch(e){warn('auto accept',e)}},300);
            };
            window.verifyAndShowIncomingVideo=async function(d){
              try{
                const from=d&&d.from;if(!from)return;
                const N=window.WoorijipNative;
                window.__vvSeen=window.__vvSeen||{};
                const key=from+'|'+(d.sentTime||'');
                if(window.__vvSeen[key])return;window.__vvSeen[key]=Date.now();
                const accept=d.action==='accept';
                const end=(msg,missed)=>{
                  window.__vvWait=null;
                  try{stopIncomingRinging();}catch(e){}
                  try{N&&N.clearPendingPush&&N.clearPendingPush();}catch(e){}
                  if(missed){try{saveMissedVideoCall(from);}catch(e){}}
                  if(msg){try{showToast(msg);}catch(e){}}
                  log('v62 incoming video dropped:',msg||'stale',from);
                };
                const age=d.sentTime?(Date.now()-Number(d.sentTime)):0;
                if(age>45000){end(accept?'이미 종료된 영상통화예요.':'부재중 영상통화가 있어요.',!accept);return;}
                if(videoPeer)return;
                if(videoIncomingFrom===from){if(accept){try{acceptVideoCall();}catch(e){}}return;}
                window.__vvWait={from,accept};
                try{if(typeof initVideoCalling==='function')initVideoCalling();}catch(e){}
                let waited=0;
                while(waited<6000&&!(videoChannel&&videoChannel.__ready)){await vvSleep(100);waited+=100;if(!window.__vvWait||window.__vvWait.from!==from)return;}
                for(let i=0;i<3;i++){
                  sendVideoSignal({type:'poll',from:currentUser,to:from});
                  await vvSleep(1500);
                  if(!window.__vvWait||window.__vvWait.from!==from)return;
                }
                if(window.__vvWait&&window.__vvWait.from===from)end(accept?'이미 종료된 영상통화예요.':'부재중 영상통화가 있어요.',!accept);
              }catch(e){warn('verifyAndShowIncomingVideo',e)}
            };
            /* v62: 푸시 수신 기록 보기 — 홈 화면의 '완후율' 제목을 1.5초 길게 누르면 표시 */
            (function(){
              let lp=null;
              document.addEventListener('touchstart',e=>{
                try{if(e.target.closest&&e.target.closest('.home-header .title')){clearTimeout(lp);lp=setTimeout(()=>{try{alert('최근 푸시 수신·위치 전송 기록\\n\\n'+(window.WoorijipNative?.getPushLog?.()||'기록 없음')+'\\n\\n최근 위치 전송\\n'+(window.WoorijipNative?.getLocationLog?.()||'기록 없음'))}catch(_){}} ,1500);}}catch(_){}
