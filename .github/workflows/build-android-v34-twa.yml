name: Build 우리집 Android APK v34 - TWA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Create TWA Android project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p twa/app/src/main/java/com/woorijip/family
          mkdir -p twa/app/src/main/res/values

          cat > twa/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "WoorijipTWA"
          include(":app")
          EOF

          cat > twa/build.gradle <<'EOF'
          plugins {
              id "com.android.application" version "8.6.1" apply false
          }
          EOF

          cat > twa/app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
          }

          android {
              namespace "com.woorijip.family"
              compileSdk 35

              defaultConfig {
                  applicationId "com.woorijip.family"
                  minSdk 23
                  targetSdk 35
                  versionCode 34
                  versionName "34.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }

          dependencies {
              implementation "androidx.browser:browser:1.9.0"
          }
          EOF

          cat > twa/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">우리집</string>
          </resources>
          EOF

          cat > twa/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:windowNoTitle">true</item>
              </style>
          </resources>
          EOF

          cat > twa/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > twa/app/src/main/java/com/woorijip/family/MainActivity.java <<'EOF'
          package com.woorijip.family;

          import android.app.Activity;
          import android.os.Bundle;
          import android.net.Uri;
          import android.content.Intent;

          import androidx.browser.trusted.TrustedWebActivityIntentBuilder;

          public class MainActivity extends Activity {

              private static final String START_URL =
                      "https://mainz119-dot.github.io/wanhuyul/";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  Uri launchUri = Uri.parse(START_URL);

                  Intent twaIntent =
                          new TrustedWebActivityIntentBuilder(launchUri)
                                  .build(this);

                  startActivity(twaIntent);
                  finish();
              }
          }
          EOF

      - name: Build unsigned APK
        working-directory: twa
        run: gradle assembleRelease --no-daemon

      - name: Prepare unsigned APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          cp twa/app/build/outputs/apk/release/app-release-unsigned.apk \
             output/우리집-v34-twa-unsigned.apk

      - name: Generate test signing certificate
        shell: bash
        run: |
          set -euo pipefail

          keytool -genkeypair \
            -keystore output/woorijip-v34-test.jks \
            -storepass android \
            -keypass android \
            -alias woorijip \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=우리집 TWA, OU=Family, O=Woorijip, C=KR"

          keytool -list -v \
            -keystore output/woorijip-v34-test.jks \
            -storepass android > output/certificate.txt

          grep -E "Alias name:|SHA256:" output/certificate.txt || true

      - name: Sign test APK
        shell: bash
        run: |
          set -euo pipefail

          $ANDROID_HOME/build-tools/35.0.0/apksigner sign \
            --ks output/woorijip-v34-test.jks \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out output/우리집-v34-twa.apk \
            output/우리집-v34-twa-unsigned.apk

          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose \
            output/우리집-v34-twa.apk

      - name: Upload APK and certificate
        uses: actions/upload-artifact@v4
        with:
          name: woorijip-v34-twa
          path: |
            output/우리집-v34-twa.apk
            output/certificate.txt
            output/woorijip-v34-test.jks
