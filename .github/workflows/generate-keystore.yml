name: 0. Generate TWA signing keystore (run once)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Generate keystore
        shell: bash
        run: |
          set -e
          keytool -genkeypair -v \
            -keystore wanhuyul-release.keystore \
            -alias wanhuyul \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass wanhuyulpass123 \
            -keypass wanhuyulpass123 \
            -dname "CN=Wanhuyul Family App, OU=Family, O=Wanhuyul, L=Seoul, ST=Seoul, C=KR"

          echo "===== base64 (이걸 통째로 복사해서 ANDROID_KEYSTORE_BASE64 시크릿에 붙여넣으세요) ====="
          base64 -w0 wanhuyul-release.keystore
          echo ""
          echo ""
          echo "===== SHA256 지문 (assetlinks.json에 넣을 값) ====="
          keytool -list -v -keystore wanhuyul-release.keystore -alias wanhuyul -storepass wanhuyulpass123 | grep "SHA256:"

      - name: Upload keystore as artifact (백업용, 다운로드 후 secret 등록하면 이 파일은 지워도 됩니다)
        uses: actions/upload-artifact@v4
        with:
          name: wanhuyul-release-keystore
          path: wanhuyul-release.keystore
          retention-days: 7
