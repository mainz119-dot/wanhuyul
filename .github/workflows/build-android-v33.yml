name: Build 우리집 Android APK v33 - real-avatar-video-signaling-device-gps-fix

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
          accept-android-sdk-licenses: true
      - name: Create Capacitor project
        shell: bash
        run: |
          set -e
          cat > package.json <<'JSON'
          {"private":true,"scripts":{"build":"node scripts/prepare-web.mjs && node scripts/bundle-native.mjs"},"dependencies":{"@capacitor/android":"8.5.1","@capacitor/cli":"8.5.1","@capacitor/core":"8.5.1","esbuild":"0.25.9","typescript":"5.9.2"}}
          JSON
          cat > capacitor.config.ts <<'EOF2'
          import type { CapacitorConfig } from '@capacitor/cli';
          const config: CapacitorConfig={appId:'com.woorijip.family',appName:'우리집',webDir:'www',android:{useLegacyBridge:false,adjustMarginsForEdgeToEdge:'disable'},server:{androidScheme:'https'}};
          export default config;
          EOF2
          mkdir -p scripts native
          cat > native/native-bridge.js <<'EOF2'
          (()=>{
            let tokenLast='';
            const native=()=>window.WoorijipNative&&typeof window.WoorijipNative.startNativeLocation==='function';
            const me=()=>{try{return(typeof currentUser!=='undefined'&&currentUser)||localStorage.getItem('woorijipMyName')||''}catch(e){return''}};
            const locOn=()=>{try{return localStorage.getItem('woorijipLocationSharing')==='1'||localStorage.getItem('woorijipLocationSharingEnabled')==='1'}catch(e){return false}};
            async function ensureAuth(){
              try{
                if(typeof sb==='undefined'||!sb.auth)return false;
                const s=await sb.auth.getSession();
                if(s.data?.session)return true;
                const r=await sb.auth.signInAnonymously();
                if(r.error){console.warn('[v25] anonymous auth:',r.error.message);return false;}
                return !!r.data?.session;
              }catch(e){console.warn('[v25] auth:',e);return false}
            }
            async function syncToken(){
              try{
                const user=me(), token=window.WoorijipNative?.getFcmToken?.()||'';
                if(!user||!token||typeof sb==='undefined')return;
                const deviceId=window.WoorijipNative?.getDeviceId?.()||'';
                if(!deviceId)return;
                if(token===tokenLast)return;
                if(!(await ensureAuth()))return;
                /* v33: 한 사용자에게 여러 APK가 남아 위치를 서로 덮어쓰는 문제를 방지.
                   새로 실제 사용 중인 기기가 등록되면 같은 사용자의 이전 기기는 비활성화한다. */
                await sb.from('family_devices').update({active:false}).eq('user_name',user).neq('device_id',deviceId);
                const {error}=await sb.from('family_devices').upsert({device_id:deviceId,user_name:user,fcm_token:token,platform:'android',active:true,updated_at:new Date().toISOString()},{onConflict:'device_id'});
                if(error)console.warn('[v33] family_devices sync:',error.message);
                const {error2}=await sb.from('family_fcm_tokens').upsert({user_name:user,token,updated_at:new Date().toISOString()},{onConflict:'user_name'});
                if(error2)console.warn('[v33] FCM token sync:',error2.message);
                tokenLast=token;
                console.log('[v33] device active:',user,deviceId);
              }catch(e){console.warn('[v33] token sync exception:',e)}
            }
            function keep(){
              if(!native())return;
              const u=me();if(!u)return;
              try{
                WoorijipNative.setLocationUser(u);
                if(locOn()) WoorijipNative.startNativeLocation();
                else WoorijipNative.stopNativeLocation();
              }catch(e){console.warn('[v25] GPS bridge',e)}
            }
            function pendingPush(){
              try{
                const raw=window.WoorijipNative?.getPendingPush?.();if(!raw)return;
                const d=JSON.parse(raw);window.WoorijipNative?.clearPendingPush?.();
                const go=()=>{
                  if(d.type==='video'&&d.from&&typeof window.showIncomingVideoCall==='function'){
                    if(typeof videoIncomingFrom!=='undefined')videoIncomingFrom=d.from;
                    if(typeof videoTargetUser!=='undefined')videoTargetUser=d.from;
                    if(typeof videoCallRole!=='undefined')videoCallRole='callee';
                    window.showIncomingVideoCall(d.from);console.log('[v25] incoming video from',d.from);return true;
                  }
                  if((d.type==='dm'||d.type==='group'||d.type==='chat')&&typeof window.goToPage==='function'){window.goToPage('chat');return true}
                  return false;
                };
                if(!go())setTimeout(()=>{if(!go())setTimeout(go,1500)},800);
              }catch(e){console.warn('[v25] pending push',e)}
            }
            /* v30: 영상통화 수신은 인증/FCM 토큰 동기화를 기다리지 않는다. */
            function fastPending(){try{pendingPush();}catch(e){console.warn('[v30] pending push:',e)}}
            fastPending();
            document.addEventListener('DOMContentLoaded',fastPending,{once:true});
            window.addEventListener('load',fastPending,{once:true});
            const fastTimer=setInterval(fastPending,500);
            setTimeout(()=>clearInterval(fastTimer),20000);
            async function boot(){fastPending();await ensureAuth();await syncToken();keep();fastPending();}
            setTimeout(boot,300);
            setInterval(()=>{syncToken();keep();fastPending();},3000);
          })();
          EOF2
          cat > scripts/prepare-web.mjs <<'EOF2'
          import fs from 'node:fs';
          import path from 'node:path';
          const root=process.cwd();
          const out=path.join(root,'www');
          const excluded=new Set(['.git','.github','android','www','node_modules','native','scripts','package.json','package-lock.json','capacitor.config.ts']);
          fs.rmSync(out,{recursive:true,force:true});
          fs.mkdirSync(out,{recursive:true});
          for(const name of fs.readdirSync(root)){
            if(excluded.has(name)) continue;
            fs.cpSync(path.join(root,name),path.join(out,name),{recursive:true});
          }
          const htmlPath=path.join(out,'index.html');
          let html=fs.readFileSync(htmlPath,'utf8');
          /* v26: Perplexity Web Push(VAPID) app.js는 Android FCM과 중복/충돌하므로 APK에서는 제외 */
          html=html.replace(/\s*<script[^>]+src=[\"'](?:\.\/)?app\.js[\"'][^>]*><\/script>\s*/gi,'\n');
          try{ fs.rmSync(path.join(out,'app.js'),{force:true}); }catch{}
          const css=`
          <style id="woorijip-v25-fixes">
          /* v25-systembar-fix: Android 상태표시줄과 앱 콘텐츠 겹침 방지 */
          html,body{padding-top:0!important;margin-top:0!important;box-sizing:border-box}
          /* v20: 채팅 입력창/하단 네비 겹침 방지 */
          .chat.chat-scrollable{height:calc(52dvh - 20px)!important;max-height:500px!important;padding-bottom:88px!important}
          #dmMessages.chat.chat-scrollable{height:calc(52dvh - 20px)!important;min-height:300px!important;max-height:520px!important}
          /* v20: 뭐할까 페이지가 하단 네비에 가려지지 않도록 충분한 하단 여백 */
          #schedule{padding-bottom:calc(190px + env(safe-area-inset-bottom))!important;min-height:calc(100dvh - 100px);box-sizing:border-box}
          #schedule .card:last-child{margin-bottom:70px!important}
          @media(max-width:720px){#schedule{padding-bottom:calc(210px + env(safe-area-inset-bottom))!important}}
          #schedule .card:last-child{margin-bottom:40px}
          </style>`;
          const js=`
          <script id="woorijip-v25-fixes-js">
          (function(){
            const log=(...a)=>console.log('[v25]',...a);
            const warn=(...a)=>console.warn('[v25]',...a);
            const me=()=>{try{return(typeof currentUser!=='undefined'&&currentUser)||localStorage.getItem('woorijipMyName')||''}catch(e){return''}};
            async function ensureAuth(){
              try{
                if(typeof sb==='undefined'||!sb.auth)return false;
                const s=await sb.auth.getSession();
                if(s.data?.session)return true;
                const r=await sb.auth.signInAnonymously();
                if(r.error){warn('anonymous auth:',r.error.message);return false;}
                return !!r.data?.session;
              }catch(e){warn('auth:',e);return false}
            }
            async function push(record,type){
              try{
                if(typeof sb==='undefined'){warn('push: sb unavailable',type);return false}
                if(!(await ensureAuth())){warn('push: auth unavailable',type);return false}
                log('send-push start',type,record);
                const r=await sb.functions.invoke('send-push',{body:{record,type}});
                if(r.error){warn('send-push error',type,r.error.message||r.error);return false}
                log('send-push result',type,r.data);return true;
              }catch(e){warn('send-push exception',type,e);return false}
            }
            function getDmTarget(){return (typeof family!=='undefined'&&typeof activePersonIndex!=='undefined'&&activePersonIndex!==null)?family[activePersonIndex]:''}

            async function confirmSaved(table, record, started){
              for(let attempt=0;attempt<4;attempt++){
                try{
                  const cutoff=new Date(started-15000).toISOString();
                  let q=sb.from(table).select('id,created_at').eq('sender_name',record.sender_name).eq('content',record.content).gte('created_at',cutoff).order('created_at',{ascending:false}).limit(1);
                  if(table==='direct_messages') q=q.eq('receiver_name',record.receiver_name);
                  const {data,error}=await q;
                  if(!error&&data?.length)return true;
                }catch(e){warn('confirmSaved',e)}
                await new Promise(r=>setTimeout(r,500));
              }
              return false;
            }
            async function pushAfterSave(table,record,type,started){
              if(!await ensureAuth())return;
              const ok=await confirmSaved(table,record,started);
              if(!ok){warn('DB save not confirmed; push skipped',type,record);return;}
              await push(record,type);
            }
            /* v27: 텍스트 채팅 푸시는 Supabase DB trigger가 담당한다.
               클라이언트 wrapper는 중복 발송/실패 원인이 될 수 있어 제거한다. */
            function wrapDm(){}
            function wrapGroup(){}
            /* 사진 push */
            function wrapPhoto(){
              if(typeof window.uploadChatPhoto!=='function')return;
              if(window.uploadChatPhoto.__v25Push)return;
              const original=window.uploadChatPhoto;
              window.uploadChatPhoto=async function(file,type){
                const target=type==='dm'?getDmTarget():'';
                const result=await original.apply(this,arguments);
                if(file&&me()){
                  const rec=type==='dm'?{sender_name:me(),receiver_name:target,content:'📷 사진을 보냈습니다.'}:{sender_name:me(),content:'📷 사진을 보냈습니다.'};
                  await push(rec,type==='dm'?'dm':'group');
                }
                return result;
              };
              window.uploadChatPhoto.__v25Push=true;
              log('photo wrapper installed');
            }

            function wrapIncomingVideo(){
              if(typeof window.showIncomingVideoCall!=='function'||window.showIncomingVideoCall.__v26State)return;
              const original=window.showIncomingVideoCall;
              window.showIncomingVideoCall=function(name){
                try{
                  if(typeof videoIncomingFrom!=='undefined')videoIncomingFrom=name;
                  if(typeof videoTargetUser!=='undefined')videoTargetUser=name;
                  if(typeof videoCallRole!=='undefined')videoCallRole='callee';
                }catch(e){warn('incoming video state',e)}
                return original.apply(this,arguments);
              };
              window.showIncomingVideoCall.__v26State=true;
              log('showIncomingVideoCall v26 state wrapper installed');
            }
            /* v30: 기존에 검증된 영상통화 signaling은 그대로 사용한다.
               v27~v29의 sendVideoSignal 교체가 연결을 깨뜨릴 수 있어 원본을 보존한다.
               단, accept 직전에 원본 Realtime 채널이 SUBSCRIBED인지 기다린다. */
            async function ensureOriginalVideoChannel(){
              try{
                for(let attempt=0;attempt<3;attempt++){
                  try{if(typeof videoChannel!=='undefined'&&videoChannel?.__ready)return true;}catch(e){}
                  /* 첫 구독이 실패/멈춘 경우 기존 채널을 제거하고 다시 연결 */
                  try{
                    if(typeof videoChannel!=='undefined'&&videoChannel&&typeof sb!=='undefined'&&sb?.removeChannel){
                      await sb.removeChannel(videoChannel);
                    }
                  }catch(e){warn('video channel remove',e)}
                  try{videoChannel=null;}catch(e){}
                  try{if(typeof initVideoCalling==='function')initVideoCalling();}catch(e){warn('video init retry',e)}
                  const end=Date.now()+5000;
                  while(Date.now()<end){
                    if(typeof videoChannel!=='undefined'&&videoChannel?.__ready)return true;
                    await new Promise(r=>setTimeout(r,100));
                  }
                  warn('video channel retry '+(attempt+1));
                }
              }catch(e){warn('original video channel wait',e)}
              return !!(typeof videoChannel!=='undefined'&&videoChannel?.__ready);
            }
            function wrapVideoSignal(){
              if(typeof window.sendVideoSignal!=='function'||window.sendVideoSignal.__v30Wrapped)return;
              const original=window.sendVideoSignal;
              window.sendVideoSignal=function(payload){
                try{log('VIDEO TX v30',JSON.stringify(payload))}catch(e){}
                try{return original.apply(this,arguments)}catch(e){warn('VIDEO TX v30 ERROR',e);return undefined}
              };
              window.sendVideoSignal.__v30Wrapped=true;
              log('v30 original video signaling preserved');
            }
            function installVideoDiagnostics(){
              if(window.__v28VideoDiag)return;window.__v28VideoDiag=true;
              const wrap=(name)=>{
                if(typeof window[name]!=='function'||window[name]['__v28Diag'])return;
                const original=window[name];
                window[name]=function(){
                  try{log('VIDEO STEP',name,JSON.stringify(arguments[0]||{}))}catch(e){}
                  const r=original.apply(this,arguments);
                  try{if(name==='createVideoPeer'&&typeof videoPeer!=='undefined'&&videoPeer){
                    videoPeer.addEventListener('icecandidate',e=>{if(e.candidate)log('VIDEO ICE LOCAL',e.candidate.candidate||'candidate');else log('VIDEO ICE LOCAL END');});
                    videoPeer.addEventListener('iceconnectionstatechange',()=>log('VIDEO ICE STATE',videoPeer.iceConnectionState));
                    videoPeer.addEventListener('connectionstatechange',()=>log('VIDEO PEER STATE',videoPeer.connectionState));
                    videoPeer.addEventListener('signalingstatechange',()=>log('VIDEO SIGNAL STATE',videoPeer.signalingState));
                    videoPeer.addEventListener('icegatheringstatechange',()=>log('VIDEO ICE GATHER',videoPeer.iceGatheringState));
                  }}catch(e){warn('VIDEO peer diagnostics',e)}
                  return r;
                };
                window[name]['__v28Diag']=true;
              };
              ['createVideoPeer','createVideoOffer','handleVideoOffer','handleVideoAnswer'].forEach(wrap);
              log('v29 video diagnostics installed');
            }
            function wrapIncomingVideo(){
              if(typeof window.showIncomingVideoCall!=='function'||window.showIncomingVideoCall.__v26State)return;
              const original=window.showIncomingVideoCall;
              window.showIncomingVideoCall=function(name){
                try{
                  if(typeof videoIncomingFrom!=='undefined')videoIncomingFrom=name;
                  if(typeof videoTargetUser!=='undefined')videoTargetUser=name;
                  if(typeof videoCallRole!=='undefined')videoCallRole='callee';
                }catch(e){warn('incoming video state',e)}
                return original.apply(this,arguments);
              };
              window.showIncomingVideoCall.__v26State=true;
              log('showIncomingVideoCall v26 state wrapper installed');
            }
            function wrapVideoStart(){
              if(typeof window.startVideoCall!=='function'||window.startVideoCall.__v30Push)return;
              const original=window.startVideoCall;
              window.startVideoCall=async function(){
                const target=getDmTarget();const from=me();
                const ready=await ensureOriginalVideoChannel();
                if(!ready){try{setVideoStatus?.('영상통화 서버 연결 실패');}catch{};warn('startVideoCall: video channel not ready');return false;}
                const result=await original.apply(this,arguments);
                if(target&&from)await push({sender_name:from,receiver_name:target,content:'영상통화'},'video');
                return result;
              };
              window.startVideoCall.__v30Push=true;
              log('startVideoCall v30 wrapper installed');
            }
            function wrapVideoAccept(){
              if(typeof window.acceptVideoCall!=='function'||window.acceptVideoCall.__v30Ready)return;
              const original=window.acceptVideoCall;
              window.acceptVideoCall=async function(){
                try{
                  const name=(typeof videoIncomingFrom!=='undefined'&&videoIncomingFrom)||document.getElementById('videoIncomingName')?.textContent?.trim()||'';
                  if(name){videoIncomingFrom=name;videoTargetUser=name;videoCallRole='callee';}
                  const ok=await ensureOriginalVideoChannel();
                  if(!ok){setVideoStatus?.('영상통화 서버 연결 실패');return false;}
                  log('acceptVideoCall start',name);
                  const result=await original.apply(this,arguments);
                  log('acceptVideoCall done',name);
                  return result;
                }catch(e){warn('acceptVideoCall exception',e);try{setVideoStatus?.('영상통화 연결 오류: '+(e?.message||e));}catch{}return false;}
              };
              window.acceptVideoCall.__v30Ready=true;
              log('acceptVideoCall v30 wrapper installed');
            }

            /* v33: 프로필 사진을 렌더링 함수 자체에서 복구한다. 기존 onerror/display:none 우회는 제거. */
            function installRealAvatarRenderer(){
              if(window.__v33AvatarRenderer)return;
              const fallbackByName={'아빠':'./avatar-dad.jpg','엄마':'./avatar-mom.jpg','후야':'./avatar-huya.jpg','니보':'./avatar-nibo.jpg','와니':'./avatar-wani.jpg'};
              const oldAvatarHtml=window.avatarHtml;
              window.profileSrc=function(i){
                const fam=(typeof family!=='undefined'&&Array.isArray(family))?family:[];
                const name=fam[i]||'';
                const custom=(typeof profilePhotos!=='undefined'&&Array.isArray(profilePhotos))?profilePhotos[i]:'';
                if(typeof custom==='string' && custom.startsWith('data:image/') && custom.length>100) return custom;
                return fallbackByName[name] || ((typeof defaultProfiles!=='undefined'&&defaultProfiles[i])||'👤');
              };
              window.avatarHtml=function(i,cls='avatar-img'){
                const fam=(typeof family!=='undefined'&&Array.isArray(family))?family:[];
                const name=fam[i]||'가족';
                const src=window.profileSrc(i);
                if(!src || src==='👤') return ((typeof icons!=='undefined'&&icons[i])||'👤');
                return `<img class="${cls}" src="${src}" alt="${String(name).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}" onerror="this.onerror=null;this.src='${fallbackByName[name]||'./icon-192.png'}';this.style.display='block'">`;
              };
              window.__v33AvatarRenderer=true;
              try{renderFamily();renderBackgroundFamily();renderBackgroundDashboard();}catch(e){}
              log('v33 real avatar renderer installed');
            }

            /* v33: 영상통화 signaling을 실제 연결 상태까지 관리한다. 기존 채널을 무작정 교체하지 않고,
               발신/수신 양쪽에서 SUBSCRIBED 확인 후 accept/offer를 보내며 WebRTC 상태를 화면에 표시한다. */
            function installReliableVideoSignaling(){
              if(window.__v33VideoInstalled)return;
              window.__v33VideoInstalled=true;
              const wait=ms=>new Promise(r=>setTimeout(r,ms));
              async function waitVideoChannel(timeout=12000){
                const end=Date.now()+timeout;
                try{if(typeof initVideoCalling==='function')initVideoCalling();}catch(e){}
                while(Date.now()<end){
                  try{if(typeof videoChannel!=='undefined'&&videoChannel?.__ready)return true;}catch(e){}
                  await wait(150);
                }
                return false;
              }
              const originalStart=window.startVideoCall;
              window.startVideoCall=async function(){
                try{
                  const ok=await waitVideoChannel(12000);
                  if(!ok){alert('영상통화 서버 연결에 실패했습니다. Wi-Fi/모바일 데이터를 확인해주세요.');return false;}
                  console.log('[v33] VIDEO CHANNEL READY caller');
                  return await originalStart.apply(this,arguments);
                }catch(e){console.error('[v33] caller error',e);alert('영상통화 시작 오류: '+(e?.message||e));return false;}
              };
              const originalAccept=window.acceptVideoCall;
              window.acceptVideoCall=async function(){
                const name=(typeof videoIncomingFrom!=='undefined'&&videoIncomingFrom)||document.getElementById('videoIncomingName')?.textContent?.trim()||'';
                try{
                  if(name){videoIncomingFrom=name;videoTargetUser=name;videoCallRole='callee';}
                  hideIncomingVideoCall?.();
                  const ok=await waitVideoChannel(12000);
                  if(!ok){alert('영상통화 서버 연결에 실패했습니다.');return false;}
                  console.log('[v33] VIDEO CHANNEL READY callee',name);
                  const r=await originalAccept.apply(this,arguments);
                  console.log('[v33] ACCEPT SENT',name,'peer=',typeof videoPeer!=='undefined'&&!!videoPeer);
                  return r;
                }catch(e){console.error('[v33] accept error',e);try{setVideoStatus?.('영상통화 오류: '+(e?.message||e));}catch{}alert('영상통화 연결 오류: '+(e?.message||e));return false;}
              };
              const originalPeer=window.createVideoPeer;
              window.createVideoPeer=function(){
                const peer=originalPeer.apply(this,arguments);
                try{
                  peer.addEventListener('iceconnectionstatechange',()=>console.log('[v33] ICE',peer.iceConnectionState));
                  peer.addEventListener('connectionstatechange',()=>console.log('[v33] PEER',peer.connectionState));
                  peer.addEventListener('signalingstatechange',()=>console.log('[v33] SIGNAL',peer.signalingState));
                  peer.addEventListener('icecandidateerror',e=>console.warn('[v33] ICE ERROR',e?.errorCode,e?.url));
                }catch(e){}
                return peer;
              };
              const originalSignal=window.sendVideoSignal;
              window.sendVideoSignal=function(payload){
                console.log('[v33] VIDEO TX',payload?.type,payload?.from,'->',payload?.to);
                return originalSignal.apply(this,arguments);
              };
              console.log('[v33] reliable video signaling installed');
            }

            /* v28: native GPS가 실제로 들어오는지 WebView console/localStorage에 기록 */
            function repairStaleLocationLabels(){
              try{
                if(!Array.isArray(window.familyLocationData))return;
                const now=Date.now();
                document.querySelectorAll('.person').forEach((el,i)=>{
                  const name=(window.family&&window.family[i])||el.querySelector('.name')?.textContent?.trim()||'';
                  const loc=window.familyLocationData.find(x=>x.user_name===name);
                  if(!loc?.updated_at)return;
                  const age=now-new Date(loc.updated_at).getTime();
                  if(Number.isFinite(age)&&age>15*60*1000){
                    const p=el.querySelector('.place');if(p)p.textContent='업데이트 지연';
                  }
                });
              }catch(e){}
            }

            function installGpsDiagnostics(){
              if(window.__v28GpsInstalled)return;window.__v28GpsInstalled=true;
              window.handleNativeLocation=(lat,lng,acc)=>{
                const msg={lat,lng,accuracy:acc,time:new Date().toISOString()};
                console.log('[v28 GPS UPDATE]',JSON.stringify(msg));
