name: Patch v59 to v60 - video call alert and speaker

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch existing v59 workflow
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          p = Path(".github/workflows/build-android-v59-final.yml")

          if not p.exists():
              raise SystemExit("ERROR: build-android-v59-final.yml not found")

          s = p.read_text()

          print("v59 workflow loaded:", len(s), "bytes")

          # ============================================================
          # 1. Workflow 이름 변경
          # ============================================================

          s = s.replace(
              "name: Build 우리집 Android APK v59 - direct-video-push",
              "name: Build 우리집 Android APK v60 - video call cancel, alert and speaker"
          )

          s = s.replace(
              "name: wanhuyul-apk-v59-direct-video-push",
              "name: wanhuyul-apk-v60-video-call-alert"
          )

          # ============================================================
          # 2. MyFirebaseService.java 전체 교체
          #
          # 영상통화 FCM 수신시
          # NORMAL  : 벨소리 + 반복 진동
          # VIBRATE : 반복 진동
          # SILENT  : 아무것도 강제하지 않음
          #
          # video_cancel 수신시 즉시 모든 알림 중지
          # ============================================================

          native_start = s.find(
              "          cat > android/app/src/main/java/com/woorijip/family/MyFirebaseService.java <<'EOF2'"
          )

          native_end = s.find(
              "          EOF2",
              native_start
          )

          if native_start < 0 or native_end < 0:
              raise SystemExit(
                  "ERROR: MyFirebaseService markers not found"
              )

          native_java = r'''package com.woorijip.family;

import android.app.*;
import android.content.*;
import android.media.*;
import android.net.Uri;
import android.os.*;

import androidx.core.app.NotificationCompat;

import com.google.firebase.messaging.FirebaseMessagingService;
import com.google.firebase.messaging.RemoteMessage;

import org.json.JSONObject;

public class MyFirebaseService extends FirebaseMessagingService {

    static final String CH = "woorijip_push";
    static final String CALL_CH = "woorijip_incoming_calls_v60";

    static final int CALL_NOTIFICATION_ID = 7601;

    private static MediaPlayer ringPlayer;
    private static Vibrator vibrator;

    private static final Object ALERT_LOCK = new Object();

    @Override
    public void onNewToken(String t) {
        super.onNewToken(t);

        getSharedPreferences(
            "woorijip_native",
            0
        ).edit()
        .putString("fcm_token", t)
        .apply();
    }

    static void stopVideoAlert(Context ctx) {

        synchronized (ALERT_LOCK) {

            try {
                if (ringPlayer != null) {

                    if (ringPlayer.isPlaying()) {
                        ringPlayer.stop();
                    }

                    ringPlayer.release();
                }

            } catch (Exception ignored) {}

            ringPlayer = null;

            try {
                if (vibrator != null) {
                    vibrator.cancel();
                }

            } catch (Exception ignored) {}

            vibrator = null;

            try {

                NotificationManager nm =
                    (NotificationManager)
                    ctx.getSystemService(
                        Context.NOTIFICATION_SERVICE
                    );

                if (nm != null) {
                    nm.cancel(CALL_NOTIFICATION_ID);
                }

            } catch (Exception ignored) {}
        }
    }

    static void startVideoAlert(Context ctx) {

        synchronized (ALERT_LOCK) {

            stopVideoAlert(ctx);

            try {

                AudioManager am =
                    (AudioManager)
                    ctx.getSystemService(
                        Context.AUDIO_SERVICE
                    );

                int mode =
                    am != null
                    ? am.getRingerMode()
                    : AudioManager.RINGER_MODE_NORMAL;


                /*
                 * SILENT
                 * ----------------
                 * 시스템 무음을 존중한다.
                 */
                if (mode != AudioManager.RINGER_MODE_SILENT) {

                    vibrator =
                        (Vibrator)
                        ctx.getSystemService(
                            Context.VIBRATOR_SERVICE
                        );

                    if (
                        vibrator != null &&
                        vibrator.hasVibrator()
                    ) {

                        if (Build.VERSION.SDK_INT >= 26) {

                            vibrator.vibrate(
                                VibrationEffect.createWaveform(
                                    new long[] {
                                        0,
                                        800,
                                        400
                                    },
                                    0
                                )
                            );

                        } else {

                            vibrator.vibrate(
                                new long[] {
                                    0,
                                    800,
                                    400
                                },
                                0
                            );
                        }
                    }
                }


                /*
                 * NORMAL
                 * ----------------
                 * 기본 전화벨 + 반복 진동
                 */
                if (
                    mode ==
                    AudioManager.RINGER_MODE_NORMAL
                ) {

                    Uri uri =
                        RingtoneManager.getDefaultUri(
                            RingtoneManager.TYPE_RINGTONE
                        );

                    try {

                        ringPlayer =
                            MediaPlayer.create(
                                ctx,
                                uri
                            );

                        if (ringPlayer != null) {

                            ringPlayer.setAudioStreamType(
                                AudioManager.STREAM_RING
                            );

                            ringPlayer.setLooping(true);

                            ringPlayer.start();
                        }

                    } catch (Exception e) {

                        android.util.Log.w(
                            "WoorijipPush",
                            "ring start",
                            e
                        );
                    }
                }

            } catch (Exception e) {

                android.util.Log.w(
                    "WoorijipPush",
                    "video alert",
                    e
                );
            }
        }
    }


    @Override
    public void onMessageReceived(RemoteMessage m) {

        super.onMessageReceived(m);

        String title = "완후율";
        String body = "새 메시지가 있어요";
        String type = "chat";
        String from = "";


        if (m.getNotification() != null) {

            if (
                m.getNotification().getTitle() != null
            ) {
                title =
                    m.getNotification().getTitle();
            }

            if (
                m.getNotification().getBody() != null
            ) {
                body =
                    m.getNotification().getBody();
            }
        }


        if (!m.getData().isEmpty()) {

            if (m.getData().containsKey("title")) {
                title =
                    m.getData().get("title");
            }

            if (m.getData().containsKey("body")) {
                body =
                    m.getData().get("body");
            }

            if (m.getData().containsKey("type")) {
                type =
                    m.getData().get("type");
            }

            if (
                m.getData().containsKey("sender_name")
            ) {
                from =
                    m.getData().get("sender_name");
            }
        }


        NotificationManager nm =
            (NotificationManager)
            getSystemService(
                Context.NOTIFICATION_SERVICE
            );


        /*
         * 발신자가 통화를 취소한 경우
         *
         * 앱이 백그라운드/종료 상태여도
         * 벨 + 진동 + 통화 알림을 즉시 중지
         */
        if ("video_cancel".equals(type)) {

            stopVideoAlert(this);

            return;
        }


        /*
         * 기존 pending_push 저장
         */
        try {

            JSONObject o =
                new JSONObject();

            o.put("title", title);
            o.put("body", body);
            o.put("type", type);
            o.put("from", from);

            getSharedPreferences(
                "woorijip_native",
                0
            )
            .edit()
            .putString(
                "pending_push",
                o.toString()
            )
            .apply();

        } catch (Exception ignored) {}


        /*
         * 일반 알림 채널
         */
        if (Build.VERSION.SDK_INT >= 26) {

            NotificationChannel c =
                new NotificationChannel(
                    CH,
                    "완후율 알림",
                    NotificationManager.IMPORTANCE_HIGH
                );

            c.setDescription("가족 메시지");
            c.setLockscreenVisibility(
                Notification.VISIBILITY_PUBLIC
            );

            nm.createNotificationChannel(c);


            /*
             * 영상통화 전용 채널
             *
             * 실제 반복 벨/진동은
             * MediaPlayer + Vibrator가 담당한다.
             */
            NotificationChannel call =
                new NotificationChannel(
                    CALL_CH,
                    "영상통화",
                    NotificationManager.IMPORTANCE_HIGH
                );

            call.setDescription("수신 영상통화");

            call.setLockscreenVisibility(
                Notification.VISIBILITY_PUBLIC
            );

            call.enableVibration(false);
            call.setSound(null, null);

            nm.createNotificationChannel(call);
        }


        Intent i =
            new Intent(
                this,
                MainActivity.class
            );

        i.addFlags(
            Intent.FLAG_ACTIVITY_CLEAR_TOP |
            Intent.FLAG_ACTIVITY_SINGLE_TOP |
            Intent.FLAG_ACTIVITY_NEW_TASK
        );

        i.putExtra("type", type);
        i.putExtra("from", from);
        i.putExtra("title", title);
        i.putExtra("body", body);


        int req =
            "video".equals(type)
            ? CALL_NOTIFICATION_ID
            : (int)(
                System.currentTimeMillis()
                & 0x7fffffff
            );


        PendingIntent pi =
            PendingIntent.getActivity(
                this,
                req,
                i,
                PendingIntent.FLAG_UPDATE_CURRENT |
                PendingIntent.FLAG_IMMUTABLE
            );


        /*
         * 영상통화
         */
        if ("video".equals(type)) {

            startVideoAlert(this);


            NotificationCompat.Builder b =
                new NotificationCompat.Builder(
                    this,
                    CALL_CH
                )
                .setSmallIcon(
                    android.R.drawable.ic_dialog_info
                )
                .setContentTitle(
                    "🎥 영상통화 요청"
                )
                .setContentText(
                    from + "님의 영상통화입니다"
                )
                .setStyle(
                    new NotificationCompat.BigTextStyle()
                    .bigText(
                        from + "님의 영상통화입니다"
                    )
                )
                .setPriority(
                    NotificationCompat.PRIORITY_MAX
                )
                .setCategory(
                    NotificationCompat.CATEGORY_CALL
                )
                .setAutoCancel(false)
                .setOngoing(true)
                .setOnlyAlertOnce(true)
                .setFullScreenIntent(
                    pi,
                    true
                )
                .setContentIntent(pi);

            nm.notify(
                CALL_NOTIFICATION_ID,
                b.build()
            );

        } else {

            /*
             * 기존 일반 푸시
             */
            NotificationCompat.Builder b =
                new NotificationCompat.Builder(
                    this,
                    CH
                )
                .setSmallIcon(
                    android.R.drawable.ic_dialog_info
                )
                .setContentTitle(title)
                .setContentText(body)
                .setStyle(
                    new NotificationCompat.BigTextStyle()
                    .bigText(body)
                )
                .setPriority(
                    NotificationCompat.PRIORITY_HIGH
                )
                .setCategory(
                    NotificationCompat.CATEGORY_MESSAGE
                )
                .setAutoCancel(true)
                .setContentIntent(pi);

            nm.notify(
                req,
                b.build()
            );
        }
    }
}'''

          native_block = (
              "          cat > android/app/src/main/java/com/woorijip/family/MyFirebaseService.java <<'EOF2'\n"
              + "\n".join(
                  "          " + x
                  for x in native_java.splitlines()
              )
              + "\n          EOF2\n"
          )

          s = (
              s[:native_start]
              + native_block
              + s[native_end + len("          EOF2\n"):]
          )


          # ============================================================
          # 3. VIBRATE 권한
          # ============================================================

          if "'MODIFY_AUDIO_SETTINGS','USE_FULL_SCREEN_INTENT'" in s:

              s = s.replace(
                  "'MODIFY_AUDIO_SETTINGS','USE_FULL_SCREEN_INTENT'",
                  "'MODIFY_AUDIO_SETTINGS','VIBRATE','USE_FULL_SCREEN_INTENT'",
                  1
              )


          # ============================================================
          # 4. MainActivity에 네이티브 브릿지 추가
          # ============================================================

          bridge = (
              '              @JavascriptInterface '
              'public void clearPendingPush(){'
              'getSharedPreferences(PREF,0)'
              '.edit()'
              '.remove("pending_push")'
              '.apply();}'
          )

          bridge_add = bridge + '''
              @JavascriptInterface public void startVideoAlert(){
                  MyFirebaseService.startVideoAlert(MainActivity.this);
              }

              @JavascriptInterface public void stopVideoAlert(){
                  MyFirebaseService.stopVideoAlert(MainActivity.this);
              }

              @JavascriptInterface public void setVideoSpeaker(boolean on){
                  try{
                      android.media.AudioManager am =
                          (android.media.AudioManager)
                          getSystemService(AUDIO_SERVICE);

                      if(am != null){
                          am.setMode(
                              android.media.AudioManager.MODE_IN_COMMUNICATION
                          );

                          am.setSpeakerphoneOn(on);
                      }
                  }catch(Exception e){
                      android.util.Log.w(
                          "WoorijipAudio",
                          "speaker",
                          e
                      );
                  }
              }
          '''

          if bridge not in s:
              raise SystemExit(
                  "ERROR: clearPendingPush bridge not found"
              )

          if "setVideoSpeaker(boolean on)" not in s:
              s = s.replace(
                  bridge,
                  bridge_add,
                  1
              )


          # ============================================================
          # 5. 기존 v59 영상통화 패치 영역 찾기
          # ============================================================

          v55_start = s.find(
              "          /* v55: direct patch of original caller. No sendVideoSignal wrapper/delay. */"
          )

          v44_start = s.find(
              "          /* v44: 현재 원본 initVideoCalling",
              v55_start
          )

          if v55_start < 0 or v44_start < 0:
              raise SystemExit(
                  "ERROR: v55/v44 patch markers not found"
              )


          # ============================================================
          # 6. 기존 v59 push는 그대로 유지
          # ============================================================

          v59_push = r'''          /* v59: keep the verified direct video push injection. */
          html=html.replace(
            "sendVideoSignal({type:'invite',from:currentUser,to:name});",
            "try{ const started=Date.now(); const result=await sb.functions.invoke('send-push',{body:{record:{sender_name:currentUser,receiver_name:name,content:'영상통화'},type:'video'}}); console.log('[v59] VIDEO PUSH RESULT',JSON.stringify(result.data||null),result.error||null,'ms=',Date.now()-started); }catch(e){ console.warn('[v59] video push invoke',e); }\n    sendVideoSignal({type:'invite',from:currentUser,to:name});"
          );

'''

          # ============================================================
          # 7. v60 JS 추가 기능
          # ============================================================

          v60_js = r'''          /* v60: cancel + persistent alert + speaker toggle */

          html=html.replace(
            '<button class="end" onclick="endVideoCall()" title="통화 종료">📞</button>',
            '<button id="videoSpeakerBtn" onclick="toggleVideoSpeaker()" title="스피커 끄기">🔊</button><button id="videoCancelOutgoingBtn" onclick="cancelOutgoingVideoCall()" style="display:none;background:#ff9f0a;color:#fff;border:0;border-radius:18px;padding:10px 18px;font-weight:800" title="통화 취소">취소</button><button class="end" onclick="endVideoCall()" title="통화 종료">📞</button>'
          );


          html=html.replace(
            "let videoCallRole = null;",
            "let videoCallRole = null;\nlet videoSpeakerOn = true;"
          );


          /*
           * 영상통화 화면이 열리면
           * 기본 스피커 ON
           */
          html=html.replace(
            "document.getElementById('videoCallOverlay')?.classList.add('show');\n  videoCallStartedAt=Date.now();",
            "document.getElementById('videoCallOverlay')?.classList.add('show');\n  try{videoSpeakerOn=true;window.WoorijipNative?.setVideoSpeaker?.(true);}catch(e){}\n  const speakerBtn=document.getElementById('videoSpeakerBtn'); if(speakerBtn){speakerBtn.textContent='🔊';speakerBtn.title='스피커 끄기';speakerBtn.classList.remove('active');}\n  const cancelBtn=document.getElementById('videoCancelOutgoingBtn'); if(cancelBtn) cancelBtn.style.display=(videoCallRole==='caller'?'inline-flex':'none');\n  videoCallStartedAt=Date.now();"
          );


          /*
           * 스피커 ON/OFF
           */
          html=html.replace(
            "function setVideoStatus(text){ const el=document.getElementById('videoCallStatus'); if(el) el.textContent=text||''; }",
            "function setVideoStatus(text){ const el=document.getElementById('videoCallStatus'); if(el) el.textContent=text||''; }\nfunction toggleVideoSpeaker(){ videoSpeakerOn=!videoSpeakerOn; try{window.WoorijipNative?.setVideoSpeaker?.(videoSpeakerOn);}catch(e){} const btn=document.getElementById('videoSpeakerBtn'); if(btn){btn.textContent=videoSpeakerOn?'🔊':'🔇';btn.title=videoSpeakerOn?'스피커 끄기':'스피커 켜기';btn.classList.toggle('active',!videoSpeakerOn);} }"
          );


          /*
           * 상대방이 전화를 받으면
           * 발신자 취소 버튼 숨김
           */
          html=html.replace(
            "if(payload.type==='accept'){\n      if(videoTargetUser!==payload.from) return;",
            "if(payload.type==='accept'){\n      if(videoTargetUser!==payload.from) return;\n      const cb=document.getElementById('videoCancelOutgoingBtn'); if(cb) cb.style.display='none';"
          );


          /*
           * end / reject / cancel
           */
          html=html.replace(
            "if(payload.type==='end' || payload.type==='reject'){\n      if(videoTargetUser===payload.from || videoIncomingFrom===payload.from){\n        const wasReject=payload.type==='reject';\n        cleanupVideoCall(wasReject ? '통화가 거절되었습니다.' : '통화가 종료되었습니다.');\n      }",
            "if(payload.type==='end' || payload.type==='reject' || payload.type==='cancel'){\n      if(videoTargetUser===payload.from || videoIncomingFrom===payload.from){\n        const wasReject=payload.type==='reject'; const wasCancel=payload.type==='cancel';\n        cleanupVideoCall(wasReject ? '통화가 거절되었습니다.' : wasCancel ? '상대방이 통화를 취소했습니다.' : '통화가 종료되었습니다.');\n      }"
          );


          /*
           * 수신 영상통화가 화면에 나타날 때
           * 네이티브 반복 벨/진동 시작
           */
          html=html.replace(
            "document.getElementById('videoIncomingOverlay')?.classList.add('show');",
            "document.getElementById('videoIncomingOverlay')?.classList.add('show');\n  try{window.WoorijipNative?.startVideoAlert?.();}catch(e){}"
          );


          /*
           * 받기
           */
          html=html.replace(
            "async function acceptVideoCall(){\n  if(!videoIncomingFrom) return;",
            "async function acceptVideoCall(){\n  if(!videoIncomingFrom) return;\n  try{window.WoorijipNative?.stopVideoAlert?.();}catch(e){}"
          );


          /*
           * 거절
           */
          html=html.replace(
            "function rejectVideoCall(silent=false){\n  const name=videoIncomingFrom;",
            "function rejectVideoCall(silent=false){\n  try{window.WoorijipNative?.stopVideoAlert?.();}catch(e){}\n  const name=videoIncomingFrom;"
          );


          /*
           * 발신자 통화 취소
           */
          html=html.replace(
            "function endVideoCall(){\n  if(videoTargetUser) sendVideoSignal({type:'end',from:currentUser,to:videoTargetUser});\n  cleanupVideoCall('통화를 종료했습니다.');\n}",
            "async function cancelOutgoingVideoCall(){\n  const name=videoTargetUser; if(!name || videoCallRole!=='caller') return;\n  try{sendVideoSignal({type:'cancel',from:currentUser,to:name});}catch(e){}\n  try{await sb.functions.invoke('send-push',{body:{record:{sender_name:currentUser,receiver_name:name,content:'영상통화 취소'},type:'video_cancel'}});}catch(e){console.warn('[v60] video cancel push',e);}\n  cleanupVideoCall('영상통화를 취소했습니다.');\n}\nfunction endVideoCall(){\n  if(videoTargetUser) sendVideoSignal({type:'end',from:currentUser,to:videoTargetUser});\n  cleanupVideoCall('통화를 종료했습니다.');\n}"
          );


          /*
           * 통화 종료시
           * 벨/진동 정지
           * 스피커 상태 초기화
           */
          html=html.replace(
            "function cleanupVideoCall(message){\n  hideIncomingVideoCall();",
            "function cleanupVideoCall(message){\n  try{window.WoorijipNative?.stopVideoAlert?.();}catch(e){}\n  try{window.WoorijipNative?.setVideoSpeaker?.(true);}catch(e){}\n  videoSpeakerOn=true;\n  hideIncomingVideoCall();"
          );


          /*
           * UI 초기화
           */
          html=html.replace(
            "videoMuted=false; videoCameraOff=false; videoCurrentCameraIndex=0; videoCallRole=null; videoRemoteVideoTrack=null;",
            "videoMuted=false; videoCameraOff=false; videoCurrentCameraIndex=0; videoCallRole=null; videoRemoteVideoTrack=null;\n  const cancelBtn=document.getElementById('videoCancelOutgoingBtn'); if(cancelBtn) cancelBtn.style.display='none';\n  const speakerBtn=document.getElementById('videoSpeakerBtn'); if(speakerBtn){speakerBtn.textContent='🔊';speakerBtn.title='스피커 끄기';speakerBtn.classList.remove('active');}"
          );


          # ============================================================
          # 8. v59 영역을 v59 + v60으로 교체
          # ============================================================

          s = (
              s[:v55_start]
              + v59_push
              + v60_js
              + s[v44_start:]
          )


          # ============================================================
          # 9. pending push로 영상통화 UI가 열리는 경우에도
          #    네이티브 알림 시작
          # ============================================================

          old = (
              "if(data.type==='video' && data.from){\n"
              "            setTimeout(()=>{ showIncomingVideoCall && showIncomingVideoCall(data.from); }, 800);"
          )

          new = (
              "if(data.type==='video' && data.from){\n"
              "            try{WoorijipNative?.startVideoAlert?.();}catch(e){}\n"
              "            setTimeout(()=>{ showIncomingVideoCall && showIncomingVideoCall(data.from); }, 800);"
          )

          if old in s:
              s = s.replace(old,new,1)


          # ============================================================
          # 저장
          # ============================================================

          p.write_text(
              s,
              encoding="utf-8"
          )

          print("")
          print("========================================")
          print("v60 PATCH COMPLETE")
          print("========================================")
          print("modified:", p)
          print("size:", len(s))
          PY


      - name: Validate v60 patch
        shell: bash
        run: |
          set -e

          echo "Checking v60 patch..."

          grep -q "video_cancel" \
            .github/workflows/build-android-v59-final.yml

          grep -q "videoSpeakerBtn" \
            .github/workflows/build-android-v59-final.yml

          grep -q "videoCancelOutgoingBtn" \
            .github/workflows/build-android-v59-final.yml

          grep -q "setVideoSpeaker" \
            .github/workflows/build-android-v59-final.yml

          grep -q "startVideoAlert" \
            .github/workflows/build-android-v59-final.yml

          grep -q "stopVideoAlert" \
            .github/workflows/build-android-v59-final.yml

          grep -q "VIBRATE" \
            .github/workflows/build-android-v59-final.yml

          grep -q "CALL_CH" \
