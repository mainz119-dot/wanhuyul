name: Build 우리집 Android APK v60 - call-alert-speaker

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Accept Android SDK licenses and install packages
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # v60 reuses the verified v59 build recipe, but parses it by YAML structure
      # rather than relying on exact indentation. This avoids the previous
      # "Create Capacitor project run block not found" failure.
      - name: Run verified v59 Capacitor build recipe
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          src = Path('.github/workflows/build-android-v59-final.yml')
          if not src.exists():
              raise SystemExit('v59 workflow file is missing: ' + str(src))

          lines = src.read_text(encoding='utf-8-sig').replace('\r\n','\n').replace('\r','\n').splitlines()

          # Find the exact step by stripped text, then find its run: | line
          step = next((i for i,x in enumerate(lines)
                       if x.strip() == '- name: Create Capacitor project'), -1)
          if step < 0:
              raise SystemExit('v59 Create Capacitor project step not found')

          run_line = -1
          for i in range(step + 1, len(lines)):
              t = lines[i].strip()
              if t == 'run: |':
                  run_line = i
                  break
              if t.startswith('- name:'):
                  break
          if run_line < 0:
              raise SystemExit('v59 Create Capacitor project run block not found')

          body=[]
          for line in lines[run_line+1:]:
              stripped=line.lstrip()
              if stripped.startswith('- name:') and len(line)-len(stripped) <= 8:
                  break
              # Remove the YAML block indentation. The v59 body normally has
              # 10 spaces, but this accepts any common indentation >= 2.
              body.append(line[10:] if line.startswith('          ') else line.lstrip() if line.strip() else '')

          # Remove trailing blank lines only; preserve the shell script itself.
          while body and not body[-1].strip(): body.pop()
          script='\n'.join(body)+'\n'
          Path('/tmp/v59-create-capacitor.sh').write_text(script,encoding='utf-8')

          print('Using v59 Create Capacitor project recipe:', len(body), 'lines')
          subprocess.run(['bash','-euo','pipefail','/tmp/v59-create-capacitor.sh'],check=True)
          PY

      - name: Patch v60 call alert, cancel and speaker controls
        shell: bash
        run: |
          set -euo pipefail

          # -----------------------------------------------------------------
          # 1. Android manifest: vibration permission.
          # -----------------------------------------------------------------
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text(encoding='utf-8')
          # Correct form used below; keep this check separate so a malformed
          # permission can never be silently introduced.
          good='<uses-permission android:name="android.permission.VIBRATE" />'
          if 'android.permission.VIBRATE' not in s:
              s=s.replace('<application',good+'\n    <application',1)
          p.write_text(s,encoding='utf-8')
          PY

          # -----------------------------------------------------------------
          # 2. Replace MyFirebaseService with the v60 incoming-call alert.
          #    v59 direct FCM/WebRTC signaling remains untouched on the web side.
          # -----------------------------------------------------------------
          cat > /tmp/MyFirebaseService.java <<'JAVA'
          package com.woorijip.family;

          import android.app.*;
          import android.content.*;
          import android.media.*;
          import android.net.Uri;
          import android.os.*;
          import androidx.core.app.NotificationCompat;
          import com.google.firebase.messaging.FirebaseMessagingService;
          import com.google.firebase.messaging.RemoteMessage;
          import org.json.JSONObject;

          public class MyFirebaseService extends FirebaseMessagingService {
            static final String CH="woorijip_push";
            static final String CALL_CH="woorijip_incoming_calls_v60";
            static final int CALL_NOTIFICATION_ID=7601;
            private static MediaPlayer ringPlayer;
            private static Vibrator vibrator;
            private static final Object LOCK=new Object();

            @Override public void onNewToken(String t){
              super.onNewToken(t);
              getSharedPreferences("woorijip_native",0).edit().putString("fcm_token",t).apply();
            }

            static void stopVideoAlert(Context ctx){
              synchronized(LOCK){
                try{
                  if(ringPlayer!=null){
                    if(ringPlayer.isPlaying())ringPlayer.stop();
                    ringPlayer.release();
                  }
                }catch(Exception ignored){}
                ringPlayer=null;
                try{if(vibrator!=null)vibrator.cancel();}catch(Exception ignored){}
                vibrator=null;
                try{
                  NotificationManager nm=(NotificationManager)ctx.getSystemService(Context.NOTIFICATION_SERVICE);
                  if(nm!=null)nm.cancel(CALL_NOTIFICATION_ID);
                }catch(Exception ignored){}
              }
            }

            static void startVideoAlert(Context ctx){
              synchronized(LOCK){
                stopVideoAlert(ctx);
                try{
                  AudioManager am=(AudioManager)ctx.getSystemService(Context.AUDIO_SERVICE);
                  int mode=am!=null?am.getRingerMode():AudioManager.RINGER_MODE_NORMAL;

                  if(mode!=AudioManager.RINGER_MODE_SILENT){
                    vibrator=(Vibrator)ctx.getSystemService(Context.VIBRATOR_SERVICE);
                    if(vibrator!=null&&vibrator.hasVibrator()){
                      if(Build.VERSION.SDK_INT>=26)
                        vibrator.vibrate(VibrationEffect.createWaveform(new long[]{0,800,400},0));
                      else
                        vibrator.vibrate(new long[]{0,800,400},0);
                    }
                  }

                  if(mode==AudioManager.RINGER_MODE_NORMAL){
                    Uri uri=RingtoneManager.getDefaultUri(RingtoneManager.TYPE_RINGTONE);
                    try{
                      ringPlayer=MediaPlayer.create(ctx,uri);
                      if(ringPlayer!=null){
                        if(Build.VERSION.SDK_INT>=21){
                          ringPlayer.setAudioAttributes(new AudioAttributes.Builder()
                            .setUsage(AudioAttributes.USAGE_NOTIFICATION_RINGTONE)
                            .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                            .build());
                        }else{
                          ringPlayer.setAudioStreamType(AudioManager.STREAM_RING);
                        }
                        ringPlayer.setLooping(true);
                        ringPlayer.start();
                      }
                    }catch(Exception e){android.util.Log.w("WoorijipPush","ring start",e);}
                  }
                }catch(Exception e){android.util.Log.w("WoorijipPush","video alert",e);}
              }
            }

            @Override public void onMessageReceived(RemoteMessage m){
              super.onMessageReceived(m);

              String title="완후율",body="새 메시지가 있어요",type="chat",from="";
              if(m.getNotification()!=null){
                if(m.getNotification().getTitle()!=null)title=m.getNotification().getTitle();
                if(m.getNotification().getBody()!=null)body=m.getNotification().getBody();
              }
              if(!m.getData().isEmpty()){
                if(m.getData().containsKey("title"))title=m.getData().get("title");
                if(m.getData().containsKey("body"))body=m.getData().get("body");
                if(m.getData().containsKey("type"))type=m.getData().get("type");
                if(m.getData().containsKey("sender_name"))from=m.getData().get("sender_name");
              }

              if("video_cancel".equals(type)){
                stopVideoAlert(this);
                return;
              }

              try{
                JSONObject o=new JSONObject();
                o.put("title",title);
                o.put("body",body);
                o.put("type",type);
                o.put("from",from);
                getSharedPreferences("woorijip_native",0).edit().putString("pending_push",o.toString()).apply();
              }catch(Exception ignored){}

              NotificationManager nm=(NotificationManager)getSystemService(Context.NOTIFICATION_SERVICE);

              if(Build.VERSION.SDK_INT>=26){
                NotificationChannel c=new NotificationChannel(CH,"완후율 알림",NotificationManager.IMPORTANCE_HIGH);
                c.setDescription("가족 메시지");
                c.setLockscreenVisibility(Notification.VISIBILITY_PUBLIC);
                nm.createNotificationChannel(c);

                NotificationChannel call=new NotificationChannel(CALL_CH,"영상통화",NotificationManager.IMPORTANCE_HIGH);
                call.setDescription("수신 영상통화");
                call.setLockscreenVisibility(Notification.VISIBILITY_PUBLIC);
                call.enableVibration(false);
                call.setSound(null,null);
                nm.createNotificationChannel(call);
              }

              Intent i=new Intent(this,MainActivity.class);
              i.addFlags(Intent.FLAG_ACTIVITY_CLEAR_TOP|Intent.FLAG_ACTIVITY_SINGLE_TOP|Intent.FLAG_ACTIVITY_NEW_TASK);
              i.putExtra("type",type);
              i.putExtra("from",from);
              i.putExtra("title",title);
              i.putExtra("body",body);

              int req="video".equals(type)?CALL_NOTIFICATION_ID:(int)(System.currentTimeMillis()&0x7fffffff);
              PendingIntent pi=PendingIntent.getActivity(this,req,i,PendingIntent.FLAG_UPDATE_CURRENT|PendingIntent.FLAG_IMMUTABLE);

              if("video".equals(type)){
                startVideoAlert(this);
                NotificationCompat.Builder b=new NotificationCompat.Builder(this,CALL_CH)
                  .setSmallIcon(android.R.drawable.ic_dialog_info)
                  .setContentTitle("🎥 영상통화 요청")
                  .setContentText(from+"님의 영상통화입니다")
                  .setStyle(new NotificationCompat.BigTextStyle().bigText(from+"님의 영상통화입니다"))
                  .setPriority(NotificationCompat.PRIORITY_MAX)
                  .setCategory(NotificationCompat.CATEGORY_CALL)
                  .setAutoCancel(false)
                  .setOngoing(true)
                  .setOnlyAlertOnce(true)
                  .setFullScreenIntent(pi,true)
                  .setContentIntent(pi);
                nm.notify(CALL_NOTIFICATION_ID,b.build());
              }else{
                NotificationCompat.Builder b=new NotificationCompat.Builder(this,CH)
                  .setSmallIcon(android.R.drawable.ic_dialog_info)
                  .setContentTitle(title)
                  .setContentText(body)
                  .setStyle(new NotificationCompat.BigTextStyle().bigText(body))
                  .setPriority(NotificationCompat.PRIORITY_HIGH)
                  .setCategory(NotificationCompat.CATEGORY_MESSAGE)
                  .setAutoCancel(true)
                  .setContentIntent(pi);
                nm.notify(req,b.build());
              }
            }
          }
          JAVA
          cp /tmp/MyFirebaseService.java android/app/src/main/java/com/woorijip/family/MyFirebaseService.java

          # -----------------------------------------------------------------
          # 3. Add native bridge methods to MainActivity.
          # -----------------------------------------------------------------
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/java/com/woorijip/family/MainActivity.java')
          s=p.read_text(encoding='utf-8')
          marker='@JavascriptInterface public void stopNativeLocation(){'
          if 'startVideoAlert(){MyFirebaseService.startVideoAlert' not in s:
              # Insert immediately before the NativeBridge closing brace.
              needle='            }\n            void deliverPendingPush()'
              add='''            @JavascriptInterface public void startVideoAlert(){MyFirebaseService.startVideoAlert(MainActivity.this);}
              @JavascriptInterface public void stopVideoAlert(){MyFirebaseService.stopVideoAlert(MainActivity.this);}
              @JavascriptInterface public void setVideoSpeaker(boolean on){
                try{
                  android.media.AudioManager am=(android.media.AudioManager)getSystemService(AUDIO_SERVICE);
                  if(am!=null){
                    am.setMode(android.media.AudioManager.MODE_IN_COMMUNICATION);
                    am.setSpeakerphoneOn(on);
                  }
                }catch(Exception e){android.util.Log.w("WoorijipAudio","speaker",e);}
              }
            }\n            void deliverPendingPush()'''
              if needle not in s:
                  raise SystemExit('MainActivity NativeBridge insertion point not found')
              s=s.replace(needle,add,1)
          p.write_text(s,encoding='utf-8')
          PY

          # -----------------------------------------------------------------
          # 4. Patch the already-generated www/index.html.
          #    This is deliberately a wrapper: the verified v59 WebRTC code
          #    itself is not rewritten.
          # -----------------------------------------------------------------
          python3 - <<'PY'
          from pathlib import Path
          p=Path('www/index.html')
          s=p.read_text(encoding='utf-8')
          patch=r'''<script id="woorijip-v60-call-patch">
          (function(){
            let speakerOn=true;
            const native=()=>window.WoorijipNative||{};
            const showCancel=show=>{const b=document.getElementById('videoCancelOutgoingBtn');if(b)b.style.display=show?'inline-flex':'none';};
            const setSpeaker=on=>{speakerOn=!!on;try{native().setVideoSpeaker?.(speakerOn);}catch(e){}const b=document.getElementById('videoSpeakerBtn');if(b){b.textContent=speakerOn?'🔊':'🔇';b.title=speakerOn?'스피커 끄기':'스피커 켜기';}};
            window.toggleVideoSpeaker=()=>setSpeaker(!speakerOn);
            window.__v60CancelOutgoing=async()=>{
              const name=(typeof videoTargetUser!=='undefined'&&videoTargetUser)||'';
              const role=(typeof videoCallRole!=='undefined'&&videoCallRole)||'';
              if(!name||role!=='caller')return;
              try{if(typeof sendVideoSignal==='function')sendVideoSignal({type:'end',from:currentUser,to:name});}catch(e){}
              try{await sb.functions.invoke('send-push',{body:{record:{sender_name:currentUser,receiver_name:name,content:'영상통화 취소'},type:'video_cancel'}});}catch(e){console.warn('[v60] cancel push',e);}
              try{native().stopVideoAlert?.();}catch(e){}
              try{cleanupVideoCall('영상통화를 취소했습니다.');}catch(e){}
            };
            function buttons(){
              const end=document.querySelector('#videoCallOverlay button.end');if(!end)return;
              if(!document.getElementById('videoSpeakerBtn')){const b=document.createElement('button');b.id='videoSpeakerBtn';b.type='button';b.textContent='🔊';b.title='스피커 끄기';b.onclick=window.toggleVideoSpeaker;b.style.cssText='border:0;border-radius:18px;padding:10px 14px;font-weight:800';end.parentNode.insertBefore(b,end);}
              if(!document.getElementById('videoCancelOutgoingBtn')){const b=document.createElement('button');b.id='videoCancelOutgoingBtn';b.type='button';b.textContent='취소';b.title='통화 취소';b.onclick=window.__v60CancelOutgoing;b.style.cssText='display:none;background:#ff9f0a;color:#fff;border:0;border-radius:18px;padding:10px 18px;font-weight:800';end.parentNode.insertBefore(b,end);}
            }
            function wrap(name,fn){const f=window[name];if(typeof f!=='function'||f.__v60)return;const w=fn(f);w.__v60=true;window[name]=w;}
            function install(){
              buttons();
              wrap('startVideoCall',orig=>function(){const r=orig.apply(this,arguments);setTimeout(()=>{setSpeaker(true);showCancel((typeof videoCallRole!=='undefined'&&videoCallRole==='caller'));},80);return r;});
              wrap('showIncomingVideoCall',orig=>function(){const r=orig.apply(this,arguments);try{native().startVideoAlert?.();}catch(e){}setTimeout(()=>showCancel(false),80);return r;});
              wrap('acceptVideoCall',orig=>async function(){try{native().stopVideoAlert?.();}catch(e){}const r=await orig.apply(this,arguments);setSpeaker(true);showCancel(false);return r;});
              wrap('rejectVideoCall',orig=>function(){try{native().stopVideoAlert?.();}catch(e){}return orig.apply(this,arguments);});
              wrap('endVideoCall',orig=>function(){try{native().stopVideoAlert?.();}catch(e){}showCancel(false);return orig.apply(this,arguments);});
              wrap('cleanupVideoCall',orig=>function(){try{native().stopVideoAlert?.();native().setVideoSpeaker?.(true);}catch(e){}speakerOn=true;showCancel(false);return orig.apply(this,arguments);});
            }
            const t=setInterval(install,500);setTimeout(()=>clearInterval(t),20000);install();
          })();
          </script>'''
          if 'id="woorijip-v60-call-patch"' not in s:
              s=s.replace('</body>',patch+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY

          node --check scripts/prepare-web.mjs
          node --check scripts/bundle-native.mjs
          test -f android/app/src/main/java/com/woorijip/family/MyFirebaseService.java
          grep -q 'android.permission.VIBRATE' android/app/src/main/AndroidManifest.xml
          grep -q 'startVideoAlert' android/app/src/main/java/com/woorijip/family/MainActivity.java
          grep -q 'woorijip-v60-call-patch' www/index.html

      - name: Build Debug APK
        shell: bash
        run: |
          set -e
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wanhuyul-apk-v60-call-alert-speaker
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
