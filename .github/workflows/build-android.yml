
name: Build 우리집 Android APK v16 - Full Fix Crash+Location+Video

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
          accept-android-sdk-licenses: true
      - name: Create Capacitor project - FULL FIX
        shell: bash
        run: |
          set -e
          cat > package.json <<'JSON'
          {
            "private": true,
            "scripts": {"build":"node scripts/prepare-web.mjs && node scripts/bundle-native.mjs"},
            "dependencies": {
              "@capacitor/android":"8.5.1",
              "@capacitor/cli":"8.5.1",
              "@capacitor/core":"8.5.1",
              "esbuild":"0.25.9",
              "typescript":"5.9.2"
            }
          }
          JSON
          cat > capacitor.config.ts <<'EOF2'
          import type { CapacitorConfig } from '@capacitor/cli';
          const config: CapacitorConfig={
            appId:'com.woorijip.family',
            appName:'우리집',
            webDir:'www',
            android:{useLegacyBridge:false,adjustMarginsForEdgeToEdge:'force'},
            server:{ androidScheme:'https' }
          };
          export default config;
          EOF2
          mkdir -p scripts native
          cat > native/native-bridge.js <<'EOF2'
          (()=> {
            const emit = (lat,lng,acc) => {
              window.dispatchEvent(new CustomEvent('native-location-update', {detail:{latitude:lat, longitude:lng, accuracy:acc}}));
              // Also save directly if Supabase lib available
              try{
                const body = JSON.stringify({user_name: localStorage.getItem('woorijipCurrentUser')||'', latitude:lat, longitude:lng, accuracy:acc, updated_at:new Date().toISOString()});
                // let JS handle saving to avoid CORS key exposure here
              }catch(e){}
            };
            window.addEventListener('WoorijipLocationUpdate', (e)=> emit(e.detail?.latitude, e.detail?.longitude, e.detail?.accuracy));
          })();
          EOF2
          cat > scripts/prepare-web.mjs <<'EOF2'
          import fs from 'node:fs'; import path from 'node:path';
          const root=process.cwd(), out=path.join(root,'www');
          const excluded=new Set(['.git','.github','android','www','node_modules','native','scripts','package.json','package-lock.json','capacitor.config.ts']);
          fs.rmSync(out,{recursive:true,force:true}); fs.mkdirSync(out,{recursive:true});
          for(const name of fs.readdirSync(root)){if(excluded.has(name))continue;fs.cpSync(path.join(root,name),path.join(out,name),{recursive:true});}
          let html=fs.readFileSync(path.join(out,'index.html'),'utf8');
          if(!html.includes('native-bridge.js')) html=html.replace(/<\/body>/i,'<script type="module" src="./native-bridge.js"></script></body>');
          fs.writeFileSync(path.join(out,'index.html'),html);
          EOF2
          cat > scripts/bundle-native.mjs <<'EOF2'
          import {build} from 'esbuild'; await build({entryPoints:['./native/native-bridge.js'],bundle:true,format:'esm',platform:'browser',target:'es2022',outfile:'www/native-bridge.js'});
          EOF2
          npm install
          npm run build
          npx cap add android
          npx cap sync android

          python3 - <<'PY'
          from pathlib import Path
          root=Path('android/build.gradle'); s=root.read_text()
          if 'com.google.gms:google-services' not in s:
            s=s.replace('dependencies {', "dependencies {\n        classpath 'com.google.gms:google-services:4.4.3'", 1)
          root.write_text(s)
          app=Path('android/app/build.gradle'); s=app.read_text()
          if 'com.google.gms.google-services' not in s:
            s += "\napply plugin: 'com.google.gms.google-services'\n"
          app.write_text(s)
          PY
          mkdir -p android/app
          echo '' | base64 --decode > android/app/google-services.json

          # === FIXED MainActivity.java - handles GPS, Camera, Mic permissions correctly ===
          cat > android/app/src/main/java/com/woorijip/family/MainActivity.java <<'EOF2'
          package com.woorijip.family;
          import android.Manifest;
          import android.content.*;
          import android.content.pm.PackageManager;
          import android.os.*;
          import android.webkit.*;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.BridgeActivity;
          import com.google.firebase.messaging.FirebaseMessaging;

          public class MainActivity extends BridgeActivity {
            static final int PERM=9001;
            static final String PREF="woorijip_native";
            private BroadcastReceiver locationReceiver;

            public class NativeBridge {
              @JavascriptInterface public String getFcmToken(){return getSharedPreferences(PREF,0).getString("fcm_token","");}
              @JavascriptInterface public String getPendingPush(){return getSharedPreferences(PREF,0).getString("pending_push","");}
              @JavascriptInterface public void clearPendingPush(){getSharedPreferences(PREF,0).edit().remove("pending_push").apply();}
              @JavascriptInterface public void setLocationUser(String u){
                getSharedPreferences(PREF,0).edit().putString("user_name",u).apply();
                getSharedPreferences("woorijip_prefs",0).edit().putString("current_user",u).apply();
                getSharedPreferences(PREF,0).edit().putString("current_user",u).apply();
              }
              @JavascriptInterface public void startNativeLocation(){
                getSharedPreferences(PREF,0).edit().putBoolean("location_enabled",true).apply();
                try{ ContextCompat.startForegroundService(MainActivity.this,new Intent(MainActivity.this,NativeLocationService.class)); }
                catch(Exception e){ android.util.Log.e("WoorijipNative","start",e); }
              }
              @JavascriptInterface public void stopNativeLocation(){
                getSharedPreferences(PREF,0).edit().putBoolean("location_enabled",false).apply();
                try{ stopService(new Intent(MainActivity.this,NativeLocationService.class)); }catch(Exception ignored){}
              }
            }

            @Override public void onCreate(Bundle b){
              super.onCreate(b);
              requestPermissionsNow();
              WebView w=null;
              try{ w=getBridge().getWebView(); }catch(Exception e){ android.util.Log.w("MainActivity","getWebView",e); }
              if(w!=null){
                try{
                  w.getSettings().setGeolocationEnabled(true);
                  w.getSettings().setDatabaseEnabled(true);
                  w.getSettings().setDomStorageEnabled(true);
                  w.getSettings().setMediaPlaybackRequiresUserGesture(false);
                  w.getSettings().setJavaScriptEnabled(true);
                  w.getSettings().setAllowFileAccess(true);
                }catch(Exception e){}

                w.setWebChromeClient(new WebChromeClient(){
                  @Override public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback callback){
                    callback.invoke(origin,true,false);
                  }
                  @Override public void onPermissionRequest(PermissionRequest request){
                    runOnUiThread(()->{
                      try{ request.grant(request.getResources()); }catch(Exception e){ try{ request.deny(); }catch(Exception ignored){} }
                    });
                  }
                });
                w.addJavascriptInterface(new NativeBridge(),"WoorijipNative");
              }

              // Location broadcast receiver -> forward to WebView JS
              locationReceiver = new BroadcastReceiver(){
                @Override public void onReceive(Context ctx, Intent intent){
                  if("com.woorijip.family.LOCATION_UPDATE".equals(intent.getAction())){
                    double lat=intent.getDoubleExtra("latitude",0);
                    double lng=intent.getDoubleExtra("longitude",0);
                    float acc=intent.getFloatExtra("accuracy",0);
                    WebView webViewTmp=null;
                    try{ webViewTmp=getBridge().getWebView(); }catch(Exception e){}
                    if(webViewTmp!=null){
                      String jsTmp = String.format("try{window.handleNativeLocation && window.handleNativeLocation(%f,%f,%f); window.dispatchEvent(new CustomEvent('native-location-update',{detail:{latitude:%f,longitude:%f,accuracy:%f}}));}catch(e){}", lat,lng,acc, lat,lng,acc);
                      final WebView fWeb = webViewTmp;
                      final String fJs = jsTmp;
                      fWeb.post(()-> fWeb.evaluateJavascript(fJs, null));
                    }
                  }
                }
              };
              try{
                if(Build.VERSION.SDK_INT>=33){
                  registerReceiver(locationReceiver, new IntentFilter("com.woorijip.family.LOCATION_UPDATE"), Context.RECEIVER_NOT_EXPORTED);
                } else {
                  registerReceiver(locationReceiver, new IntentFilter("com.woorijip.family.LOCATION_UPDATE"));
                }
              }catch(Exception e){ android.util.Log.w("MainActivity","registerReceiver",e); }

              try{
                FirebaseMessaging.getInstance().getToken().addOnSuccessListener(t->{
                  getSharedPreferences(PREF,0).edit().putString("fcm_token",t).apply();
                });
              }catch(Exception e){}
              handlePushIntent(getIntent());
            }

            @Override public void onDestroy(){
              try{ if(locationReceiver!=null) unregisterReceiver(locationReceiver); }catch(Exception ignored){}
              super.onDestroy();
            }

            @Override protected void onNewIntent(Intent intent){
              super.onNewIntent(intent);
              handlePushIntent(intent);
            }

            void handlePushIntent(Intent intent){
              if(intent!=null && intent.getExtras()!=null){
                Bundle ex=intent.getExtras();
                String type=ex.getString("type");
                if(type!=null){
                  try{
                    org.json.JSONObject o=new org.json.JSONObject();
                    for(String k: ex.keySet()){
                      Object v=ex.get(k);
                      if(v!=null) o.put(k, v.toString());
                    }
                    getSharedPreferences(PREF,0).edit().putString("pending_push", o.toString()).apply();
                  }catch(Exception e){}
                }
              }
            }

            void requestPermissionsNow(){
              java.util.ArrayList<String> list=new java.util.ArrayList<>();
              String[] perms={
                Manifest.permission.ACCESS_FINE_LOCATION,
                Manifest.permission.ACCESS_COARSE_LOCATION,
                Manifest.permission.CAMERA,
                Manifest.permission.RECORD_AUDIO
              };
              for(String p: perms) if(ContextCompat.checkSelfPermission(this,p)!=PackageManager.PERMISSION_GRANTED) list.add(p);
              if(Build.VERSION.SDK_INT>=33 && ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS)!=PackageManager.PERMISSION_GRANTED){
                list.add(Manifest.permission.POST_NOTIFICATIONS);
              }
              if(!list.isEmpty()){
                try{ ActivityCompat.requestPermissions(this, list.toArray(new String[0]), PERM); }catch(Exception e){}
              }
              // Background location은 별도로 나중에 요청 (Android 11+에서 한번에 요청하면 거부됨)
              if(ContextCompat.checkSelfPermission(this, Manifest.permission.ACCESS_BACKGROUND_LOCATION)!=PackageManager.PERMISSION_GRANTED){
                // 3초 뒤에 별도 요청
                new Handler(Looper.getMainLooper()).postDelayed(()->{
                  try{
                    if(ContextCompat.checkSelfPermission(this, Manifest.permission.ACCESS_BACKGROUND_LOCATION)!=PackageManager.PERMISSION_GRANTED){
                      ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.ACCESS_BACKGROUND_LOCATION}, PERM+1);
                    }
                  }catch(Exception e){}
                }, 3000);
              }
            }
          }
          EOF2

          # === NEW: Firebase Messaging Service for push notifications ===
          cat > android/app/src/main/java/com/woorijip/family/MyFirebaseService.java <<'EOF2'
          package com.woorijip.family;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Intent;
          import android.os.Build;
          import androidx.core.app.NotificationCompat;
          import com.google.firebase.messaging.FirebaseMessagingService;
          import com.google.firebase.messaging.RemoteMessage;
          import org.json.JSONObject;

          public class MyFirebaseService extends FirebaseMessagingService {
            static final String CH_PUSH="woorijip_push";
            @Override public void onNewToken(String token){
              super.onNewToken(token);
              getSharedPreferences("woorijip_native",0).edit().putString("fcm_token",token).apply();
            }
            @Override public void onMessageReceived(RemoteMessage msg){
              super.onMessageReceived(msg);
              String title="완후율";
              String body="새 메시지가 있어요";
              String type="chat";
              String from="";
              if(msg.getNotification()!=null){
                if(msg.getNotification().getTitle()!=null) title=msg.getNotification().getTitle();
                if(msg.getNotification().getBody()!=null) body=msg.getNotification().getBody();
              }
              if(msg.getData()!=null && !msg.getData().isEmpty()){
                if(msg.getData().containsKey("title")) title=msg.getData().get("title");
                if(msg.getData().containsKey("body")) body=msg.getData().get("body");
                if(msg.getData().containsKey("type")) type=msg.getData().get("type");
                if(msg.getData().containsKey("from")) from=msg.getData().get("from");
              }
              // Save pending push for when app is opened
              try{
                JSONObject o=new JSONObject();
                o.put("title",title); o.put("body",body); o.put("type",type); o.put("from",from);
                getSharedPreferences("woorijip_native",0).edit().putString("pending_push",o.toString()).apply();
              }catch(Exception ignored){}

              NotificationManager nm=(NotificationManager)getSystemService(NOTIFICATION_SERVICE);
              if(Build.VERSION.SDK_INT>=26){
                nm.createNotificationChannel(new NotificationChannel(CH_PUSH,"완후율 알림",NotificationManager.IMPORTANCE_HIGH));
              }
              Intent intent=new Intent(this, MainActivity.class);
              intent.addFlags(Intent.FLAG_ACTIVITY_CLEAR_TOP);
              intent.putExtra("type",type);
              intent.putExtra("from",from);
              intent.putExtra("title",title);
              intent.putExtra("body",body);
              PendingIntent pi=PendingIntent.getActivity(this,0,intent,PendingIntent.FLAG_ONE_SHOT|PendingIntent.FLAG_IMMUTABLE);

              NotificationCompat.Builder b=new NotificationCompat.Builder(this,CH_PUSH)
                .setSmallIcon(android.R.drawable.ic_dialog_email)
                .setContentTitle(title)
                .setContentText(body)
                .setAutoCancel(true)
                .setContentIntent(pi)
                .setPriority(NotificationCompat.PRIORITY_HIGH);

              nm.notify((int)System.currentTimeMillis(), b.build());
            }
          }
          EOF2

          cat > android/app/src/main/java/com/woorijip/family/NativeLocationService.java <<'EOF2'
          package com.woorijip.family;
          import android.Manifest;
          import android.app.*;
          import android.content.*;
          import android.content.pm.PackageManager;
          import android.os.*;
          import androidx.annotation.NonNull;
          import androidx.core.app.NotificationCompat;
          import com.google.android.gms.location.*;
          import java.io.*; import java.net.*; import org.json.*;
          public class NativeLocationService extends Service {
            static final String CH="woorijip_location";
            FusedLocationProviderClient client; LocationCallback callback;
            @Override public int onStartCommand(Intent i,int flags,int id){
              createChannel();
              if(Build.VERSION.SDK_INT>=33 && checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS)!=PackageManager.PERMISSION_GRANTED){
                return START_NOT_STICKY;
              }
              startForeground(7001,new NotificationCompat.Builder(this,CH).setSmallIcon(android.R.drawable.ic_menu_compass).setContentTitle("우리집 위치 공유").setContentText("가족 위치를 안전하게 업데이트하고 있어요").setOngoing(true).build());
              start();
              return START_STICKY;
            }
            void createChannel(){
              if(Build.VERSION.SDK_INT>=26){
                ((NotificationManager)getSystemService(NOTIFICATION_SERVICE)).createNotificationChannel(new NotificationChannel(CH,"우리집 위치 공유",NotificationManager.IMPORTANCE_LOW));
              }
            }
            void start(){
              if(checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION)!=PackageManager.PERMISSION_GRANTED && checkSelfPermission(Manifest.permission.ACCESS_COARSE_LOCATION)!=PackageManager.PERMISSION_GRANTED){
                stopSelf(); return;
              }
              client=LocationServices.getFusedLocationProviderClient(this);
              LocationRequest r=new LocationRequest.Builder(Priority.PRIORITY_HIGH_ACCURACY,15000).setMinUpdateIntervalMillis(8000).setMinUpdateDistanceMeters(10).build();
              callback=new LocationCallback(){
                @Override public void onLocationResult(@NonNull LocationResult lr){
                  for(android.location.Location l:lr.getLocations()) send(l.getLatitude(),l.getLongitude(),l.getAccuracy());
                }
              };
              client.requestLocationUpdates(r,callback,Looper.getMainLooper());
              client.getLastLocation().addOnSuccessListener(l->{ if(l!=null) send(l.getLatitude(),l.getLongitude(),l.getAccuracy()); });
            }
            void send(double lat,double lng,float acc){
              try{
                android.content.SharedPreferences p=getSharedPreferences("woorijip_native",0);
                String u=p.getString("user_name","");
                if(u.isEmpty() || !p.getBoolean("location_enabled",false)) return;
                URL url=new URL("https://ogrqjrtulhrpuuqnymkh.supabase.co/rest/v1/family_locations?on_conflict=user_name");
                HttpURLConnection c=(HttpURLConnection)url.openConnection();
                c.setRequestMethod("POST"); c.setDoOutput(true);
                c.setRequestProperty("Content-Type","application/json");
                c.setRequestProperty("apikey","sb_publishable_gDdHqSfhl28EboFlW-dORA_XJrYZVqN");
                c.setRequestProperty("Authorization","Bearer sb_publishable_gDdHqSfhl28EboFlW-dORA_XJrYZVqN");
                c.setRequestProperty("Prefer","resolution=merge-duplicates");
                JSONObject o=new JSONObject();
                o.put("user_name",u); o.put("latitude",lat); o.put("longitude",lng); o.put("accuracy",acc);
                o.put("updated_at", new java.text.SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ss.SSS'Z'",java.util.Locale.US).format(new java.util.Date()));
                OutputStream os=c.getOutputStream(); os.write(o.toString().getBytes("UTF-8")); os.close();
                c.getResponseCode(); c.disconnect();
                // Broadcast to WebView
                Intent intent=new Intent("com.woorijip.family.LOCATION_UPDATE");
                intent.putExtra("latitude",lat); intent.putExtra("longitude",lng); intent.putExtra("accuracy",acc);
                sendBroadcast(intent);
              }catch(Exception e){ android.util.Log.w("WoorijipGPS",e.toString()); }
            }
            @Override public void onDestroy(){ if(client!=null && callback!=null) client.removeLocationUpdates(callback); super.onDestroy(); }
            @Override public android.os.IBinder onBind(Intent i){ return null; }
          }
          EOF2

          cat > scripts/patch-android.mjs <<'EOF2'
          import fs from 'node:fs';
          const m='android/app/src/main/AndroidManifest.xml'; let s=fs.readFileSync(m,'utf8');
          const perms=['ACCESS_COARSE_LOCATION','ACCESS_FINE_LOCATION','ACCESS_BACKGROUND_LOCATION','FOREGROUND_SERVICE','FOREGROUND_SERVICE_LOCATION','POST_NOTIFICATIONS','CAMERA','RECORD_AUDIO'];
          for(const p of perms) if(!s.includes('android.permission.'+p)) s=s.replace('<application','<uses-permission android:name="android.permission.'+p+'" />\n    <application');
          s=s.replace('</application>','<service android:name=".NativeLocationService" android:exported="false" android:foregroundServiceType="location" />\n  <service android:name=".MyFirebaseService" android:exported="false"><intent-filter><action android:name="com.google.firebase.MESSAGING_EVENT"/></intent-filter></service>\n    </application>');
          fs.writeFileSync(m,s);
          EOF2
          node scripts/patch-android.mjs
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/build.gradle'); s=p.read_text()
          if 'play-services-location' not in s:
            s += "\ndependencies { implementation 'com.google.android.gms:play-services-location:21.3.0' }\n"
          if 'firebase-messaging' not in s:
            s += "\ndependencies { implementation 'com.google.firebase:firebase-messaging:24.1.0' }\n"
          p.write_text(s)
          PY
      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 우리집-debug-v16-fullfix
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
