name: Build 우리집 Android APK v19 - Push Auth + Video Call Fix

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
          accept-android-sdk-licenses: true
      - name: Create Capacitor project
        shell: bash
        run: |
          set -e
          cat > package.json <<'JSON'
          {"private":true,"scripts":{"build":"node scripts/prepare-web.mjs && node scripts/bundle-native.mjs"},"dependencies":{"@capacitor/android":"8.5.1","@capacitor/cli":"8.5.1","@capacitor/core":"8.5.1","esbuild":"0.25.9","typescript":"5.9.2"}}
          JSON
          cat > capacitor.config.ts <<'EOF2'
          import type { CapacitorConfig } from '@capacitor/cli';
          const config: CapacitorConfig={appId:'com.woorijip.family',appName:'우리집',webDir:'www',android:{useLegacyBridge:false,adjustMarginsForEdgeToEdge:'force'},server:{androidScheme:'https'}};
          export default config;
          EOF2
          mkdir -p scripts native
          cat > native/native-bridge.js <<'EOF2'
          (()=>{
            let tokenSynced=false;
            const native=()=>window.WoorijipNative&&typeof window.WoorijipNative.startNativeLocation==='function';
            const me=()=>{try{return(typeof currentUser!=='undefined'&&currentUser)||localStorage.getItem('woorijipCurrentUser')||localStorage.getItem('woorijipMyName')||''}catch(e){return''}};
            const locOn=()=>{try{return localStorage.getItem('woorijipLocationSharing')==='1'||localStorage.getItem('woorijipLocationSharingEnabled')==='1'}catch(e){return false}};
            const ensureAuth=async()=>{try{if(typeof sb==='undefined'||!sb.auth)return false;const {data}=await sb.auth.getSession();if(data?.session)return true;const r=await sb.auth.signInAnonymously();if(r.error){console.warn('anonymous auth failed:',r.error.message);return false;}return !!r.data?.session;}catch(e){console.warn('anonymous auth error',e);return false}};
            const push=async(record,type)=>{try{if(typeof sb==='undefined')return;const ok=await ensureAuth();if(!ok)return;const {data,error}=await sb.functions.invoke('send-push',{body:{record,type}});if(error)console.warn('send-push error:',error.message||error);else console.log('send-push result:',data);}catch(e){console.warn('push call failed',e)}};
            const syncToken=async()=>{try{if(tokenSynced||typeof sb==='undefined'||!window.WoorijipNative?.getFcmToken)return;const u=me(),t=window.WoorijipNative.getFcmToken();if(!u||!t)return;const ok=await ensureAuth();if(!ok)return;const {error}=await sb.from('family_fcm_tokens').upsert({user_name:u,token:t,updated_at:new Date().toISOString()},{onConflict:'user_name'});if(error)console.warn('FCM token sync failed',error.message);else tokenSynced=true}catch(e){console.warn('FCM token sync',e)}};
            const confirmAndPush=async(type,record,text,started)=>{try{if(typeof sb==='undefined')return;const ok=await ensureAuth();if(!ok)return;const table=type==='dm'?'direct_messages':'family_messages';let q=sb.from(table).select('id,created_at').eq('sender_name',record.sender_name).eq('content',text).gte('created_at',new Date(started-15000).toISOString()).order('created_at',{ascending:false}).limit(1);if(type==='dm')q=q.eq('receiver_name',record.receiver_name);const {data,error}=await q;if(error||!data?.length){console.warn('push confirm: message not found',error?.message);return;}await push(record,type==='dm'?'dm':'group')}catch(e){console.warn('push confirm failed',e)}};
            const wrap=()=>{
              if(typeof window.sendDm==='function'&&!window.sendDm.__nativeWrapped){const dm=window.sendDm;window.sendDm=async function(...a){const started=Date.now();let text='',to='';try{text=(document.getElementById('dmInputBox')?.value||'').trim();to=(typeof family!=='undefined'&&activePersonIndex!==null?family[activePersonIndex]:'')}catch(e){}const r=await dm.apply(this,a);if(text&&to&&me())await confirmAndPush('dm',{sender_name:me(),receiver_name:to,content:text},text,started);return r};window.sendDm.__nativeWrapped=true;}
              if(typeof window.sendGroup==='function'&&!window.sendGroup.__nativeWrapped){const group=window.sendGroup;window.sendGroup=async function(...a){const started=Date.now();let text='';try{text=(document.getElementById('groupInputBox')?.value||'').trim()}catch(e){}const r=await group.apply(this,a);if(text&&me())await confirmAndPush('group',{sender_name:me(),content:text},text,started);return r};window.sendGroup.__nativeWrapped=true;}
              if(typeof window.uploadChatPhoto==='function'&&!window.uploadChatPhoto.__nativeWrapped){const up=window.uploadChatPhoto;window.uploadChatPhoto=async function(file,type){const to=type==='dm'?(typeof family!=='undefined'&&activePersonIndex!==null?family[activePersonIndex]:''):'';const r=await up.apply(this,arguments);try{if(file&&me()){const text='📷 사진을 보냈습니다.';if(type==='dm')await push({sender_name:me(),receiver_name:to,content:text},'dm');else await push({sender_name:me(),content:text},'group')}}catch(e){}return r};window.uploadChatPhoto.__nativeWrapped=true;}
              if(typeof window.startVideoCall==='function'&&!window.startVideoCall.__nativeWrapped){const vc=window.startVideoCall;window.startVideoCall=async function(...a){let to='';try{to=typeof family!=='undefined'&&activePersonIndex!==null?family[activePersonIndex]:''}catch(e){}const from=me();if(to&&from)push({sender_name:from,receiver_name:to,content:'영상통화'},'video');return vc.apply(this,a)};window.startVideoCall.__nativeWrapped=true;}
            };
            window.addEventListener('WoorijipLocationUpdate',e=>{const d=e.detail||{};window.dispatchEvent(new CustomEvent('native-location-update',{detail:d}));try{if(typeof window.handleNativeLocation==='function')window.handleNativeLocation(d.latitude,d.longitude,d.accuracy||0)}catch(err){}});
            function keep(){if(!native())return;const u=me();if(!u)return;try{WoorijipNative.setLocationUser(u);if(locOn())WoorijipNative.startNativeLocation();else WoorijipNative.stopNativeLocation()}catch(e){console.warn('native GPS bridge',e)}}
            function pendingPush(){try{const raw=window.WoorijipNative?.getPendingPush?.();if(!raw)return;const d=JSON.parse(raw);if(window.WoorijipNative?.clearPendingPush)window.WoorijipNative.clearPendingPush();const go=()=>{if(d.type==='video'&&d.from&&typeof window.showIncomingVideoCall==='function'){if(typeof videoIncomingFrom!=='undefined')videoIncomingFrom=d.from;if(typeof videoTargetUser!=='undefined')videoTargetUser=d.from;if(typeof videoCallRole!=='undefined')videoCallRole='callee';window.showIncomingVideoCall(d.from);return true}if((d.type==='chat'||d.type==='dm'||d.type==='group')&&typeof window.goToPage==='function'){window.goToPage('chat');return true}return false};if(!go())setTimeout(()=>{if(!go())setTimeout(go,1500)},800)}catch(e){}}
            async function boot(){keep();wrap();await ensureAuth();syncToken();pendingPush();}
            setTimeout(boot,1500);setInterval(()=>{keep();wrap();syncToken();pendingPush();},4000);
          })();
          EOF2
          cat > scripts/prepare-web.mjs <<'EOF2'
          import fs from 'node:fs';import path from 'node:path';
          const root=process.cwd(),out=path.join(root,'www');const excluded=new Set(['.git','.github','android','www','node_modules','native','scripts','package.json','package-lock.json','capacitor.config.ts']);
          fs.rmSync(out,{recursive:true,force:true});fs.mkdirSync(out,{recursive:true});for(const name of fs.readdirSync(root)){if(excluded.has(name))continue;fs.cpSync(path.join(root,name),path.join(out,name),{recursive:true})}
          let html=fs.readFileSync(path.join(out,'index.html'),'utf8');
          html=html.replace(/<\/body>/i,'<style>/* v19 chat overlap fix */ .chat.chat-scrollable{height:calc(52dvh - 20px)!important;max-height:500px!important;padding-bottom:78px!important} #dmMessages.chat.chat-scrollable{height:calc(52dvh - 10px)!important;min-height:300px!important;max-height:520px!important}</style></body>');
          // Video: wait for Realtime channel subscription and never drop early signals.
          html=html.replace("let videoChannel = null;","let videoChannel = null;\nlet videoChannelReady = false;\nlet videoSignalQueue = [];\nlet videoChannelReadyWaiters = [];");
          const oldInit=`async function initVideoCalling(){\n  try{\n    if(!sb || videoChannel) return;\n    videoChannel = sb.channel(videoChannelName(), { config:{ broadcast:{ self:false } } });\n    videoChannel\n      .on('broadcast',{event:'video'},({payload})=>handleVideoSignal(payload))\n      .subscribe((status)=>{\n        if(status!=='SUBSCRIBED') console.warn('영상통화 채널 연결 상태:',status);\n      });\n  }catch(e){ console.warn('영상통화 초기화 실패:',e); }\n}`;
          const newInit=`async function initVideoCalling(){\n  try{\n    if(!sb) return;\n    if(videoChannel && videoChannelReady) return;\n    videoChannel = sb.channel(videoChannelName(), { config:{ broadcast:{ self:false } } });\n    videoChannelReady=false;\n    videoChannel\n      .on('broadcast',{event:'video'},({payload})=>handleVideoSignal(payload))\n      .subscribe((status)=>{\n        videoChannelReady=(status==='SUBSCRIBED');\n        if(videoChannelReady){\n          const q=videoSignalQueue.splice(0);\n          q.forEach(p=>{try{videoChannel.send({type:'broadcast',event:'video',payload:p})}catch(e){}});\n          videoChannelReadyWaiters.splice(0).forEach(r=>r());\n        } else console.warn('영상통화 채널 연결 상태:',status);\n      });\n  }catch(e){ console.warn('영상통화 초기화 실패:',e); }\n}`;
          if oldInit not in html: raise SystemExit('old init not found')
          html=html.replace(oldInit,newInit)
          oldSend="""function sendVideoSignal(payload){\n  if(!videoChannel) return;\n  videoChannel.send({type:'broadcast',event:'video',payload}).catch(e=>console.warn('영상통화 신호 전송 실패:',e));\n}"""
          newSend="""function sendVideoSignal(payload){\n  if(!videoChannel || !videoChannelReady){\n    videoSignalQueue.push(payload);\n    initVideoCalling().catch(()=>{});\n    return;\n  }\n  videoChannel.send({type:'broadcast',event:'video',payload}).catch(e=>{console.warn('영상통화 신호 전송 실패:',e);videoSignalQueue.push(payload);});\n}"""
          if oldSend not in html: raise SystemExit('old send not found')
          html=html.replace(oldSend,newSend)
          # Ensure invite waits for channel, but do not block push/media path.
          html=html.replace("    await getVideoMedia();\n    createVideoPeer();\n    openVideoCallUI(name,'상대방의 응답을 기다리는 중…');\n    sendVideoSignal({type:'invite',from:currentUser,to:name});","    await getVideoMedia();\n    createVideoPeer();\n    openVideoCallUI(name,'상대방의 응답을 기다리는 중…');\n    await initVideoCalling();\n    sendVideoSignal({type:'invite',from:currentUser,to:name});",1)
          html=html.replace("    await getVideoMedia();\n    createVideoPeer();\n    openVideoCallUI(name,'연결 중…');\n    sendVideoSignal({type:'accept',from:currentUser,to:name});","    await getVideoMedia();\n    createVideoPeer();\n    openVideoCallUI(name,'연결 중…');\n    await initVideoCalling();\n    sendVideoSignal({type:'accept',from:currentUser,to:name});",1)
          # Incoming FCM path must initialize state before showing overlay.
          html=html.replace("function showIncomingVideoCall(name){\n  const idx=family.indexOf(name);","function showIncomingVideoCall(name){\n  if(!videoIncomingFrom) videoIncomingFrom=name;\n  if(!videoTargetUser) videoTargetUser=name;\n  const idx=family.indexOf(name);",1)
          fs.writeFileSync(path.join(out,'index.html'),html);
          EOF2
          cat > scripts/patch-android.mjs <<'EOF2'
          import fs from 'node:fs';const m='android/app/src/main/AndroidManifest.xml';let s=fs.readFileSync(m,'utf8');const perms=['ACCESS_COARSE_LOCATION','ACCESS_FINE_LOCATION','ACCESS_BACKGROUND_LOCATION','FOREGROUND_SERVICE','FOREGROUND_SERVICE_LOCATION','POST_NOTIFICATIONS','CAMERA','RECORD_AUDIO'];for(const p of perms){const line=`<uses-permission android:name="android.permission.${p}" />`;if(!s.includes(`android.permission.${p}`))s=s.replace('<application',line+'\n    <application');}if(!s.includes('NativeLocationService'))s=s.replace('</application>','<service android:name=".NativeLocationService" android:exported="false" android:foregroundServiceType="location" />\n  <service android:name=".MyFirebaseService" android:exported="false"><intent-filter><action android:name="com.google.firebase.MESSAGING_EVENT"/></intent-filter></service>\n  </application>');fs.writeFileSync(m,s);
          EOF2
          node scripts/patch-android.mjs
      - name: Build debug APK
        shell: bash
        run: |
          set -e
          cd android
          ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wanhuyul-apk-v19
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
