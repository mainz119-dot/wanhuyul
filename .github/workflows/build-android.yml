name: Build 우리집 Android APK v22 - push-video-systembar-fix

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
          accept-android-sdk-licenses: true
      - name: Create Capacitor project
        shell: bash
        run: |
          set -e
          cat > package.json <<'JSON'
          {"private":true,"scripts":{"build":"node scripts/prepare-web.mjs && node scripts/bundle-native.mjs"},"dependencies":{"@capacitor/android":"8.5.1","@capacitor/cli":"8.5.1","@capacitor/core":"8.5.1","esbuild":"0.25.9","typescript":"5.9.2"}}
          JSON
          cat > capacitor.config.ts <<'EOF2'
          import type { CapacitorConfig } from '@capacitor/cli';
          const config: CapacitorConfig={appId:'com.woorijip.family',appName:'우리집',webDir:'www',android:{useLegacyBridge:false,adjustMarginsForEdgeToEdge:'force'},server:{androidScheme:'https'}};
          export default config;
          EOF2
          mkdir -p scripts native
          cat > native/native-bridge.js <<'EOF2'
          (()=>{
            let tokenLast='';
            const native=()=>window.WoorijipNative&&typeof window.WoorijipNative.startNativeLocation==='function';
            const me=()=>{try{return(typeof currentUser!=='undefined'&&currentUser)||localStorage.getItem('woorijipMyName')||''}catch(e){return''}};
            const locOn=()=>{try{return localStorage.getItem('woorijipLocationSharing')==='1'||localStorage.getItem('woorijipLocationSharingEnabled')==='1'}catch(e){return false}};
            async function ensureAuth(){
              try{
                if(typeof sb==='undefined'||!sb.auth)return false;
                const s=await sb.auth.getSession();
                if(s.data?.session)return true;
                const r=await sb.auth.signInAnonymously();
                if(r.error){console.warn('[v20] anonymous auth:',r.error.message);return false;}
                return !!r.data?.session;
              }catch(e){console.warn('[v20] auth:',e);return false}
            }
            async function push(record,type){
              try{
                if(typeof sb==='undefined')return;
                if(!(await ensureAuth()))return;
                const r=await sb.functions.invoke('send-push',{body:{record,type}});
                if(r.error)console.warn('[v20] send-push:',r.error.message||r.error);
                else console.log('[v20] push result:',type,r.data);
              }catch(e){console.warn('[v20] push exception:',e)}
            }
            async function syncToken(){
              try{
                const user=me(), token=window.WoorijipNative?.getFcmToken?.()||'';
                if(!user||!token||typeof sb==='undefined')return;
                if(token===tokenLast)return;
                if(!(await ensureAuth()))return;
                const {error}=await sb.from('family_fcm_tokens').upsert({user_name:user,token,updated_at:new Date().toISOString()},{onConflict:'user_name'});
                if(error)console.warn('[v20] FCM token sync:',error.message);
                else{tokenLast=token;console.log('[v20] FCM token synced:',user)}
              }catch(e){console.warn('[v20] token sync exception:',e)}
            }
            function wrap(){
              if(typeof window.sendDm==='function'&&!window.sendDm.__v20Push){
                const original=window.sendDm;
                window.sendDm=async function(){
                  const box=document.getElementById('dmInputBox');
                  const text=box?.value?.trim()||'';
                  const target=(typeof family!=='undefined'&&activePersonIndex!==null)?family[activePersonIndex]:'';
                  const before=typeof dmMessagesList!=='undefined'?dmMessagesList.length:0;
                  const r=await original.apply(this,arguments);
                  if(text&&target&&typeof dmMessagesList!=='undefined'&&dmMessagesList.length>before)push({sender_name:me(),receiver_name:target,content:text},'dm');
                  return r;
                };
                window.sendDm.__v20Push=true;
              }
              if(typeof window.sendGroup==='function'&&!window.sendGroup.__v20Push){
                const original=window.sendGroup;
                window.sendGroup=async function(){
                  const box=document.getElementById('groupInputBox');
                  const text=box?.value?.trim()||'';
                  const before=typeof groupChat!=='undefined'?groupChat.length:0;
                  const r=await original.apply(this,arguments);
                  if(text&&typeof groupChat!=='undefined'&&groupChat.length>before)push({sender_name:me(),content:text},'group');
                  return r;
                };
                window.sendGroup.__v20Push=true;
              }
              if(typeof window.uploadChatPhoto==='function'&&!window.uploadChatPhoto.__v20Push){
                const original=window.uploadChatPhoto;
                window.uploadChatPhoto=async function(file,type){
                  const target=type==='dm'&&(typeof family!=='undefined'&&activePersonIndex!==null)?family[activePersonIndex]:'';
                  const r=await original.apply(this,arguments);
                  if(file&&me()){const rec=type==='dm'?{sender_name:me(),receiver_name:target,content:'📷 사진을 보냈습니다.'}:{sender_name:me(),content:'📷 사진을 보냈습니다.'};push(rec,type==='dm'?'dm':'group');}
                  return r;
                };
                window.uploadChatPhoto.__v20Push=true;
              }
              if(typeof window.startVideoCall==='function'&&!window.startVideoCall.__v20Push){
                const original=window.startVideoCall;
                window.startVideoCall=async function(){
                  const target=(typeof family!=='undefined'&&activePersonIndex!==null)?family[activePersonIndex]:'';
                  const from=me();
                  if(target&&from)push({sender_name:from,receiver_name:target,content:'영상통화'},'video');
                  return original.apply(this,arguments);
                };
                window.startVideoCall.__v20Push=true;
              }
            }
            function keep(){
              if(!native())return;
              const u=me();if(!u)return;
              try{WoorijipNative.setLocationUser(u);if(locOn())WoorijipNative.startNativeLocation();else WoorijipNative.stopNativeLocation()}catch(e){console.warn('[v20] GPS bridge',e)}
            }
            function pendingPush(){
              try{
                const raw=window.WoorijipNative?.getPendingPush?.();if(!raw)return;
                const d=JSON.parse(raw);window.WoorijipNative?.clearPendingPush?.();
                const go=()=>{
                  if(d.type==='video'&&d.from&&typeof window.showIncomingVideoCall==='function'){
                    if(typeof videoIncomingFrom!=='undefined')videoIncomingFrom=d.from;
                    if(typeof videoTargetUser!=='undefined')videoTargetUser=d.from;
                    if(typeof videoCallRole!=='undefined')videoCallRole='callee';
                    window.showIncomingVideoCall(d.from);return true;
                  }
                  if((d.type==='dm'||d.type==='group'||d.type==='chat')&&typeof window.goToPage==='function'){window.goToPage('chat');return true}
                  return false;
                };
                if(!go())setTimeout(()=>{if(!go())setTimeout(go,1500)},800);
              }catch(e){console.warn('[v20] pending push',e)}
            }
            async function boot(){await ensureAuth();syncToken();wrap();keep();pendingPush();}
            setTimeout(boot,1800);
            setInterval(()=>{syncToken();wrap();keep();pendingPush();},2000);
          })();
          EOF2
          cat > scripts/prepare-web.mjs <<'EOF2'
          import fs from 'node:fs';
          import path from 'node:path';
          const root=process.cwd();
          const out=path.join(root,'www');
          const excluded=new Set(['.git','.github','android','www','node_modules','native','scripts','package.json','package-lock.json','capacitor.config.ts']);
          fs.rmSync(out,{recursive:true,force:true});
          fs.mkdirSync(out,{recursive:true});
          for(const name of fs.readdirSync(root)){
            if(excluded.has(name)) continue;
            fs.cpSync(path.join(root,name),path.join(out,name),{recursive:true});
          }
          const htmlPath=path.join(out,'index.html');
          let html=fs.readFileSync(htmlPath,'utf8');
          const css=`
          <style id="woorijip-v20-fixes">
          /* v22-systembar-fix: Android 상태표시줄과 앱 콘텐츠 겹침 방지 */
          html,body{padding-top:0!important;margin-top:0!important}
          /* v20: 채팅 입력창/하단 네비 겹침 방지 */
          .chat.chat-scrollable{height:calc(52dvh - 20px)!important;max-height:500px!important;padding-bottom:88px!important}
          #dmMessages.chat.chat-scrollable{height:calc(52dvh - 20px)!important;min-height:300px!important;max-height:520px!important}
          /* v20: 뭐할까 페이지가 하단 네비에 가려지지 않도록 충분한 하단 여백 */
          #schedule{padding-bottom:calc(190px + env(safe-area-inset-bottom))!important;min-height:calc(100dvh - 100px);box-sizing:border-box}
          #schedule .card:last-child{margin-bottom:70px!important}
          @media(max-width:720px){#schedule{padding-bottom:calc(210px + env(safe-area-inset-bottom))!important}}
          #schedule .card:last-child{margin-bottom:40px}
          </style>`;
          const js=`
          <script id="woorijip-v20-fixes-js">
          (function(){
            const log=(...a)=>console.log('[v20]',...a);
            const me=()=>{try{return(typeof currentUser!=='undefined'&&currentUser)||localStorage.getItem('woorijipMyName')||''}catch(e){return''}};
            async function ensureAuth(){
              try{
                if(typeof sb==='undefined'||!sb.auth)return false;
                const s=await sb.auth.getSession();
                if(s.data?.session)return true;
                const r=await sb.auth.signInAnonymously();
                if(r.error){console.warn('[v20] anonymous auth:',r.error.message);return false;}
                return !!r.data?.session;
              }catch(e){console.warn('[v20] auth:',e);return false;}
            }
            async function push(record,type){
              try{
                if(!(await ensureAuth()))return;
                const r=await sb.functions.invoke('send-push',{body:{record,type}});
                if(r.error)console.warn('[v20] send-push:',r.error.message||r.error);
                else log('push',type,r.data);
              }catch(e){console.warn('[v20] push exception:',e)}
            }
            async function syncToken(){
              try{
                const token=window.WoorijipNative?.getFcmToken?.();
                const user=me();
                if(!token||!user||typeof sb==='undefined')return;
                if(!(await ensureAuth()))return;
                const {error}=await sb.from('family_fcm_tokens').upsert({user_name:user,token,updated_at:new Date().toISOString()},{onConflict:'user_name'});
                if(error)console.warn('[v20] token sync:',error.message); else log('FCM token synced',user);
              }catch(e){console.warn('[v20] token sync exception:',e)}
            }

            /* ---------- 1:1 실시간: Broadcast + 1.5초 폴백 ---------- */
            let dmChannel=null, dmReady=false, dmLastSeen={};
            function dmKey(){
              const u=me();
              const t=(typeof family!=='undefined'&&typeof activePersonIndex!=='undefined'&&activePersonIndex!==null)?family[activePersonIndex]:'';
              return [u,t].sort().join('|');
            }
            async function initDmBroadcast(){
              if(typeof sb==='undefined')return;
              try{
                if(dmChannel){
                  if(dmChannel.state==='joined')return;
                  try{await dmChannel.unsubscribe()}catch(e){}
                  dmChannel=null;
                }
                const key=dmKey();
                if(!key || key==='|')return;
                dmChannel=sb.channel('woorijip-dm-v20',{config:{broadcast:{self:false}}});
                dmReady=false;
                dmChannel.on('broadcast',{event:'dm'},({payload})=>{
                  const m=payload?.message;
                  if(!m || m.receiver_name!==me() || m.sender_name===me())return;
                  const target=(typeof family!=='undefined'&&activePersonIndex!==null)?family[activePersonIndex]:null;
                  if(target!==m.sender_name)return;
                  if(!dmMessagesList.some(x=>String(x.id)===String(m.id))){
                    dmMessagesList.push(m);
                    renderDm();
                    sb.from('direct_messages').update({is_read:true}).eq('id',m.id).then(()=>{});
                  }
                }).subscribe(status=>{dmReady=status==='SUBSCRIBED';log('DM channel',status)});
              }catch(e){console.warn('[v20] DM channel:',e)}
            }
            async function broadcastDm(row){
              try{
                if(!dmChannel || !dmReady)await initDmBroadcast();
                if(dmChannel&&dmReady)await dmChannel.send({type:'broadcast',event:'dm',payload:{message:row}});
              }catch(e){console.warn('[v20] DM broadcast:',e)}
            }
            async function pollDm(){
              try{
                if(typeof sb==='undefined'||typeof dmMessagesList==='undefined'||typeof activePersonIndex==='undefined'||activePersonIndex===null)return;
                const target=family[activePersonIndex];
                if(!target||!document.getElementById('dm')?.classList.contains('active'))return;
                const filter='and(sender_name.eq.'+me()+',receiver_name.eq.'+target+'),and(sender_name.eq.'+target+',receiver_name.eq.'+me()+')';
                const {data,error}=await sb.from('direct_messages').select('*').or(filter).order('created_at',{ascending:false}).limit(100);
                if(error||!data)return;
                const rows=data.slice().reverse();
                const ids=new Set(dmMessagesList.map(m=>String(m.id)));
                let changed=false;
                for(const row of rows){if(!ids.has(String(row.id))){dmMessagesList.push(row);changed=true;}}
                if(changed){dmMessagesList.sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));renderDm();}
              }catch(e){console.warn('[v20] DM poll:',e)}
            }

            /* 기존 sendDm은 DB 저장 후 Broadcast도 전송 */
            function wrapDm(){
              if(typeof window.sendDm!=='function'||window.sendDm.__v22Push)return;
              const original=window.sendDm;
              window.sendDm=async function(){
                const box=document.getElementById('dmInputBox');
                const text=box?.value?.trim()||'';
                const target=(typeof family!=='undefined'&&activePersonIndex!==null)?family[activePersonIndex]:'';
                const before=dmMessagesList.length;
                const r=await original.apply(this,arguments);
                if(text&&target&&dmMessagesList.length>before){
                  const row=dmMessagesList[dmMessagesList.length-1];
                  if(row?.id)await broadcastDm(row);
                  push({sender_name:me(),receiver_name:target,content:text},'dm');
                }
                return r;
              };
              window.sendDm.__v22Push=true;
            }

            /* v22-push-fix: 가족톡(그룹) / 사진 전송도 push 트리거 연결 (기존엔 누락되어 있었음) */
            function wrapGroupAndPhoto(){
              if(typeof window.sendGroup==='function'&&!window.sendGroup.__v22Push){
                const originalGroup=window.sendGroup;
                window.sendGroup=async function(){
                  const box=document.getElementById('groupInputBox');
                  const text=box?.value?.trim()||'';
                  const before=typeof groupChat!=='undefined'?groupChat.length:0;
                  const r=await originalGroup.apply(this,arguments);
                  if(text&&typeof groupChat!=='undefined'&&groupChat.length>before)push({sender_name:me(),content:text},'group');
                  return r;
                };
                window.sendGroup.__v22Push=true;
              }
              if(typeof window.uploadChatPhoto==='function'&&!window.uploadChatPhoto.__v22Push){
                const originalPhoto=window.uploadChatPhoto;
                window.uploadChatPhoto=async function(file,type){
                  const target=type==='dm'&&(typeof family!=='undefined'&&activePersonIndex!==null)?family[activePersonIndex]:'';
                  const r=await originalPhoto.apply(this,arguments);
                  if(file&&me()){
                    const rec=type==='dm'?{sender_name:me(),receiver_name:target,content:'📷 사진을 보냈습니다.'}:{sender_name:me(),content:'📷 사진을 보냈습니다.'};
                    push(rec,type==='dm'?'dm':'group');
                  }
                  return r;
                };
                window.uploadChatPhoto.__v22Push=true;
              }
            }

            /* ---------- 영상통화: 동일한 전역 lexical 변수에 직접 연결 ---------- */
            let videoReady=false, videoInitPromise=null;
            async function ensureVideoChannel(){
              if(typeof sb==='undefined')return false;
              if(typeof videoChannel!=='undefined' && videoChannel?.state==='joined')return true;
              if(videoInitPromise)return videoInitPromise;
              videoInitPromise=(async()=>{
                try{
                  if(typeof videoChannel!=='undefined' && videoChannel){try{await videoChannel.unsubscribe()}catch(e){} videoChannel=null;}
                  videoChannel=sb.channel('woorijip-video-call-v20',{config:{broadcast:{self:false}}});
                  videoReady=false;
                  videoChannel.on('broadcast',{event:'video'},({payload})=>handleVideoSignal(payload));
                  await new Promise((resolve,reject)=>{
                    const timer=setTimeout(()=>reject(new Error('video channel timeout')),8000);
                    videoChannel.subscribe(status=>{
                      log('video channel',status);
                      if(status==='SUBSCRIBED'){clearTimeout(timer);videoReady=true;resolve(true);}
                      else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'){clearTimeout(timer);reject(new Error(status));}
                    });
                  });
                  return true;
                }catch(e){console.warn('[v20] video channel:',e);return false}
                finally{videoInitPromise=null;}
              })();
              return videoInitPromise;
            }
            const originalSendVideoSignal=typeof sendVideoSignal==='function'?sendVideoSignal:null;
            if(originalSendVideoSignal){
              sendVideoSignal=async function(payload){
                const ok=await ensureVideoChannel();
                if(!ok)return false;
                try{
                  await videoChannel.send({type:'broadcast',event:'video',payload});
                  return true;
                }catch(e){console.warn('[v20] video send:',e);return false;}
              };
            }
            const originalStartVideo=window.startVideoCall;
            if(typeof originalStartVideo==='function'&&!originalStartVideo.__v20){
              window.startVideoCall=async function(){
                const target=(typeof family!=='undefined'&&activePersonIndex!==null)?family[activePersonIndex]:'';
                const from=me();
                await ensureVideoChannel();
                if(target&&from)push({sender_name:from,receiver_name:target,content:'영상통화'},'video');
                return originalStartVideo.apply(this,arguments);
              };
              window.startVideoCall.__v20=true;
            }
            const originalAcceptVideo=window.acceptVideoCall;
            if(typeof originalAcceptVideo==='function'&&!originalAcceptVideo.__v20){
              window.acceptVideoCall=async function(){await ensureVideoChannel();return originalAcceptVideo.apply(this,arguments)};
              window.acceptVideoCall.__v20=true;
            }

            /* ---------- 초기화 ---------- */
            async function boot(){
              await ensureAuth();
              await syncToken();
              await initDmBroadcast();
              wrapDm();
              wrapGroupAndPhoto();
              await ensureVideoChannel();
              await pollDm();
            }
            setTimeout(boot,1200);
            setInterval(()=>{
              syncToken();
              wrapDm();
              wrapGroupAndPhoto();
              if(document.getElementById('dm')?.classList.contains('active')){ initDmBroadcast(); pollDm(); }
              ensureVideoChannel();
            },1000);
          })();
          </script>`;
          html=html.replace(/<\/body>/i,css+js+'\n</body>');
          fs.writeFileSync(htmlPath,html);
          EOF2
          cat > scripts/bundle-native.mjs <<'EOF2'
          import {build} from 'esbuild';await build({entryPoints:['./native/native-bridge.js'],bundle:true,format:'esm',platform:'browser',target:'es2022',outfile:'www/native-bridge.js'});
          EOF2
          npm install
          node --check scripts/prepare-web.mjs
          node --check scripts/bundle-native.mjs
          npm run build
          npx cap add android
          npx cap sync android
          cat > scripts/patch-android.mjs <<'EOF2'
          import fs from 'node:fs';const m='android/app/src/main/AndroidManifest.xml';let s=fs.readFileSync(m,'utf8');const perms=['ACCESS_COARSE_LOCATION','ACCESS_FINE_LOCATION','ACCESS_BACKGROUND_LOCATION','FOREGROUND_SERVICE','FOREGROUND_SERVICE_LOCATION','POST_NOTIFICATIONS','CAMERA','RECORD_AUDIO'];for(const p of perms){const line=`<uses-permission android:name="android.permission.${p}" />`;if(!s.includes(`android.permission.${p}`))s=s.replace('<application',line+'\n    <application');}if(!s.includes('NativeLocationService'))s=s.replace('</application>','<service android:name=".NativeLocationService" android:exported="false" android:foregroundServiceType="location" />\n  <service android:name=".MyFirebaseService" android:exported="false"><intent-filter><action android:name="com.google.firebase.MESSAGING_EVENT"/></intent-filter></service>\n  </application>');fs.writeFileSync(m,s);
          EOF2
          test -f scripts/patch-android.mjs
          node --check scripts/patch-android.mjs
          node scripts/patch-android.mjs
          python3 - <<'PY'
          from pathlib import Path
          root=Path('android/build.gradle');s=root.read_text()
          if 'com.google.gms:google-services' not in s:s=s.replace('dependencies {',"dependencies {\n        classpath 'com.google.gms:google-services:4.4.3'",1)
          root.write_text(s)
          app=Path('android/app/build.gradle');s=app.read_text();deps=[]
          if 'play-services-location' not in s:deps.append("implementation 'com.google.android.gms:play-services-location:21.3.0'")
          if 'firebase-messaging' not in s:deps.append("implementation 'com.google.firebase:firebase-messaging:24.1.0'")
          if deps:s+='\n\ndependencies {\n'+'\n'.join('  '+d for d in deps)+'\n}\n'
          if 'com.google.gms.google-services' not in s:s+="\napply plugin: 'com.google.gms.google-services'\n"
          app.write_text(s)
          PY
          mkdir -p android/app
          echo ''|base64 --decode > android/app/google-services.json
          cat > android/app/src/main/java/com/woorijip/family/MainActivity.java <<'EOF2'
          package com.woorijip.family;
          import android.Manifest;import android.content.*;import android.content.pm.PackageManager;import android.os.*;import android.webkit.*;import androidx.annotation.NonNull;import androidx.core.app.ActivityCompat;import androidx.core.content.ContextCompat;import com.getcapacitor.BridgeActivity;import com.google.firebase.messaging.FirebaseMessaging;
          public class MainActivity extends BridgeActivity{
            static final int PERM=9001;static final String PREF="woorijip_native";private BroadcastReceiver locationReceiver;private PermissionRequest pendingWebPermission;private GeolocationPermissions.Callback pendingGeoCallback;private String pendingGeoOrigin;
            public class NativeBridge{
              @JavascriptInterface public String getFcmToken(){return getSharedPreferences(PREF,0).getString("fcm_token","");}
              @JavascriptInterface public String getPendingPush(){return getSharedPreferences(PREF,0).getString("pending_push","");}
              @JavascriptInterface public void clearPendingPush(){getSharedPreferences(PREF,0).edit().remove("pending_push").apply();}
              @JavascriptInterface public void setLocationUser(String u){getSharedPreferences(PREF,0).edit().putString("user_name",u).putString("current_user",u).apply();}
              @JavascriptInterface public void startNativeLocation(){getSharedPreferences(PREF,0).edit().putBoolean("location_enabled",true).apply();try{ContextCompat.startForegroundService(MainActivity.this,new Intent(MainActivity.this,NativeLocationService.class));}catch(Exception e){android.util.Log.e("WoorijipNative","GPS start",e);}}
              @JavascriptInterface public void stopNativeLocation(){getSharedPreferences(PREF,0).edit().putBoolean("location_enabled",false).apply();try{stopService(new Intent(MainActivity.this,NativeLocationService.class));}catch(Exception ignored){}}
            }
            @Override public void onCreate(Bundle b){super.onCreate(b);requestPermissionsNow();WebView w=null;try{w=getBridge().getWebView();}catch(Exception e){}if(w!=null){WebSettings st=w.getSettings();st.setJavaScriptEnabled(true);st.setDomStorageEnabled(true);st.setDatabaseEnabled(true);st.setGeolocationEnabled(true);st.setMediaPlaybackRequiresUserGesture(false);st.setAllowFileAccess(true);w.setWebChromeClient(new WebChromeClient(){
              @Override public void onGeolocationPermissionsShowPrompt(String origin,GeolocationPermissions.Callback cb){if(ContextCompat.checkSelfPermission(MainActivity.this,Manifest.permission.ACCESS_FINE_LOCATION)==PackageManager.PERMISSION_GRANTED||ContextCompat.checkSelfPermission(MainActivity.this,Manifest.permission.ACCESS_COARSE_LOCATION)==PackageManager.PERMISSION_GRANTED)cb.invoke(origin,true,false);else{pendingGeoOrigin=origin;pendingGeoCallback=cb;ActivityCompat.requestPermissions(MainActivity.this,new String[]{Manifest.permission.ACCESS_FINE_LOCATION,Manifest.permission.ACCESS_COARSE_LOCATION},PERM+2);}}
              @Override public void onPermissionRequest(PermissionRequest r){runOnUiThread(()->handleWebPermission(r));}
            });w.addJavascriptInterface(new NativeBridge(),"WoorijipNative");
