name: Build WanHuyul APK v18

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html www/index.html

          cat > prepare-web.mjs <<'EOF'
          import fs from 'fs';

          const file = 'www/index.html';
          let html = fs.readFileSync(file, 'utf8');

          /*
           * 채팅창 높이 보정
           * 기존 v31에서 채팅 영역을 너무 크게 늘린 부분을
           * 네이티브 앱에서 다시 줄여 입력창과 겹치지 않게 한다.
           */
          html = html.replace(
            '</head>',
            `
            <style id="v18-chat-fix">
              .chat.chat-scrollable{
                height:calc(52dvh - 20px)!important;
                max-height:500px!important;
                padding-bottom:78px!important;
              }

              #dmMessages.chat.chat-scrollable{
                height:calc(52dvh - 10px)!important;
                min-height:300px!important;
                max-height:520px!important;
              }
            </style>
            </head>`
          );

          /*
           * Supabase Realtime 영상통화 신호가
           * SUBSCRIBED 되기 전에 전송되면서 사라지는 문제 수정.
           */
          const oldSubscribe = `.subscribe((status)=>{`;

          const newSubscribe = `.subscribe((status)=>{
            window.__woorijipVideoReady = (status === 'SUBSCRIBED');

            if(
              status === 'SUBSCRIBED' &&
              window.__woorijipVideoSignalQueue
            ){
              const q = window.__woorijipVideoSignalQueue.splice(0);

              q.forEach(p=>{
                try{
                  videoChannel.send({
                    type:'broadcast',
                    event:'video',
                    payload:p
                  });
                }catch(e){
                  console.warn('video queued signal failed', e);
                }
              });
            }`;

          if(html.includes(oldSubscribe)){
            html = html.replace(oldSubscribe, newSubscribe);
          }

          /*
           * 영상통화 신호를 바로 보내지 않고
           * Realtime 연결 완료까지 대기시킨다.
           */
          const oldSendVideo = `
function sendVideoSignal(payload){
  if(!videoChannel) return;
  videoChannel.send({
    type:'broadcast',
    event:'video',
    payload
  }).catch(e=>console.error(e));
}`;

          const newSendVideo = `
window.__woorijipVideoSignalQueue = [];

function sendVideoSignal(payload){
  if(!videoChannel){
    window.__woorijipVideoSignalQueue.push(payload);
    return;
  }

  if(window.__woorijipVideoReady !== true){
    window.__woorijipVideoSignalQueue.push(payload);
    return;
  }

  videoChannel.send({
    type:'broadcast',
    event:'video',
    payload
  }).catch(e=>console.error('video signal send failed', e));
}`;

          if(html.includes(oldSendVideo)){
            html = html.replace(oldSendVideo, newSendVideo);
          } else {
            console.log('sendVideoSignal original pattern not found');
          }

          fs.writeFileSync(file, html);
          console.log('v18 web preparation complete');
          EOF

          node prepare-web.mjs

      - name: Create Android project
        run: |
          mkdir -p android/app/src/main/java/com/woorijip/app
          mkdir -p android/app/src/main/res/xml
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi

          cat > android/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "WanHuyul"
          include ':app'
          EOF

          cat > android/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > android/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.woorijip.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.woorijip.app'
                  minSdk 26
                  targetSdk 35
                  versionCode 18
                  versionName "18.0"
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.core:core:1.15.0'
              implementation 'com.google.android.material:material:1.12.0'

              implementation 'com.google.firebase:firebase-messaging:24.1.0'

              implementation 'com.google.android.gms:play-services-location:21.3.0'
          }
          EOF

      - name: Create AndroidManifest
        run: |
          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>

              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>

              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION"/>

              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>

              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION"/>

              <application
                  android:allowBackup="true"
                  android:label="완후율"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="unspecified">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

                  <service
                      android:name=".MyFirebaseService"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="com.google.firebase.MESSAGING_EVENT"/>
                      </intent-filter>
                  </service>

                  <service
                      android:name=".LocationService"
                      android:enabled="true"
                      android:exported="false"
                      android:foregroundServiceType="location"/>

              </application>

          </manifest>
          EOF

      - name: Create styles
        run: |
          mkdir -p android/app/src/main/res/values

          cat > android/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="Theme.Material3.DayNight.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:statusBarColor">@android:color/white</item>
                  <item name="android:navigationBarColor">@android:color/white</item>
              </style>
          </resources>
          EOF

      - name: Create MainActivity
        run: |
          cat > android/app/src/main/java/com/woorijip/app/MainActivity.java <<'EOF'
          package com.woorijip.app;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.os.Bundle;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import androidx.annotation.Nullable;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;

          import com.google.firebase.messaging.FirebaseMessaging;

          public class MainActivity extends Activity {

              private WebView webView;
              private PermissionRequest pendingPermissionRequest;

              private static final int PERMISSION_REQUEST = 1001;

              @Override
              protected void onCreate(@Nullable Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setGeolocationEnabled(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);

                  webView.setWebViewClient(new WebViewClient());

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onPermissionRequest(final PermissionRequest request) {
                          runOnUiThread(() -> {
                              boolean camera =
                                      hasPermission(Manifest.permission.CAMERA);

                              boolean mic =
                                      hasPermission(Manifest.permission.RECORD_AUDIO);

                              if(camera && mic){
                                  request.grant(request.getResources());
                              }else{
                                  pendingPermissionRequest = request;

                                  ActivityCompat.requestPermissions(
                                      MainActivity.this,
                                      new String[]{
                                          Manifest.permission.CAMERA,
                                          Manifest.permission.RECORD_AUDIO
                                      },
                                      PERMISSION_REQUEST
                                  );
                              }
                          });
                      }

                      @Override
                      public void onGeolocationPermissionsShowPrompt(
                              String origin,
                              android.webkit.GeolocationPermissions.Callback callback) {

                          callback.invoke(origin, true, false);
                      }
                  });

                  setContentView(webView);

                  webView.loadUrl("file:///android_asset/www/index.html");

                  requestBasicPermissions();

                  FirebaseMessaging.getInstance().getToken()
                      .addOnSuccessListener(token -> {
                          getSharedPreferences("wanhuyul", MODE_PRIVATE)
                              .edit()
                              .putString("fcm_token", token)
                              .apply();
                      });
              }

              private boolean hasPermission(String permission){
                  return ContextCompat.checkSelfPermission(
                      this,
                      permission
                  ) == PackageManager.PERMISSION_GRANTED;
              }

              private void requestBasicPermissions(){

                  if(!hasPermission(Manifest.permission.ACCESS_FINE_LOCATION) ||
                     !hasPermission(Manifest.permission.ACCESS_COARSE_LOCATION)){

                      ActivityCompat.requestPermissions(
                          this,
                          new String[]{
                              Manifest.permission.ACCESS_FINE_LOCATION,
                              Manifest.permission.ACCESS_COARSE_LOCATION
                          },
                          2001
                      );
                  }

                  if(android.os.Build.VERSION.SDK_INT >= 33 &&
                     !hasPermission(Manifest.permission.POST_NOTIFICATIONS)){

                      ActivityCompat.requestPermissions(
                          this,
                          new String[]{
                              Manifest.permission.POST_NOTIFICATIONS
                          },
                          2002
                      );
                  }
              }

              @Override
              public void onRequestPermissionsResult(
                      int requestCode,
                      String[] permissions,
                      int[] grantResults) {

                  super.onRequestPermissionsResult(
                      requestCode,
                      permissions,
                      grantResults
                  );

                  if(requestCode == PERMISSION_REQUEST &&
                     pendingPermissionRequest != null){

                      boolean camera =
                          hasPermission(Manifest.permission.CAMERA);

                      boolean mic =
                          hasPermission(Manifest.permission.RECORD_AUDIO);

                      if(camera && mic){
                          pendingPermissionRequest.grant(
                              pendingPermissionRequest.getResources()
                          );
                      }

                      pendingPermissionRequest = null;
                  }
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(intent);
              }
          }
          EOF

      - name: Create Firebase service
        run: |
          cat > android/app/src/main/java/com/woorijip/app/MyFirebaseService.java <<'EOF'
          package com.woorijip.app;

          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;

          import androidx.core.app.NotificationCompat;

          import com.google.firebase.messaging.FirebaseMessagingService;
          import com.google.firebase.messaging.RemoteMessage;

          public class MyFirebaseService extends FirebaseMessagingService {

              private static final String CHANNEL_ID = "wanhuyul";

              @Override
              public void onNewToken(String token) {
                  super.onNewToken(token);

                  getSharedPreferences("wanhuyul", MODE_PRIVATE)
                      .edit()
                      .putString("fcm_token", token)
                      .apply();
              }

              @Override
              public void onMessageReceived(RemoteMessage message) {

                  String title = "완후율";
                  String body = "새로운 알림이 있습니다.";

                  if(message.getNotification() != null){

                      if(message.getNotification().getTitle() != null)
                          title = message.getNotification().getTitle();

                      if(message.getNotification().getBody() != null)
                          body = message.getNotification().getBody();
                  }

                  String type = "";
                  String from = "";

                  if(message.getData() != null){

                      if(message.getData().containsKey("type"))
                          type = message.getData().get("type");

                      if(message.getData().containsKey("from"))
                          from = message.getData().get("from");

                      if(message.getData().containsKey("sender_name"))
                          from = message.getData().get("sender_name");
                  }

                  getSharedPreferences("wanhuyul", MODE_PRIVATE)
                      .edit()
                      .putString("push_type", type)
                      .putString("push_from", from)
                      .apply();

                  showNotification(title, body);
              }

              private void showNotification(String title, String body){

                  NotificationManager manager =
                      (NotificationManager)getSystemService(
                          Context.NOTIFICATION_SERVICE
                      );

                  if(Build.VERSION.SDK_INT >= 26){

                      NotificationChannel channel =
                          new NotificationChannel(
                              CHANNEL_ID,
                              "완후율 알림",
                              NotificationManager.IMPORTANCE_HIGH
                          );

                      manager.createNotificationChannel(channel);
                  }

                  Intent intent =
                      new Intent(this, MainActivity.class);

                  intent.addFlags(
                      Intent.FLAG_ACTIVITY_CLEAR_TOP |
                      Intent.FLAG_ACTIVITY_SINGLE_TOP
                  );

                  PendingIntent pendingIntent =
                      PendingIntent.getActivity(
                          this,
                          0,
                          intent,
                          PendingIntent.FLAG_UPDATE_CURRENT |
                          PendingIntent.FLAG_IMMUTABLE
                      );

                  NotificationCompat.Builder builder =
                      new NotificationCompat.Builder(
                          this,
                          CHANNEL_ID
                      )
                      .setSmallIcon(
                          android.R.drawable.ic_dialog_info
                      )
                      .setContentTitle(title)
                      .setContentText(body)
                      .setAutoCancel(true)
                      .setPriority(
                          NotificationCompat.PRIORITY_HIGH
                      )
                      .setContentIntent(pendingIntent);

                  manager.notify(
                      (int)(System.currentTimeMillis() & 0xfffffff),
                      builder.build()
                  );
              }
          }
          EOF

      - name: Create LocationService
        run: |
          cat > android/app/src/main/java/com/woorijip/app/LocationService.java <<'EOF'
          package com.woorijip.app;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.Intent;
          import android.os.IBinder;

          import androidx.annotation.Nullable;
          import androidx.core.app.NotificationCompat;

          import com.google.android.gms.location.FusedLocationProviderClient;
          import com.google.android.gms.location.LocationCallback;
          import com.google.android.gms.location.LocationRequest;
          import com.google.android.gms.location.LocationResult;
          import com.google.android.gms.location.LocationServices;
          import com.google.android.gms.location.Priority;

          public class LocationService extends Service {

              private FusedLocationProviderClient fusedClient;

              private final LocationCallback callback =
                  new LocationCallback() {
                      @Override
                      public void onLocationResult(LocationResult result){

                          if(result == null) return;

                          android.location.Location location =
                              result.getLastLocation();

                          if(location == null) return;

                          Intent intent =
                              new Intent("WOORIJIP_LOCATION");

                          intent.putExtra(
                              "latitude",
                              location.getLatitude()
                          );

                          intent.putExtra(
                              "longitude",
                              location.getLongitude()
                          );

                          intent.putExtra(
                              "accuracy",
                              location.getAccuracy()
                          );

                          sendBroadcast(intent);
                      }
                  };

              @Override
              public void onCreate(){

                  super.onCreate();

                  fusedClient =
                      LocationServices.getFusedLocationProviderClient(this);

                  createChannel();

                  Notification notification =
                      new NotificationCompat.Builder(
                          this,
                          "location"
                      )
                      .setContentTitle("완후율")
                      .setContentText("위치 공유 중")
                      .setSmallIcon(
                          android.R.drawable.ic_menu_mylocation
                      )
                      .setOngoing(true)
                      .build();

                  startForeground(
                      1001,
                      notification
                  );
              }

              @Override
              public int onStartCommand(
                      Intent intent,
                      int flags,
                      int startId){

                  LocationRequest request =
                      new LocationRequest.Builder(
                          Priority.PRIORITY_HIGH_ACCURACY,
                          10000
                      )
                      .setMinUpdateIntervalMillis(5000)
                      .setMinUpdateDistanceMeters(5)
                      .build();

                  try{
                      fusedClient.requestLocationUpdates(
                          request,
                          callback,
                          getMainLooper()
                      );
                  }catch(SecurityException ignored){}

                  return START_STICKY;
              }

              private void createChannel(){

                  NotificationManager manager =
                      getSystemService(NotificationManager.class);

                  NotificationChannel channel =
                      new NotificationChannel(
                          "location",
                          "위치 공유",
                          NotificationManager.IMPORTANCE_LOW
                      );

                  manager.createNotificationChannel(channel);
              }

              @Override
              public void onDestroy(){

                  if(fusedClient != null)
                      fusedClient.removeLocationUpdates(callback);

                  super.onDestroy();
              }

              @Nullable
              @Override
              public IBinder onBind(Intent intent){
                  return null;
              }
          }
          EOF

      - name: Create native bridge
        run: |
          mkdir -p android/app/src/main/assets/www

          cp www/index.html android/app/src/main/assets/www/index.html

          cat > android/app/src/main/assets/www/native-bridge.js <<'EOF'
          (function(){

            const native = window.WoorijipNative || {};

            let tokenSynced = false;

            function me(){
              try{
                return localStorage.getItem('currentUser') ||
                       localStorage.getItem('userName') ||
                       localStorage.getItem('user_name') ||
                       '';
              }catch(e){
                return '';
              }
            }

            async function syncToken(){

              if(tokenSynced) return;

              if(
                typeof sb === 'undefined' ||
                !native.getFcmToken
              ) return;

              const u = me();
              const t = native.getFcmToken();

              if(!u || !t) return;

              try{

                const {error} =
                  await sb
                    .from('family_fcm_tokens')
                    .upsert(
                      {
                        user_name:u,
                        token:t,
                        updated_at:new Date().toISOString()
                      },
                      {
                        onConflict:'user_name'
                      }
                    );

                if(!error){
                  tokenSynced = true;
                  console.log(
                    'FCM token synced for',
                    u
                  );
                }else{
                  console.warn(
                    'FCM token sync error',
                    error
                  );
                }

              }catch(e){
                console.warn(
                  'FCM token sync failed',
                  e
                );
              }
            }

            setInterval(syncToken,4000);

            function sendPush(type,record){

              if(!native.sendPush) return;

              try{
                native.sendPush(
                  type,
                  JSON.stringify(record || {})
                );
              }catch(e){
                console.warn(
                  'native sendPush failed',
                  e
                );
              }
            }

            const originalDm =
              window.sendDm;

            if(typeof originalDm === 'function'){

              window.sendDm =
                async function(){

                  const input =
                    document.getElementById(
                      'dmInputBox'
                    );

                  const content =
                    input ? input.value.trim() : '';

                  const result =
                    await originalDm.apply(
                      this,
                      arguments
                    );

                  try{

                    const receiver =
                      window.activePersonIndex != null &&
                      Array.isArray(window.familyMembers)
                      ? window.familyMembers[
                          window.activePersonIndex
                        ]
                      : null;

                    if(content && receiver){

                      sendPush(
                        'chat',
                        {
                          sender_name:me(),
                          receiver_name:
                            receiver.name || receiver,
                          content
                        }
                      );
                    }

                  }catch(e){
                    console.warn(e);
                  }

                  return result;
                };
            }

            const originalGroup =
              window.sendGroup;

            if(typeof originalGroup === 'function'){

              window.sendGroup =
                async function(){

                  const input =
                    document.getElementById(
                      'groupInputBox'
                    );

                  const content =
                    input ? input.value.trim() : '';

                  const result =
                    await originalGroup.apply(
                      this,
                      arguments
                    );

                  if(content){

                    sendPush(
                      'group',
                      {
                        sender_name:me(),
                        content
                      }
                    );
                  }

                  return result;
                };
            }

            const originalVideo =
              window.startVideoCall;

            if(typeof originalVideo === 'function'){

              window.startVideoCall =
                async function(){

                  const targetIndex =
                    window.activePersonIndex;

                  const result =
                    await originalVideo.apply(
                      this,
                      arguments
                    );

                  try{

                    const receiver =
                      window.familyMembers &&
                      window.familyMembers[
                        targetIndex
                      ];

                    if(receiver){

                      sendPush(
                        'video',
                        {
                          sender_name:me(),
                          receiver_name:
                            receiver.name || receiver,
                          content:'영상통화'
                        }
                      );
                    }

                  }catch(e){
                    console.warn(
                      'video push failed',
                      e
                    );
                  }

                  return result;
                };
            }

          })();
          EOF

      - name: Generate Gradle wrapper
        run: |
          cd android
          gradle wrapper --gradle-version 8.10.2

      - name: Build APK
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          cd android

          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "$FIREBASE_SERVICE_ACCOUNT_JSON" \
              > app/google-services.json
          fi

          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wanhuyul-apk-v18
          path: android/app/build/outputs/apk/debug/app-debug.apk
