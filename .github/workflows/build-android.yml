name: Build 우리집 Android APK v10 - FCM + VideoCall

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
          accept-android-sdk-licenses: true

      - name: Create Capacitor project files
        shell: bash
        run: |
          set -e

          cat > package.json <<'JSON'
          {
            "private": true,
            "scripts": {
              "build": "node scripts/prepare-web.mjs && node scripts/bundle-native.mjs"
            },
            "dependencies": {
              "@capacitor/android": "8.5.1",
              "@capacitor/cli": "8.5.1",
              "@capacitor/core": "8.5.1",
              "@capgo/background-geolocation": "8.4.5",
              "esbuild": "0.25.9",
              "typescript": "5.9.2"
            }
          }
          JSON

          cat > capacitor.config.ts <<'EOF2'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.woorijip.family',
            appName: '우리집',
            webDir: 'www',
            android: {
              useLegacyBridge: true,
              adjustMarginsForEdgeToEdge: 'force'
            }
          };

          export default config;
          EOF2

          mkdir -p scripts native

          # IMPORTANT:
          # v7 failed because bundle-native.mjs referenced this file,
          # but the file itself was never created.
          cat > native/native-bridge.js <<'EOF2'
          // 우리집 native bridge
          // This file intentionally contains only browser-safe code.
          // Native Android location events are forwarded to the existing app UI.

          (() => {
            const reloadLocations = async (detail) => {
              if (!detail || !detail.user_name) return;

              try {
                if (typeof window.loadFamilyLocations === 'function') {
                  await window.loadFamilyLocations();
                  return;
                }
              } catch (e) {
                console.warn('native location reload', e);
              }

              try {
                if (typeof window.renderLocationList === 'function') {
                  window.renderLocationList();
                }
                if (typeof window.renderHomeLocationDashboard === 'function') {
                  window.renderHomeLocationDashboard();
                }
                if (typeof window.updateHomeLocationMap === 'function') {
                  window.updateHomeLocationMap();
                }
                if (typeof window.updateLocationMarkers === 'function') {
                  window.updateLocationMarkers();
                }
                if (typeof window.updateLocationStatusUI === 'function') {
                  window.updateLocationStatusUI();
                }
              } catch (e) {
                console.warn('native location UI update', e);
              }
            };

            window.addEventListener('native-location-update', (event) => {
              reloadLocations(event.detail);
            });
          })();
          EOF2

          cat > scripts/prepare-web.mjs <<'EOF2'
          import fs from 'node:fs';
          import path from 'node:path';

          const root = process.cwd();
          const out = path.join(root, 'www');

          const excluded = new Set([
            '.git',
            '.github',
            'android',
            'www',
            'node_modules',
            'native',
            'scripts',
            'package.json',
            'package-lock.json',
            'capacitor.config.ts'
          ]);

          fs.rmSync(out, { recursive: true, force: true });
          fs.mkdirSync(out, { recursive: true });

          for (const name of fs.readdirSync(root)) {
            if (excluded.has(name)) continue;

            fs.cpSync(
              path.join(root, name),
              path.join(out, name),
              { recursive: true }
            );
          }

          const htmlPath = path.join(out, 'index.html');

          if (fs.existsSync(htmlPath)) {
            let html = fs.readFileSync(htmlPath, 'utf8');

            if (!html.includes('native-bridge.js')) {
              html = html.replace(
                /<\/body>/i,
                '<script type="module" src="./native-bridge.js"></script>\n</body>'
              );
            }

            const nativeUiCss = `
          <style id="native-android-safe-area">
            body.native-android {
              padding-top: max(env(safe-area-inset-top), 32px);
            }

            body.native-android::before {
              content: '';
              position: fixed;
              left: 0;
              right: 0;
              top: 0;
              height: max(env(safe-area-inset-top), 32px);
              background: rgba(244,249,253,.98);
              z-index: 2147483646;
              pointer-events: none;
            }

            body.native-android #home {
              min-height: calc(100dvh - 124px);
            }

            body.native-android .nav {
              bottom: max(env(safe-area-inset-bottom), 30px) !important;
            }

            body.native-android .dmbar {
              bottom: calc(112px + max(env(safe-area-inset-bottom), 30px)) !important;
              z-index: 100001 !important;
            }

            body.native-android .app {
              padding-bottom: calc(150px + max(env(safe-area-inset-bottom), 30px)) !important;
            }

            body.native-android .dmbody {
              padding-bottom: 170px !important;
              min-height: 0 !important;
              max-height: none !important;
            }

            body.native-android .chat-scrollable.dmbody {
              height: calc(100dvh - 250px) !important;
              min-height: 260px !important;
              padding-bottom: 24px !important;
            }

            body.native-android .page.active {
              padding-bottom: 12px !important;
            }
          </style>
          `;

            const nativeUiBridge = `
          <script>
          (() => {
            document.body.classList.add('native-android');

            const applyNativeLocation = async (detail) => {
              if (!detail || !detail.user_name) return;

              try {
                if (typeof window.loadFamilyLocations === 'function') {
                  await window.loadFamilyLocations();
                  return;
                }
              } catch (e) {
                console.warn('native location reload', e);
              }

              try {
                if (typeof window.renderLocationList === 'function') window.renderLocationList();
                if (typeof window.renderHomeLocationDashboard === 'function') window.renderHomeLocationDashboard();
                if (typeof window.updateHomeLocationMap === 'function') window.updateHomeLocationMap();
                if (typeof window.updateLocationMarkers === 'function') window.updateLocationMarkers();
                if (typeof window.updateLocationStatusUI === 'function') window.updateLocationStatusUI();
              } catch (e) {
                console.warn('native location UI update', e);
              }
            };

            window.addEventListener('native-location-update', e => {
              applyNativeLocation(e.detail);
            });
          })();
          </script>
          `;

            const nativeAppBridge = `
          <script>
          (() => {
            const syncHomeMode = async () => {
              try {
                if (typeof sb === 'undefined' || typeof currentUser === 'undefined') return;
                if (typeof ADMIN_NAME === 'undefined' || currentUser === ADMIN_NAME) return;
                const {data,error}=await sb.from('family_app_settings')
                  .select('value').eq('key','home_display_mode').maybeSingle();
                if(error || !data?.value) return;
                const mode=data.value==='background'?'background':'dashboard';
                if(localStorage.getItem('woorijipRemoteHomeMode')===mode) return;
                localStorage.setItem('woorijipRemoteHomeMode',mode);
                if(typeof setHomeMode==='function'){
                  applyingRemoteHomeMode=true;
                  setHomeMode(mode,{fromRemote:true});
                  applyingRemoteHomeMode=false;
                }
              } catch(e) { console.warn('home mode polling',e); }
            };
            setTimeout(syncHomeMode,700);
            setInterval(syncHomeMode,1800);

            const registerFcmDevice = async () => {
              try {
                if(typeof WoorijipNative==='undefined' || typeof WoorijipNative.getFcmToken!=='function') return;
                if(typeof sb==='undefined' || typeof currentUser==='undefined' || !currentUser) return;
                const token=WoorijipNative.getFcmToken();
                if(!token) return;
                let deviceId=localStorage.getItem('woorijipDeviceId');
                if(!deviceId){
                  deviceId=crypto.randomUUID ? crypto.randomUUID() : ('dev-'+Date.now()+'-'+Math.random().toString(16).slice(2));
                  localStorage.setItem('woorijipDeviceId',deviceId);
                }
                const {error}=await sb.from('family_devices').upsert({
                  device_id:deviceId,user_name:currentUser,fcm_token:token,platform:'android',active:true,updated_at:new Date().toISOString()
                },{onConflict:'device_id'});
                if(error) console.warn('FCM 기기 등록 실패:',error.message);
              } catch(e){ console.warn('FCM 기기 등록 예외:',e); }
            };
            setTimeout(registerFcmDevice,1400);
            setInterval(registerFcmDevice,30000);

            // 채팅 전송 후 서버에서 FCM을 보내도록 연결합니다.
            const push = async (targetUser,title,body,type,data={}) => {
              try {
                if(typeof sb==='undefined') return;
                await sb.functions.invoke('send-push',{body:{
                  target_user:targetUser || null,
                  sender:(typeof currentUser!=='undefined'?currentUser:null),
                  title,body,type,data
                }});
              } catch(e) { console.warn('FCM 발송 요청 실패:',e); }
            };

            const installChatPushHooks = () => {
              try {
                if(typeof window.sendGroup==='function' && !window.sendGroup.__fcmHooked){
                  const original=window.sendGroup;
                  const wrapped=async function(){
                    const box=document.getElementById('groupInputBox');
                    const text=box?.value?.trim()||'';
                    const result=await original.apply(this,arguments);
                    if(text) await push(null,\`👨‍👩‍👧‍👦 가족톡\`,\`\${typeof currentUser!=='undefined'?currentUser:'가족'}: \${text}\`,'message',{scope:'group'});
                    return result;
                  };
                  wrapped.__fcmHooked=true;
                  window.sendGroup=wrapped;
                }
                if(typeof window.sendDm==='function' && !window.sendDm.__fcmHooked){
                  const original=window.sendDm;
                  const wrapped=async function(){
                    const box=document.getElementById('dmInputBox');
                    const text=box?.value?.trim()||'';
                    const target=(typeof activePersonIndex!=='undefined' && activePersonIndex!==null && typeof family!=='undefined') ? family[activePersonIndex] : null;
                    const result=await original.apply(this,arguments);
                    if(text && target) await push(target,\`💬 \${typeof currentUser!=='undefined'?currentUser:'가족'}\`,text,'message',{scope:'dm',from:(typeof currentUser!=='undefined'?currentUser:''),to:target});
                    return result;
                  };
                  wrapped.__fcmHooked=true;
                  window.sendDm=wrapped;
                }
                if(typeof window.sendVideoSignal==='function' && !window.sendVideoSignal.__fcmHooked){
                  const original=window.sendVideoSignal;
                  const wrapped=function(payload){
                    const result=original.apply(this,arguments);
                    try{
                      if(payload?.type==='invite' && payload.to){
                        push(payload.to,\`📞 \${payload.from||'가족'}님이 영상통화를 걸었습니다.\`,\`영상통화가 왔어요. 눌러서 받으세요.\`,'call',{from:payload.from||'',to:payload.to});
                      }
                    }catch(e){}
                    return result;
                  };
                  wrapped.__fcmHooked=true;
                  window.sendVideoSignal=wrapped;
                }
                return !!(window.sendGroup?.__fcmHooked && window.sendDm?.__fcmHooked && window.sendVideoSignal?.__fcmHooked);
              } catch(e){ return false; }
            };
            let hookTries=0;
            const hookTimer=setInterval(()=>{ if(installChatPushHooks() || ++hookTries>80) clearInterval(hookTimer); },250);

            const restorePendingCall = () => {
              try {
                if(typeof WoorijipNative==='undefined' || typeof WoorijipNative.getPendingPush!=='function') return;
                const raw=WoorijipNative.getPendingPush();
                if(!raw) return;
                const data=JSON.parse(raw);
                if(data.type==='call' && data.from){
                  const attempt=()=>{
                    try {
                      if(typeof videoIncomingFrom!=='undefined' && !videoIncomingFrom && typeof showIncomingVideoCall==='function'){
                        videoIncomingFrom=data.from;
                        videoTargetUser=data.from;
                        showIncomingVideoCall(data.from);
                        WoorijipNative.clearPendingPush?.();
                        return true;
                      }
                    } catch(e) {}
                    return false;
                  };
                  let n=0;
                  const timer=setInterval(()=>{ if(attempt() || ++n>40) clearInterval(timer); },250);
                } else {
                  WoorijipNative.clearPendingPush?.();
                }
              } catch(e){ console.warn('pending FCM 처리',e); }
            };
            setTimeout(restorePendingCall,1200);
          })();
          </script>
          `;

            html = html.replace(/<\/head>/i, nativeUiCss + '</head>');
            html = html.replace(/<\/body>/i, nativeUiBridge + nativeAppBridge + '</body>');

            fs.writeFileSync(htmlPath, html);
          }
          EOF2

          cat > scripts/bundle-native.mjs <<'EOF2'
          import { build } from 'esbuild';

          await build({
            entryPoints: ['./native/native-bridge.js'],
            bundle: true,
            format: 'esm',
            platform: 'browser',
            target: 'es2022',
            outfile: 'www/native-bridge.js',
            minify: false
          });
          EOF2

          cat > scripts/patch-firebase.mjs <<'EOF2'
          import fs from 'node:fs';
          import path from 'node:path';

          const appGradleCandidates = [
            'android/app/build.gradle',
            'android/app/build.gradle.kts'
          ];
          const rootGradleCandidates = [
            'android/build.gradle',
            'android/build.gradle.kts'
          ];

          const appGradle = appGradleCandidates.find(fs.existsSync);
          const rootGradle = rootGradleCandidates.find(fs.existsSync);

          if (!appGradle || !rootGradle) {
            throw new Error('Could not find generated Android Gradle files.');
          }

          let root = fs.readFileSync(rootGradle, 'utf8');
          let app = fs.readFileSync(appGradle, 'utf8');

          if (rootGradle.endsWith('.kts')) {
            if (!root.includes('com.google.gms.google-services')) {
              const marker = 'plugins {';
              if (root.includes(marker)) {
                root = root.replace(
                  marker,
                  `${marker}\n    id("com.google.gms.google-services") version "4.5.0" apply false`
                );
              } else {
                root += '\nplugins { id("com.google.gms.google-services") version "4.5.0" apply false }\n';
              }
            }

            if (!app.includes('id("com.google.gms.google-services")')) {
              app = app.replace(
                'plugins {',
                'plugins {\n    id("com.google.gms.google-services")'
              );
            }

            if (!app.includes('com.google.firebase:firebase-bom')) {
              app += `\n\ndependencies {
              implementation(platform("com.google.firebase:firebase-bom:34.18.0"))
              implementation("com.google.firebase:firebase-messaging")
            }\n`;
            }
          } else {
            if (!root.includes('com.google.gms:google-services')) {
              if (root.includes('buildscript')) {
                root = root.replace(
                  /dependencies\s*\{/,
                  `dependencies {\n        classpath 'com.google.gms:google-services:4.5.0'`
                );
              } else {
                root = `buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.google.gms:google-services:4.5.0'
              }
            }\n\n${root}`;
              }
            }

            if (!app.includes("com.google.gms.google-services")) {
              app += "\napply plugin: 'com.google.gms.google-services'\n";
            }

            if (!app.includes('com.google.firebase:firebase-bom')) {
              app += `\n\ndependencies {
              implementation platform('com.google.firebase:firebase-bom:34.18.0')
              implementation 'com.google.firebase:firebase-messaging'
            }\n`;
            }
          }

          fs.writeFileSync(rootGradle, root);
          fs.writeFileSync(appGradle, app);

          // Add a native FirebaseMessagingService.
          const javaDir = 'android/app/src/main/java/com/woorijip/family';
          fs.mkdirSync(javaDir, { recursive: true });

          const servicePath = path.join(javaDir, 'WoorijipFirebaseMessagingService.java');

          fs.writeFileSync(servicePath, `package com.woorijip.family;

          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.os.Build;

          import androidx.annotation.NonNull;
          import androidx.core.app.NotificationCompat;
          import androidx.core.app.NotificationManagerCompat;

          import com.google.firebase.messaging.FirebaseMessagingService;
          import com.google.firebase.messaging.RemoteMessage;

          public class WoorijipFirebaseMessagingService extends FirebaseMessagingService {
            private static final String PREFS = "woorijip_native";
            private static final String TOKEN_KEY = "fcm_token";
            private static final String GENERAL_CHANNEL = "woorijip_general";
            private static final String CALL_CHANNEL = "woorijip_calls";

            @Override
            public void onNewToken(@NonNull String token) {
              super.onNewToken(token);
              getSharedPreferences(PREFS, MODE_PRIVATE)
                  .edit()
                  .putString(TOKEN_KEY, token)
                  .apply();
            }

            @Override
            public void onMessageReceived(@NonNull RemoteMessage message) {
              super.onMessageReceived(message);

              String title = message.getData().get("title");
              String body = message.getData().get("body");
              String type = message.getData().get("type");

              if (title == null || title.isEmpty()) title = "우리집";
              if (body == null || body.isEmpty()) body = "새로운 알림이 있습니다.";

              boolean isCall = "call".equals(type);
              if (isCall || message.getData().containsKey("from")) {
                try {
                  org.json.JSONObject obj = new org.json.JSONObject();
                  for (java.util.Map.Entry<String,String> entry : message.getData().entrySet()) {
                    obj.put(entry.getKey(), entry.getValue());
                  }
                  getSharedPreferences(PREFS, MODE_PRIVATE).edit()
                    .putString("pending_push", obj.toString()).apply();
                } catch (Exception ignored) {}
              }
              showNotification(title, body, isCall, message.getData());
            }

            private void showNotification(
                String title,
                String body,
                boolean isCall,
                java.util.Map<String, String> data) {

              String channelId = isCall ? CALL_CHANNEL : GENERAL_CHANNEL;
              NotificationManager manager =
                  (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);

              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                int importance = isCall
                    ? NotificationManager.IMPORTANCE_HIGH
                    : NotificationManager.IMPORTANCE_DEFAULT;

                NotificationChannel channel =
                    new NotificationChannel(channelId, isCall ? "영상통화" : "우리집 알림", importance);

                if (isCall) {
                  channel.setDescription("우리집 영상통화 수신 알림");
                  channel.enableVibration(true);
                }

                manager.createNotificationChannel(channel);
              }

              Intent intent = new Intent(this, MainActivity.class);
              intent.addFlags(Intent.FLAG_ACTIVITY_CLEAR_TOP | Intent.FLAG_ACTIVITY_SINGLE_TOP);

              for (java.util.Map.Entry<String, String> entry : data.entrySet()) {
                intent.putExtra(entry.getKey(), entry.getValue());
              }

              PendingIntent pendingIntent = PendingIntent.getActivity(
                  this,
                  isCall ? 1001 : 1002,
                  intent,
                  PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
              );

              NotificationCompat.Builder builder =
                  new NotificationCompat.Builder(this, channelId)
                      .setSmallIcon(android.R.drawable.ic_dialog_info)
                      .setContentTitle(title)
                      .setContentText(body)
                      .setStyle(new NotificationCompat.BigTextStyle().bigText(body))
                      .setPriority(isCall
                          ? NotificationCompat.PRIORITY_MAX
                          : NotificationCompat.PRIORITY_DEFAULT)
                      .setAutoCancel(true)
                      .setContentIntent(pendingIntent);

              if (isCall) {
                builder.setCategory(NotificationCompat.CATEGORY_CALL)
                    .setOngoing(true)
                    .setFullScreenIntent(pendingIntent, false);
              }

              NotificationManagerCompat.from(this).notify(
                  isCall ? 1001 : (int)(System.currentTimeMillis() & 0x7fffffff),
                  builder.build()
              );
            }
          }
          `);

          // Register the messaging service in AndroidManifest.xml.
          const manifestPath = 'android/app/src/main/AndroidManifest.xml';
          let manifest = fs.readFileSync(manifestPath, 'utf8');

          if (!manifest.includes('WoorijipFirebaseMessagingService')) {
            manifest = manifest.replace(
              '</application>',
              `    <service
                android:name=".WoorijipFirebaseMessagingService"
                android:exported="false">
                <intent-filter>
                  <action android:name="com.google.firebase.MESSAGING_EVENT" />
                </intent-filter>
              </service>
            </application>`
            );
          }

          fs.writeFileSync(manifestPath, manifest);
          EOF2

          cat > scripts/patch-android.mjs <<'EOF2'
          import fs from 'node:fs';

          const manifestPath = 'android/app/src/main/AndroidManifest.xml';
          let manifest = fs.readFileSync(manifestPath, 'utf8');

          const permissions = [
            'android.permission.ACCESS_COARSE_LOCATION',
            'android.permission.ACCESS_FINE_LOCATION',
            'android.permission.ACCESS_BACKGROUND_LOCATION',
            'android.permission.FOREGROUND_SERVICE',
            'android.permission.FOREGROUND_SERVICE_LOCATION',
            'android.permission.POST_NOTIFICATIONS',
            'android.permission.CAMERA',
            'android.permission.RECORD_AUDIO'
          ];

          for (const permission of permissions) {
            if (!manifest.includes(`android:name="${permission}"`)) {
              manifest = manifest.replace(
                '<application',
                `<uses-permission android:name="${permission}" />\n    <application`
              );
            }
          }

          fs.writeFileSync(manifestPath, manifest);

          const activityPath =
            'android/app/src/main/java/com/woorijip/family/MainActivity.java';

          if (fs.existsSync(activityPath)) {
            fs.writeFileSync(activityPath, `package com.woorijip.family;

          import android.Manifest;
          import android.content.Context;
          import android.content.pm.PackageManager;
          import android.content.Intent;
          import android.os.Bundle;
          import android.webkit.JavascriptInterface;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebView;

          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;

          import com.getcapacitor.BridgeActivity;
          import com.google.firebase.messaging.FirebaseMessaging;

          import org.json.JSONObject;

          public class MainActivity extends BridgeActivity {
            private static final int PERMISSION_REQUEST_CODE = 9001;
            private static final String PREFS = "woorijip_native";
            private static final String PUSH_KEY = "pending_push";

            public class NativeFirebaseBridge {
              @JavascriptInterface
              public String getFcmToken() {
                return getSharedPreferences(PREFS, MODE_PRIVATE).getString("fcm_token", "");
              }

              @JavascriptInterface
              public String getPendingPush() {
                return getSharedPreferences(PREFS, MODE_PRIVATE).getString(PUSH_KEY, "");
              }

              @JavascriptInterface
              public void clearPendingPush() {
                getSharedPreferences(PREFS, MODE_PRIVATE).edit().remove(PUSH_KEY).apply();
              }
            }

            private void requestMediaAndNotificationPermissions() {
              java.util.ArrayList<String> needed = new java.util.ArrayList<>();
              if (android.os.Build.VERSION.SDK_INT >= 33 &&
                  ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                needed.add(Manifest.permission.POST_NOTIFICATIONS);
              }
              if (ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) {
                needed.add(Manifest.permission.CAMERA);
              }
              if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                needed.add(Manifest.permission.RECORD_AUDIO);
              }
              if (!needed.isEmpty()) {
                ActivityCompat.requestPermissions(this, needed.toArray(new String[0]), PERMISSION_REQUEST_CODE);
              }
            }

            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              requestMediaAndNotificationPermissions();

              final WebView webView = getBridge().getWebView();
              if (webView != null) {
                webView.setWebChromeClient(new WebChromeClient() {
                  @Override
                  public void onPermissionRequest(final PermissionRequest request) {
                    runOnUiThread(() -> {
                      boolean camera = ContextCompat.checkSelfPermission(MainActivity.this, Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED;
                      boolean mic = ContextCompat.checkSelfPermission(MainActivity.this, Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED;
                      if (camera && mic) {
                        request.grant(request.getResources());
                      } else {
                        request.deny();
                      }
                    });
                  }
                });

                webView.setOnApplyWindowInsetsListener((view, insets) -> {
                  final int statusBarTop = insets.getSystemWindowInsetTop();
                  final int navBarBottom = insets.getSystemWindowInsetBottom();
                  view.setPadding(0, statusBarTop, 0, navBarBottom);
                  return insets.replaceSystemWindowInsets(
                    insets.getSystemWindowInsetLeft(), statusBarTop,
                    insets.getSystemWindowInsetRight(), 0
                  );
                });

                webView.addJavascriptInterface(new NativeFirebaseBridge(), "WoorijipNative");
                FirebaseMessaging.getInstance().getToken()
                  .addOnSuccessListener(token -> getSharedPreferences(PREFS, MODE_PRIVATE)
                    .edit().putString("fcm_token", token).apply());
                webView.requestApplyInsets();
              }
            }

            @Override
            protected void onNewIntent(Intent intent) {
              super.onNewIntent(intent);
              setIntent(intent);
            }
          }
          `);
          }
          EOF2

          npm install
          npm run build
          npx cap add android
          npx cap sync android

          # Firebase Android configuration supplied for com.woorijip.family.
          mkdir -p android/app
          echo '' | base64 --decode > android/app/google-services.json

          node scripts/patch-android.mjs
          node scripts/patch-firebase.mjs

      - name: Build Debug APK
        shell: bash
        run: |
          set -e
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 우리집-debug-v10
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
