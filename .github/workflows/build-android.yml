name: Build 우리집 Android APK v9 - FCM

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
          accept-android-sdk-licenses: true

      - name: Create Capacitor project files
        shell: bash
        run: |
          set -e

          cat > package.json <<'JSON'
          {
            "private": true,
            "scripts": {
              "build": "node scripts/prepare-web.mjs && node scripts/bundle-native.mjs"
            },
            "dependencies": {
              "@capacitor/android": "8.5.1",
              "@capacitor/cli": "8.5.1",
              "@capacitor/core": "8.5.1",
              "@capgo/background-geolocation": "8.4.5",
              "esbuild": "0.25.9",
              "typescript": "5.9.2"
            }
          }
          JSON

          cat > capacitor.config.ts <<'EOF2'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.woorijip.family',
            appName: '우리집',
            webDir: 'www',
            android: {
              useLegacyBridge: true,
              adjustMarginsForEdgeToEdge: 'force'
            }
          };

          export default config;
          EOF2

          mkdir -p scripts native

          # IMPORTANT:
          # v7 failed because bundle-native.mjs referenced this file,
          # but the file itself was never created.
          cat > native/native-bridge.js <<'EOF2'
          // 우리집 native bridge
          // This file intentionally contains only browser-safe code.
          // Native Android location events are forwarded to the existing app UI.

          (() => {
            const reloadLocations = async (detail) => {
              if (!detail || !detail.user_name) return;

              try {
                if (typeof window.loadFamilyLocations === 'function') {
                  await window.loadFamilyLocations();
                  return;
                }
              } catch (e) {
                console.warn('native location reload', e);
              }

              try {
                if (typeof window.renderLocationList === 'function') {
                  window.renderLocationList();
                }
                if (typeof window.renderHomeLocationDashboard === 'function') {
                  window.renderHomeLocationDashboard();
                }
                if (typeof window.updateHomeLocationMap === 'function') {
                  window.updateHomeLocationMap();
                }
                if (typeof window.updateLocationMarkers === 'function') {
                  window.updateLocationMarkers();
                }
                if (typeof window.updateLocationStatusUI === 'function') {
                  window.updateLocationStatusUI();
                }
              } catch (e) {
                console.warn('native location UI update', e);
              }
            };

            window.addEventListener('native-location-update', (event) => {
              reloadLocations(event.detail);
            });
          })();
          EOF2

          cat > scripts/prepare-web.mjs <<'EOF2'
          import fs from 'node:fs';
          import path from 'node:path';

          const root = process.cwd();
          const out = path.join(root, 'www');

          const excluded = new Set([
            '.git',
            '.github',
            'android',
            'www',
            'node_modules',
            'native',
            'scripts',
            'package.json',
            'package-lock.json',
            'capacitor.config.ts'
          ]);

          fs.rmSync(out, { recursive: true, force: true });
          fs.mkdirSync(out, { recursive: true });

          for (const name of fs.readdirSync(root)) {
            if (excluded.has(name)) continue;

            fs.cpSync(
              path.join(root, name),
              path.join(out, name),
              { recursive: true }
            );
          }

          const htmlPath = path.join(out, 'index.html');

          if (fs.existsSync(htmlPath)) {
            let html = fs.readFileSync(htmlPath, 'utf8');

            if (!html.includes('native-bridge.js')) {
              html = html.replace(
                /<\/body>/i,
                '<script type="module" src="./native-bridge.js"></script>\n</body>'
              );
            }

            const nativeUiCss = `
          <style id="native-android-safe-area">
            body.native-android {
              padding-top: max(env(safe-area-inset-top), 32px);
            }

            body.native-android::before {
              content: '';
              position: fixed;
              left: 0;
              right: 0;
              top: 0;
              height: max(env(safe-area-inset-top), 32px);
              background: rgba(244,249,253,.98);
              z-index: 2147483646;
              pointer-events: none;
            }

            body.native-android #home {
              min-height: calc(100dvh - 124px);
            }

            body.native-android .nav {
              bottom: max(env(safe-area-inset-bottom), 30px) !important;
            }

            body.native-android .dmbar {
              bottom: calc(114px + max(env(safe-area-inset-bottom), 30px)) !important;
            }

            body.native-android .app {
              padding-bottom: calc(122px + max(env(safe-area-inset-bottom), 30px)) !important;
            }
          </style>
          `;

            const nativeUiBridge = `
          <script>
          (() => {
            document.body.classList.add('native-android');

            const applyNativeLocation = async (detail) => {
              if (!detail || !detail.user_name) return;

              try {
                if (typeof window.loadFamilyLocations === 'function') {
                  await window.loadFamilyLocations();
                  return;
                }
              } catch (e) {
                console.warn('native location reload', e);
              }

              try {
                if (typeof window.renderLocationList === 'function') window.renderLocationList();
                if (typeof window.renderHomeLocationDashboard === 'function') window.renderHomeLocationDashboard();
                if (typeof window.updateHomeLocationMap === 'function') window.updateHomeLocationMap();
                if (typeof window.updateLocationMarkers === 'function') window.updateLocationMarkers();
                if (typeof window.updateLocationStatusUI === 'function') window.updateLocationStatusUI();
              } catch (e) {
                console.warn('native location UI update', e);
              }
            };

            window.addEventListener('native-location-update', e => {
              applyNativeLocation(e.detail);
            });
          })();
          </script>
          `;

            html = html.replace(/<\/head>/i, nativeUiCss + '</head>');
            html = html.replace(/<\/body>/i, nativeUiBridge + '</body>');

            fs.writeFileSync(htmlPath, html);
          }
          EOF2

          cat > scripts/bundle-native.mjs <<'EOF2'
          import { build } from 'esbuild';

          await build({
            entryPoints: ['./native/native-bridge.js'],
            bundle: true,
            format: 'esm',
            platform: 'browser',
            target: 'es2022',
            outfile: 'www/native-bridge.js',
            minify: false
          });
          EOF2

          cat > scripts/patch-firebase.mjs <<'EOF2'
          import fs from 'node:fs';
          import path from 'node:path';

          const appGradleCandidates = [
            'android/app/build.gradle',
            'android/app/build.gradle.kts'
          ];
          const rootGradleCandidates = [
            'android/build.gradle',
            'android/build.gradle.kts'
          ];

          const appGradle = appGradleCandidates.find(fs.existsSync);
          const rootGradle = rootGradleCandidates.find(fs.existsSync);

          if (!appGradle || !rootGradle) {
            throw new Error('Could not find generated Android Gradle files.');
          }

          let root = fs.readFileSync(rootGradle, 'utf8');
          let app = fs.readFileSync(appGradle, 'utf8');

          if (rootGradle.endsWith('.kts')) {
            if (!root.includes('com.google.gms.google-services')) {
              const marker = 'plugins {';
              if (root.includes(marker)) {
                root = root.replace(
                  marker,
                  `${marker}\n    id("com.google.gms.google-services") version "4.5.0" apply false`
                );
              } else {
                root += '\nplugins { id("com.google.gms.google-services") version "4.5.0" apply false }\n';
              }
            }

            if (!app.includes('id("com.google.gms.google-services")')) {
              app = app.replace(
                'plugins {',
                'plugins {\n    id("com.google.gms.google-services")'
              );
            }

            if (!app.includes('com.google.firebase:firebase-bom')) {
              app += `\n\ndependencies {
              implementation(platform("com.google.firebase:firebase-bom:34.18.0"))
              implementation("com.google.firebase:firebase-messaging")
            }\n`;
            }
          } else {
            if (!root.includes('com.google.gms:google-services')) {
              if (root.includes('buildscript')) {
                root = root.replace(
                  /dependencies\s*\{/,
                  `dependencies {\n        classpath 'com.google.gms:google-services:4.5.0'`
                );
              } else {
                root = `buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.google.gms:google-services:4.5.0'
              }
            }\n\n${root}`;
              }
            }

            if (!app.includes("com.google.gms.google-services")) {
              app += "\napply plugin: 'com.google.gms.google-services'\n";
            }

            if (!app.includes('com.google.firebase:firebase-bom')) {
              app += `\n\ndependencies {
              implementation platform('com.google.firebase:firebase-bom:34.18.0')
              implementation 'com.google.firebase:firebase-messaging'
            }\n`;
            }
          }

          fs.writeFileSync(rootGradle, root);
          fs.writeFileSync(appGradle, app);

          // Add a native FirebaseMessagingService.
          const javaDir = 'android/app/src/main/java/com/woorijip/family';
          fs.mkdirSync(javaDir, { recursive: true });

          const servicePath = path.join(javaDir, 'WoorijipFirebaseMessagingService.java');

          fs.writeFileSync(servicePath, `package com.woorijip.family;

          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.os.Build;

          import androidx.annotation.NonNull;
          import androidx.core.app.NotificationCompat;
          import androidx.core.app.NotificationManagerCompat;

          import com.google.firebase.messaging.FirebaseMessagingService;
          import com.google.firebase.messaging.RemoteMessage;

          public class WoorijipFirebaseMessagingService extends FirebaseMessagingService {
            private static final String PREFS = "woorijip_native";
            private static final String TOKEN_KEY = "fcm_token";
            private static final String GENERAL_CHANNEL = "woorijip_general";
            private static final String CALL_CHANNEL = "woorijip_calls";

            @Override
            public void onNewToken(@NonNull String token) {
              super.onNewToken(token);
              getSharedPreferences(PREFS, MODE_PRIVATE)
                  .edit()
                  .putString(TOKEN_KEY, token)
                  .apply();
            }

            @Override
            public void onMessageReceived(@NonNull RemoteMessage message) {
              super.onMessageReceived(message);

              String title = message.getData().get("title");
              String body = message.getData().get("body");
              String type = message.getData().get("type");

              if (title == null || title.isEmpty()) title = "우리집";
              if (body == null || body.isEmpty()) body = "새로운 알림이 있습니다.";

              showNotification(title, body, "call".equals(type), message.getData());
            }

            private void showNotification(
                String title,
                String body,
                boolean isCall,
                java.util.Map<String, String> data) {

              String channelId = isCall ? CALL_CHANNEL : GENERAL_CHANNEL;
              NotificationManager manager =
                  (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);

              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                int importance = isCall
                    ? NotificationManager.IMPORTANCE_HIGH
                    : NotificationManager.IMPORTANCE_DEFAULT;

                NotificationChannel channel =
                    new NotificationChannel(channelId, isCall ? "영상통화" : "우리집 알림", importance);

                if (isCall) {
                  channel.setDescription("우리집 영상통화 수신 알림");
                  channel.enableVibration(true);
                }

                manager.createNotificationChannel(channel);
              }

              Intent intent = new Intent(this, MainActivity.class);
              intent.addFlags(Intent.FLAG_ACTIVITY_CLEAR_TOP | Intent.FLAG_ACTIVITY_SINGLE_TOP);

              for (java.util.Map.Entry<String, String> entry : data.entrySet()) {
                intent.putExtra(entry.getKey(), entry.getValue());
              }

              PendingIntent pendingIntent = PendingIntent.getActivity(
                  this,
                  isCall ? 1001 : 1002,
                  intent,
                  PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
              );

              NotificationCompat.Builder builder =
                  new NotificationCompat.Builder(this, channelId)
                      .setSmallIcon(android.R.drawable.ic_dialog_info)
                      .setContentTitle(title)
                      .setContentText(body)
                      .setStyle(new NotificationCompat.BigTextStyle().bigText(body))
                      .setPriority(isCall
                          ? NotificationCompat.PRIORITY_MAX
                          : NotificationCompat.PRIORITY_DEFAULT)
                      .setAutoCancel(true)
                      .setContentIntent(pendingIntent);

              if (isCall) {
                builder.setCategory(NotificationCompat.CATEGORY_CALL)
                    .setOngoing(true)
                    .setFullScreenIntent(pendingIntent, false);
              }

              NotificationManagerCompat.from(this).notify(
                  isCall ? 1001 : (int)(System.currentTimeMillis() & 0x7fffffff),
                  builder.build()
              );
            }
          }
          `);

          // Register the messaging service in AndroidManifest.xml.
          const manifestPath = 'android/app/src/main/AndroidManifest.xml';
          let manifest = fs.readFileSync(manifestPath, 'utf8');

          if (!manifest.includes('WoorijipFirebaseMessagingService')) {
            manifest = manifest.replace(
              '</application>',
              `    <service
                android:name=".WoorijipFirebaseMessagingService"
                android:exported="false">
                <intent-filter>
                  <action android:name="com.google.firebase.MESSAGING_EVENT" />
                </intent-filter>
              </service>
            </application>`
            );
          }

          fs.writeFileSync(manifestPath, manifest);
          EOF2

          cat > scripts/patch-android.mjs <<'EOF2'
          import fs from 'node:fs';

          const manifestPath = 'android/app/src/main/AndroidManifest.xml';
          let manifest = fs.readFileSync(manifestPath, 'utf8');

          const permissions = [
            'android.permission.ACCESS_COARSE_LOCATION',
            'android.permission.ACCESS_FINE_LOCATION',
            'android.permission.ACCESS_BACKGROUND_LOCATION',
            'android.permission.FOREGROUND_SERVICE',
            'android.permission.FOREGROUND_SERVICE_LOCATION',
            'android.permission.POST_NOTIFICATIONS'
          ];

          for (const permission of permissions) {
            if (!manifest.includes(`android:name="${permission}"`)) {
              manifest = manifest.replace(
                '<application',
                `<uses-permission android:name="${permission}" />\n    <application`
              );
            }
          }

          fs.writeFileSync(manifestPath, manifest);

          const activityPath =
            'android/app/src/main/java/com/woorijip/family/MainActivity.java';

          if (fs.existsSync(activityPath)) {
            fs.writeFileSync(activityPath, `package com.woorijip.family;

          import android.os.Bundle;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import com.getcapacitor.BridgeActivity;
          import com.google.firebase.messaging.FirebaseMessaging;

          public class MainActivity extends BridgeActivity {

            public class NativeFirebaseBridge {
              @JavascriptInterface
              public String getFcmToken() {
                return getSharedPreferences("woorijip_native", MODE_PRIVATE)
                    .getString("fcm_token", "");
              }
            }

            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);

              if (android.os.Build.VERSION.SDK_INT >= 33) {
                requestPermissions(
                  new String[]{android.Manifest.permission.POST_NOTIFICATIONS},
                  9001
                );
              }

              final android.webkit.WebView webView = getBridge().getWebView();
              if (webView != null) {
                webView.setOnApplyWindowInsetsListener((view, insets) -> {
                  final int statusBarTop = insets.getSystemWindowInsetTop();
                  final int navBarBottom = insets.getSystemWindowInsetBottom();

                  view.setPadding(0, statusBarTop, 0, navBarBottom);

                  return insets.replaceSystemWindowInsets(
                    insets.getSystemWindowInsetLeft(),
                    statusBarTop,
                    insets.getSystemWindowInsetRight(),
                    0
                  );
                });

                webView.addJavascriptInterface(new NativeFirebaseBridge(), "WoorijipNative");
                FirebaseMessaging.getInstance().getToken()
                  .addOnSuccessListener(token ->
                    getSharedPreferences("woorijip_native", MODE_PRIVATE)
                      .edit().putString("fcm_token", token).apply()
                  );
                webView.requestApplyInsets();
              }
            }
          }
          `);
          }
          EOF2

          npm install
          npm run build
          npx cap add android
          npx cap sync android

          # Firebase Android configuration supplied for com.woorijip.family.
          mkdir -p android/app
          echo '' | base64 --decode > android/app/google-services.json

          node scripts/patch-android.mjs
          node scripts/patch-firebase.mjs

      - name: Build Debug APK
        shell: bash
        run: |
          set -e
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 우리집-debug-v9
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
