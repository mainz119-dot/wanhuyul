name: Build 우리집 Android APK v60 - reliable video push

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  patch-and-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch video push safely
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path

          p = Path(".github/workflows/build-android-v59-final.yml")
          s = p.read_text(encoding="utf-8")
          needle = "sendVideoSignal({type:'invite',from:currentUser,to:name});"
          lines = s.splitlines()

          # v59 already has an older patched caller. Select ONLY the line that
          # is exactly the original caller, ignoring the embedded old patch.
          matches = [i for i, line in enumerate(lines) if line.strip() == needle]

          if len(matches) != 1:
              print("Expected exactly 1 ORIGINAL video signal caller, found", len(matches))
              for i, line in enumerate(lines):
                  if "sendVideoSignal({type:'invite'" in line:
                      print(f"{i+1}: {line}")
              raise SystemExit(1)

          lines[matches[0]:matches[0]+1] = "try{\n  const controller=new AbortController();\n  const timer=setTimeout(()=>controller.abort(),8000);\n  const r=await fetch(SUPABASE_URL+'/functions/v1/send-push',{\n    method:'POST',\n    headers:{\n      'Content-Type':'application/json',\n      'apikey':SUPABASE_KEY,\n      'Authorization':'Bearer '+SUPABASE_KEY\n    },\n    body:JSON.stringify({\n      record:{\n        sender_name:currentUser,\n        receiver_name:name,\n        content:'영상통화'\n      },\n      type:'video'\n    }),\n    signal:controller.signal\n  });\n  clearTimeout(timer);\n  const body=await r.text();\n  console.log('[v60] VIDEO PUSH HTTP',r.status,body);\n  if(!r.ok) throw new Error('send-push HTTP '+r.status+': '+body);\n}catch(e){\n  console.warn('[v60] video push failed, continuing call',e);\n}\nsendVideoSignal({type:'invite',from:currentUser,to:name});".splitlines()
          s = "\n".join(lines) + ("\n" if s.endswith("\n") else "")

          s = s.replace(
              "name: Build 우리집 Android APK v59 - direct-video-push",
              "name: Build 우리집 Android APK v60 - reliable video push"
          )
          s = s.replace(
              "name: wanhuyul-apk-v59-direct-video-push",
              "name: wanhuyul-apk-v60-reliable-video-push"
          )

          p.write_text(s, encoding="utf-8")
          print("v60 patch applied successfully")
          PY

      - name: Commit v60 patch into build workflow
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/build-android-v59-final.yml
          git diff --cached --quiet || git commit -m "fix: reliable video push for v60"
          git push origin HEAD:main

      - name: Run v60 Android build
        shell: bash
        run: |
          set -e
          gh workflow run build-android-v59-final.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
